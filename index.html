    msgs.slice(1).forEach(m=>{ if(m.r==="me") turns.push({role:"user",content:m.t}); else turns.push({role:"assistant",content:m.raw||m.t}); });
    const ai = {r:"ai",t:"…"}; msgs.push(ai); chat();
    const ch = $("#ch",el);
    ctrl = new AbortController();
    try{
      const r = await AI(turns,{modelTier:"quick",cache:false,signal:ctrl.signal,onText:({text})=>{ const last=ch.lastElementChild; if(last){ last.textContent = text.split(/\n?Correction:/)[0]; ch.scrollTop = ch.scrollHeight; } }});
      const raw = r.text.trim(), parts = raw.split(/\n?\s*Correction:\s*/);
      ai.raw = raw; ai.t = parts[0].trim(); ai.fix = parts[1] ? parts[1].trim() : "";
      addXP(2); speak(ai.t);
    }catch(e){ ai.t = aiErr(e); }
    busy = false; if(document.body.contains(el) && role) chat();
  }
  pickRole();
}
function dlgTurns(d){ return d.lines.filter(l=>l[0]==="me").length; }
function blockDialogs(el,startId){
  function list(){
    keyH = null;
    el.innerHTML = `<div class="stack">
      <p class="muted">Situações reais com roteiro. O outro personagem fala — <b>ouça antes de ler</b>. Na sua vez, escolha a resposta mais natural (as erradas são erros típicos de brasileiros) e repita em voz alta. Funciona sem internet e sem IA.</p>
      <label class="row small" style="font-weight:400;cursor:pointer"><input type="checkbox" id="dlgsp" ${S.settings.dlgSpeak?"checked":""} style="accent-color:var(--acc)"> Modo desafio: responder em voz alta antes de ver as opções</label>
      <div class="tiles">${DIALOGS.map((d,i)=>{ const b=S.dialogs[d.id]; return `<button class="card tile" data-d="${i}"><span class="tag">${esc(d.lvl)}</span><h3>${esc(d.t)}</h3><p>${esc(d.d)}</p><span class="small mono ${b==null?"muted":""}">${b==null?"não feito":"melhor: "+b+"/"+dlgTurns(d)}</span></button>`; }).join("")}</div></div>`;
    $("#dlgsp",el).onchange = e=>{ S.settings.dlgSpeak = e.target.checked; save(); };
    $$("[data-d]",el).forEach(b=>b.onclick=()=>play(DIALOGS[+b.dataset.d]));
  }
  function play(d){
    let i = 0, right = 0, tries = 0, opts = null, revealed = false, feedback = "", confirm = null;
    const hist = [];
    function advance(){
      let said = "";
      while(i<d.lines.length && d.lines[i][0]==="a"){ hist.push({r:"ai",t:d.lines[i][1]}); said = d.lines[i][1]; i++; }
      opts = null; revealed = !S.settings.dlgSpeak; tries = 0; feedback = "";
      draw(); if(said) speak(said);
    }
    function draw(){
      const turn = i<d.lines.length ? d.lines[i] : null;
      if(turn && !opts && !confirm) opts = shuffle(turn[2]);
      const done = hist.filter(h=>h.r==="me").length;
      el.innerHTML = `<div class="card pad stack">
        <div class="row between"><button class="btn sm ghost" id="dl">‹ Diálogos</button><span class="mono small muted">${done}/${dlgTurns(d)}</span></div>
        <h3>${esc(d.t)}</h3>
        <div class="chat" id="ch">${hist.map(h=>`<div class="msg ${h.r}">${esc(h.t)}${h.r==="ai"?` <button class="icon-btn" style="width:28px;height:28px;margin-left:4px" data-say="${esc(h.t)}" aria-label="Ouvir">${ICON.speaker}</button>`:""}</div>`).join("")}</div>
        ${confirm?`<p class="note small"><b>Isso!</b> ${esc(confirm[2])}</p><div class="row"><button class="btn sm" data-say="${esc(confirm[0])}">${ICON.speaker} Repetir em voz alta</button><button class="btn sm primary" id="cn">Continuar →</button></div>`
        :turn?`<div class="stack" style="gap:8px">
          <span class="eyebrow">Sua vez: ${esc(turn[1])}</span>
          ${revealed?`<div class="opts">${opts.map((o,j)=>`<button class="opt" data-o="${j}">${esc(o[0])}</button>`).join("")}</div>`
            :`<p class="note small">Diga sua resposta em voz alta primeiro. Depois compare com as opções.</p><button class="btn primary" id="rv">Já falei — mostrar opções</button>`}
          <div id="fbk">${feedback}</div></div>`
        :`<button class="btn primary" id="fin">Ver resultado</button>`}
      </div>`;
      const ch = $("#ch",el); ch.scrollTop = ch.scrollHeight;
      $("#dl",el).onclick = list;
      const rv = $("#rv",el); if(rv) rv.onclick = ()=>{ revealed = true; draw(); };
      const fin = $("#fin",el); if(fin) fin.onclick = finish;
      const cn = $("#cn",el); if(cn) cn.onclick = ()=>{ confirm = null; advance(); };
      keyH = e=>{ if(confirm && e.key==="Enter") cn && cn.click(); else if(!confirm && revealed && /^[1-3]$/.test(e.key)){ const b=el.querySelector(`[data-o="${+e.key-1}"]`); if(b && !b.disabled) b.click(); } };
      $$("[data-o]",el).forEach(b=>b.onclick=()=>pick(+b.dataset.o));
    }
    function pick(j){
      const o = opts[j]; tries++;
      if(o[1]){
        if(tries===1) right++;
        hist.push({r:"me",t:o[0]}); speak(o[0]); i++;
        confirm = o; opts = null; draw();
      }else{
        addMistake({k:"d",d:d.id,l:i}); save();
        feedback = `<p class="note warn small"><b>Não soa natural:</b> ${esc(o[2])} Tente outra.</p>`;
        const b = el.querySelector(`[data-o="${j}"]`); b.classList.add("wrong"); b.disabled = true;
        $("#fbk",el).innerHTML = feedback;
      }
    }
    function finish(){
      const n = dlgTurns(d), prev = S.dialogs[d.id];
      S.dialogs[d.id] = Math.max(prev??0, right);
      addXP(right*2+5,"diálogo");
      const mine = d.lines.filter(l=>l[0]==="me").map(l=>l[2].find(o=>o[1])[0]);
      el.innerHTML = `<div class="card pad stack">
        <h2>${right}/${n} de primeira</h2>
        <p class="muted">${right===n?"Perfeito! Agora tente o modo desafio: responder em voz alta antes de ver as opções.":"Os erros que você evitou hoje são os que mais aparecem na fala de brasileiros. Repita as frases abaixo até saírem naturalmente."}</p>
        <span class="eyebrow">Suas falas — ouça e repita</span>
        <ul class="exlist">${mine.map(x=>`<li>${spk(x)}<span>${esc(x)}</span></li>`).join("")}</ul>
        <div class="row"><button class="btn" id="ag">Fazer de novo</button><button class="btn primary" id="ls">Outros diálogos</button></div></div>`;
      $("#ag",el).onclick = ()=>play(d); $("#ls",el).onclick = list;
    }
    advance();
  }
  const s = startId && DIALOGS.find(d=>d.id===startId);
  if(s) play(s); else list();
}
function blockJournal(el){
  if(!S.journal.length){ el.innerHTML = `<div class="card empty"><h3>Seu diário está vazio</h3><p>Os textos salvos no bloco “Diário em inglês” aparecem aqui.</p></div>`; return; }
  el.innerHTML = `<div class="stack">${S.journal.map(j=>`<article class="card pad stack">
    <div class="row between"><span class="eyebrow">${fmtDate(j.d)}</span>${j.fb&&j.fb.level?`<span class="lvl">${esc(j.fb.level)}</span>`:""}</div>
    <h3>${esc(j.p)}</h3><p style="white-space:pre-wrap">${esc(j.text)}</p>
    ${j.fb&&j.fb.corrected?`<details><summary class="small" style="cursor:pointer;font-weight:700">Versão corrigida</summary><div class="corr" style="margin-top:8px">${esc(j.fb.corrected)}</div></details>`:""}
  </article>`).join("")}</div>`;
}

/* ============================================================
   PROGRESS TAB
   ============================================================ */
function renderProgress(){
  const LV = 300, level = Math.floor(S.xp/LV)+1, into = S.xp%LV;
  const ids = allCards(), counts = {new:0,lrn:0,young:0,mat:0}; ids.forEach(c=>counts[stageOf(c.id)]++);
  const total = ids.length;
  const gAvg = GRAMMAR.reduce((a,l)=>a+(S.grammar[l.id]?S.grammar[l.id].best/5:0),0)/GRAMMAR.length;
  const dRecent = S.dict.slice(-20), dAvg = dRecent.length? dRecent.reduce((a,x)=>a+x.s,0)/dRecent.length/100 : 0;
  const listenP = Math.min(1, ((S.listenLevel-1)/2)*0.6 + dAvg*0.4);
  const wordsP = (counts.lrn+counts.young+counts.mat)/total*0.5 + counts.mat/total*0.5;
  const writeP = Math.min(1, S.journal.length/30);
  const path = Math.round((wordsP*0.4 + gAvg*0.3 + listenP*0.15 + writeP*0.15)*100);
  // heatmap: 12 weeks ending this week
  const t = todayKey(), tDate = keyToDate(t), start = addDays(t, -(7*11 + tDate.getDay()));
  let cells = "";
  for(let i=0;i<84;i++){ const k = addDays(start,i); if(k>t){ cells += `<i style="visibility:hidden"></i>`; continue; }
    const r = S.days[k], n = daySessions(r);
    cells += `<i class="${n?"h"+n:""} ${k===t?"today":""}" title="${fmtDate(k)}: ${n} ${n===1?"sessão":"sessões"}${r&&r.sec?", "+Math.round(r.sec/60)+" min":""}"></i>`; }
  const acc = S.stats.reviews ? Math.round(S.stats.correct/S.stats.reviews*100) : 0;
  const spark = ()=>{
    if(dRecent.length<2) return `<p class="muted small">Faça alguns ditados para ver sua curva de acerto.</p>`;
    const W=300,H=70,P=6, xs=i=>P+i*(W-2*P)/(dRecent.length-1), ys=v=>H-P-(v/100)*(H-2*P);
    const pts = dRecent.map((x,i)=>xs(i).toFixed(1)+","+ys(x.s).toFixed(1)).join(" ");
    const lx = xs(dRecent.length-1), ly = ys(dRecent[dRecent.length-1].s);
    return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Acerto nos últimos ${dRecent.length} ditados">
      <line x1="${P}" x2="${W-P}" y1="${ys(50)}" y2="${ys(50)}" stroke="var(--line)" stroke-dasharray="3 4"/>
      <polygon points="${P},${H-P} ${pts} ${lx},${H-P}" fill="var(--acc-soft)"/>
      <polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
      <circle cx="${lx}" cy="${ly}" r="4" fill="var(--acc)"/></svg>
      <div class="row between small muted"><span>últimos ${dRecent.length} ditados · linha tracejada = 50%</span><span class="mono">média ${Math.round(dAvg*100)}%</span></div>`;
  };
  const voiceOpts = voices.map(v=>`<option value="${esc(v.name)}" ${S.settings.voice===v.name?"selected":""}>${esc(v.name)} (${esc(v.lang)})</option>`).join("");
  view.innerHTML = `<section class="hello"><span class="eyebrow">Seu progresso</span><h1>Nível ${level}</h1>
    <div class="progressbar" style="max-width:420px"><span style="width:${into/LV*100}%"></span></div>
    <p class="muted small mono">${S.xp.toLocaleString("pt-BR")} XP · faltam ${LV-into} para o nível ${level+1}</p></section>
  <div class="stack">
    <div class="statrow">
      <div class="card stat"><span class="v">${effectiveStreak()}</span><span class="l">dias seguidos · recorde ${S.streak.best}</span></div>
      <div class="card stat"><span class="v">${S.freezes}</span><span class="l">proteções de sequência (ganhe 1 a cada 7 dias)</span></div>
      <div class="card stat"><span class="v">${acc}%</span><span class="l">acerto nas revisões</span></div>
      <div class="card stat"><span class="v">${S.journal.length}</span><span class="l">textos no diário</span></div>
    </div>
    <div class="card pad stack"><div class="row between"><h3>Constância — últimas 12 semanas</h3></div>
      <div class="heat-wrap"><div class="heat">${cells}</div></div>
      <div class="legend"><span><i style="background:var(--surface2)"></i>nenhuma sessão</span><span><i style="background:color-mix(in srgb,var(--acc) 45%,var(--surface2))"></i>1 sessão</span><span><i style="background:var(--acc)"></i>manhã e noite</span></div>
    </div>
    <div class="grid2">
      <div class="card pad stack"><h3>Trilha B1 → B2</h3>
        <div class="row" style="align-items:baseline"><span class="bignum">${path}%</span><span class="muted small">do conteúdo do app dominado</span></div>
        <div class="kv">
          <span>Vocabulário</span><span class="mono small">${Math.round(wordsP*100)}%</span><div class="bar"><span style="width:${wordsP*100}%"></span></div>
          <span>Gramática</span><span class="mono small">${Math.round(gAvg*100)}%</span><div class="bar"><span style="width:${gAvg*100}%"></span></div>
          <span>Compreensão oral</span><span class="mono small">${Math.round(listenP*100)}%</span><div class="bar"><span style="width:${listenP*100}%"></span></div>
          <span>Escrita</span><span class="mono small">${Math.round(writeP*100)}%</span><div class="bar"><span style="width:${writeP*100}%"></span></div>
        </div>
        <p class="small muted">Estimativa do app, não uma certificação. Para medir de verdade, faça um teste como o EF SET a cada 3 meses.</p>
      </div>
      <div class="card pad stack"><h3>Vocabulário</h3>
        <div class="stackbar" role="img" aria-label="Distribuição das palavras por estágio">
          <span style="width:${counts.lrn/total*100}%;background:var(--sun)"></span><span style="width:${counts.young/total*100}%;background:var(--moon)"></span><span style="width:${counts.mat/total*100}%;background:var(--ok)"></span></div>
        <div class="legend"><span><i style="background:var(--sun)"></i>Aprendendo ${counts.lrn}</span><span><i style="background:var(--moon)"></i>Jovens ${counts.young}</span><span><i style="background:var(--ok)"></i>Maduras ${counts.mat}</span><span><i style="background:var(--surface2)"></i>Não vistas ${counts.new}</span></div>
        <p class="small muted">“Madura” = intervalo de 21+ dias. É o sinal de que a palavra está na memória de longo prazo.</p>
        <hr class="sep"><h3>Ditado</h3>${spark()}
      </div>
    </div>
    <div class="card pad stack"><div class="row between"><h3>Conquistas</h3><span class="mono small muted">${ACH.filter(a=>S.ach&&S.ach[a.id]).length}/${ACH.length}</span></div>
      <div class="ach">${ACH.map(a=>{ const on = S.ach && S.ach[a.id]; return `<div class="achi ${on?"on":""}"><span class="medal">${on?ICON.check:"?"}</span><span><b>${esc(a.t)}</b><span class="small muted" style="display:block">${esc(a.d)}${on?" · "+fmtDate(on):""}</span></span></div>`; }).join("")}</div>
    </div>
    <div class="card pad stack"><h3>Ajustes</h3>
      <div class="grid2">
        <div class="stack" style="gap:4px"><label for="s-acc">Sotaque</label><select id="s-acc"><option value="en-US" ${S.settings.accent==="en-US"?"selected":""}>Americano (en-US)</option><option value="en-GB" ${S.settings.accent==="en-GB"?"selected":""}>Britânico (en-GB)</option></select></div>
        <div class="stack" style="gap:4px"><label for="s-voice">Voz</label><select id="s-voice"><option value="">Automática (melhor disponível)</option>${voiceOpts}</select></div>
        <div class="stack" style="gap:4px"><label for="s-rate">Velocidade da fala: <span class="mono" id="rv">${S.settings.rate.toFixed(2)}×</span></label><input type="range" id="s-rate" min="0.6" max="1.2" step="0.05" value="${S.settings.rate}"></div>
        <div class="stack" style="gap:4px"><label for="s-theme">Tema</label><select id="s-theme"><option value="auto" ${S.settings.theme==="auto"?"selected":""}>Automático (sistema)</option><option value="light" ${S.settings.theme==="light"?"selected":""}>Claro</option><option value="dark" ${S.settings.theme==="dark"?"selected":""}>Escuro</option></select></div>
        <div class="stack" style="gap:4px"><label for="s-big">Tamanho do texto</label><select id="s-big"><option value="0" ${S.settings.big?"":"selected"}>Normal</option><option value="1" ${S.settings.big?"selected":""}>Grande</option></select></div>
        <div class="stack" style="gap:4px"><label for="s-new">Palavras novas por noite</label><select id="s-new">${[3,5,8,10].map(n=>`<option ${S.settings.newPerDay===n?"selected":""}>${n}</option>`).join("")}</select></div>
      </div>
      <div class="row"><button class="btn sm" id="tv">${ICON.speaker} Testar voz</button><span class="small muted"><span class="dot ${syncState==="cloud"?"ok":""}"></span> ${syncState==="cloud"?"Progresso salvo na sua conta — abre igual em outros dispositivos.":"Progresso salvo neste navegador."}</span></div>
      <hr class="sep">
      <h3>Lembretes</h3>
      <p class="small muted">Escolha os horários e adicione dois lembretes diários ao seu calendário (Google, iPhone, Outlook). Abra o arquivo baixado e confirme. Ter um horário fixo é o que mais sustenta o hábito.</p>
      <div class="row"><label for="s-tm" style="display:flex;gap:8px;align-items:center">Manhã <input type="time" id="s-tm" value="${S.settings.tm}" style="width:auto"></label><label for="s-tn" style="display:flex;gap:8px;align-items:center">Noite <input type="time" id="s-tn" value="${S.settings.tn}" style="width:auto"></label></div>
      <div class="row"><button class="btn sm" id="ics">Adicionar lembretes ao calendário (.ics)</button></div>
      <hr class="sep">
      <h3>Backup</h3>
      <p class="small muted">Copie o código para guardar ou levar seu progresso para outro navegador. Para restaurar, cole e importe.</p>
      <textarea id="bk" rows="3" spellcheck="false" placeholder="Cole aqui um backup para importar"></textarea>
      <div class="row"><button class="btn sm" id="ex">Gerar e copiar backup</button><button class="btn sm" id="im">Importar backup</button><button class="btn sm" id="exf">Salvar backup em arquivo</button><label class="btn sm" for="imf" style="cursor:pointer">Abrir arquivo de backup<input type="file" id="imf" accept=".json,application/json" hidden></label><button class="btn sm ghost" id="rs" style="color:var(--bad)">Apagar todo o progresso</button></div>
      <div id="cfm"></div>
    </div>
  </div>`;
  $("#s-acc").onchange = e=>{ S.settings.accent=e.target.value; S.settings.voice=""; save(); renderProgress(); };
  $("#s-voice").onchange = e=>{ S.settings.voice=e.target.value; save(); };
  $("#s-rate").oninput = e=>{ S.settings.rate=+e.target.value; $("#rv").textContent=S.settings.rate.toFixed(2)+"×"; };
  $("#s-rate").onchange = ()=>save();
  $("#s-new").onchange = e=>{ S.settings.newPerDay=+e.target.value; save(); };
  $("#s-theme").onchange = e=>{ S.settings.theme=e.target.value; save(); applyPrefs(); };
  $("#s-big").onchange = e=>{ S.settings.big=e.target.value==="1"; save(); applyPrefs(); };
  $("#tv").onclick = ()=>speak("Consistency beats intensity. Fifteen minutes in the morning and fifteen at night.");
  $("#ex").onclick = ()=>{ const ta=$("#bk"); ta.value = JSON.stringify(S); ta.select();
    if(navigator.clipboard) navigator.clipboard.writeText(ta.value).then(()=>toast("Backup copiado"),()=>toast("Selecionado — copie com Ctrl+C")); else toast("Selecionado — copie com Ctrl+C"); };
  $("#s-tm").onchange = e=>{ if(e.target.value){ S.settings.tm=e.target.value; save(); } };
  $("#s-tn").onchange = e=>{ if(e.target.value){ S.settings.tn=e.target.value; save(); } };
  $("#ics").onclick = async ()=>{ if(await saveFile("lembretes-ingles-15-15.ics", icsReminders(), "text/calendar")) toast("Abra o arquivo para adicionar ao calendário"); };
  $("#exf").onclick = async ()=>{ if(await saveFile("fluencia-backup-"+todayKey()+".json", JSON.stringify(S), "application/json")) toast("Backup salvo"); };
  $("#imf").onchange = e=>{ const f = e.target.files[0]; if(!f) return; const rd = new FileReader(); rd.onload = ()=>{ $("#bk").value = rd.result; $("#im").click(); }; rd.readAsText(f); };
  $("#im").onclick = ()=>{ let o; try{ o = JSON.parse($("#bk").value); if(!o || typeof o!=="object" || !o.cards) throw 0; }catch(e){ toast("Esse texto não é um backup válido"); return; }
    confirmBox("Substituir o progresso atual por este backup?","Importar",()=>{ S = merge(o); save(); toast("Backup importado"); renderProgress(); }); };
  $("#rs").onclick = ()=>confirmBox("Apagar XP, sequência, palavras e diário? Isso não pode ser desfeito.","Apagar tudo",()=>{ const keep=S.settings; S = defaultState(); S.settings=keep; save(); toast("Progresso apagado"); renderProgress(); });
}
function confirmBox(msg,label,fn){
  const c = $("#cfm"); c.innerHTML = `<div class="confirm"><span>${esc(msg)}</span><button class="btn sm" id="cy" style="color:var(--bad)">${esc(label)}</button><button class="btn sm ghost" id="cn">Cancelar</button></div>`;
  $("#cy").onclick = ()=>{ c.innerHTML=""; fn(); }; $("#cn").onclick = ()=>c.innerHTML="";
}

function applyPrefs(){
  const root = document.documentElement;
  if(S.settings.theme==="light"||S.settings.theme==="dark") root.dataset.theme = S.settings.theme;
  else if(root.dataset.themeByApp) delete root.dataset.theme;
  if(S.settings.theme!=="auto") root.dataset.themeByApp = "1"; else delete root.dataset.themeByApp;
  document.body.classList.toggle("big", !!S.settings.big);
  const m = document.querySelector('meta[name="theme-color"]'); if(m) m.content = getComputedStyle(document.body).backgroundColor;
}

   BOOT

loadLocal();
applyPrefs();
go("today");
initPlatform();
