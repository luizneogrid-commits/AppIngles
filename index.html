<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131C33">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="15+15">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px)}</style>
<title>Fluência 15+15</title>
<meta name="description" content="Duas sessões diárias de 15 minutos para sair do intermediário: revisão espaçada, ditado, shadowing, fala, gramática e escrita com correção.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --surface2:#E4E9F1; --ink:#131C33; --muted:#566079; --line:#D3DAE6;
  --sun:#C9701C; --sun-soft:#FCEBD7; --moon:#4A4EC2; --moon-soft:#E3E4FA;
  --ok:#1C8456; --ok-soft:#DBF2E6; --bad:#BE3348; --bad-soft:#F9DFE3; --warn:#9C6A12;
  --acc:var(--moon); --acc-soft:var(--moon-soft); --on-acc:#FFFFFF;
  --shadow:0 1px 2px rgba(19,28,51,.06),0 6px 20px rgba(19,28,51,.06);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D111D; --surface:#161C2D; --surface2:#1F2740; --ink:#E6E9F3; --muted:#9BA4BC; --line:#2A3350;
    --sun:#F2A45A; --sun-soft:#3A2915; --moon:#9A9EF7; --moon-soft:#262A5A;
    --ok:#4CC790; --ok-soft:#163828; --bad:#F27A8C; --bad-soft:#3F1E27; --warn:#E3B45A;
    --on-acc:#0D111D; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D111D; --surface:#161C2D; --surface2:#1F2740; --ink:#E6E9F3; --muted:#9BA4BC; --line:#2A3350;
  --sun:#F2A45A; --sun-soft:#3A2915; --moon:#9A9EF7; --moon-soft:#262A5A;
  --ok:#4CC790; --ok-soft:#163828; --bad:#F27A8C; --bad-soft:#3F1E27; --warn:#E3B45A;
  --on-acc:#0D111D; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
.m-mode{--acc:var(--sun); --acc-soft:var(--sun-soft)}
.n-mode{--acc:var(--moon); --acc-soft:var(--moon-soft)}
.x-mode{--acc:var(--ok); --acc-soft:var(--ok-soft)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.7rem,4vw,2.3rem);font-weight:800}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.12rem;font-weight:700}
p{margin:0}
.wrap{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:6px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:820px;margin:0 auto;padding:10px 16px 0;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:baseline;gap:8px}
.logo{font-family:var(--display);font-weight:800;font-size:1.3rem;letter-spacing:-.02em}
.logo b{color:var(--sun)} .logo i{font-style:normal;color:var(--moon)}
.pills{display:flex;gap:6px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:.88rem}
.pill.fire{color:var(--sun)}
.pill .mono{color:var(--ink)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:8px 12px 10px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--acc)}
.tabs .ti{display:none}
/* mobile: barra de abas inferior, alvos de toque maiores */
@media (max-width:640px){
  body{font-size:17px}
  .wrap{padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
  .top{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)}
  .top-in{padding-bottom:10px}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(4,1fr);gap:0;box-shadow:0 -4px 20px rgba(0,0,0,.06)}
  .tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;font-size:.72rem;border-bottom:0;border-radius:12px;position:relative;min-height:56px}
  .tabs .ti{display:block}
  .tabs button[aria-current="page"]{color:var(--acc);background:var(--acc-soft)}
  .tabs .badge{position:absolute;top:2px;left:calc(50% + 6px);margin:0}
  .btn{min-height:46px;padding-inline:16px}
  .btn.sm{min-height:38px}
  .opt{padding:14px 16px;font-size:1.02rem}
  .grades button{padding:14px 4px;min-height:64px}
  .grades .kbd,.kbd{display:none}
  .flash{padding:22px 14px;min-height:220px}
  .sess-foot{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--bg);padding-block:10px;z-index:5}
  .sess-foot .btn{flex:1}
  .sess-foot .muted{flex-basis:100%}
  #toast{bottom:calc(90px + env(safe-area-inset-bottom,0px))}
  input[type=text],textarea,select{font-size:16px}
  .hello{padding-block:16px 4px}
}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--acc);color:var(--on-acc);font-size:.72rem;margin-left:4px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.ok{background:var(--ok)}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:9px 15px;border-radius:10px;font-weight:700;cursor:pointer;transition:transform .08s,background .15s}
.btn:hover{background:var(--surface2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.primary:hover{filter:brightness(1.07);background:var(--acc)}
.btn.ghost{background:none;border-color:transparent}
.btn.sm{padding:5px 10px;font-size:.86rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;cursor:pointer;color:var(--acc);flex:none;vertical-align:middle}
.icon-btn:hover{background:var(--acc-soft)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;background:var(--surface2);font-size:.82rem;font-weight:700;border:1px solid transparent}
button.chip{cursor:pointer}
button.chip:hover{border-color:var(--acc)}
.chip.used{background:var(--ok-soft);color:var(--ok)}
.tag{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--acc)}
input[type=text],textarea,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{resize:vertical;line-height:1.5}
input:focus,textarea:focus,select:focus{outline:2px solid var(--acc);outline-offset:0;border-color:transparent}
label{font-weight:700;font-size:.9rem}
.empty{text-align:center;padding:26px 14px;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty p{max-width:46ch;color:var(--muted)}
.note{background:var(--acc-soft);border-radius:10px;padding:10px 14px;font-size:.92rem}
.note.warn{background:var(--sun-soft)}
hr.sep{border:0;border-top:1px solid var(--line);margin:4px 0}

/* today */
.hello{padding-block:22px 6px;display:flex;flex-direction:column;gap:6px}
.sess-card{position:relative;overflow:hidden;padding:20px;display:flex;flex-direction:column;gap:14px}
.sess-card::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--acc)}
.sess-card.rec{outline:2px solid var(--acc);outline-offset:-1px}
.sess-head{display:flex;gap:12px;align-items:center}
.sess-ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc);flex:none}
.blist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.blist li{display:flex;gap:10px;align-items:flex-start}
.bcheck{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;margin-top:1px;color:var(--on-acc)}
.bcheck.on{background:var(--ok);border-color:var(--ok)}
.blist .t{font-weight:700;display:block;line-height:1.3}
.blist .d{font-size:.85rem;color:var(--muted)}
.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--display);font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums}
.stat .l{font-size:.82rem;color:var(--muted)}
details.method summary{cursor:pointer;font-weight:700;padding:14px 18px;list-style:none}
details.method summary::after{content:" +";color:var(--acc)}
details.method[open] summary::after{content:" −"}
.method ul{margin:0;padding:0 18px 16px 36px;display:flex;flex-direction:column;gap:6px;font-size:.94rem}

/* session */
.sess{display:flex;flex-direction:column;gap:14px;padding-top:14px}
.sess-top{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.sess-title{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;color:var(--acc)}
.timer{font-size:1.4rem;font-weight:700;padding:4px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);cursor:pointer}
.timer.over{color:var(--bad);border-color:var(--bad)}
.timer.paused{opacity:.55}
.stepper{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stepper button{width:100%;border:0;background:var(--surface);border-radius:10px;padding:8px;display:flex;gap:8px;align-items:center;cursor:pointer;font-weight:700;font-size:.86rem;text-align:left;border-bottom:3px solid var(--line);color:var(--muted)}
.stepper .n{width:22px;height:22px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;flex:none;font-size:.78rem}
.stepper li.cur button{color:var(--ink);border-bottom-color:var(--acc)}
.stepper li.done .n{background:var(--ok);color:var(--on-acc)}
.sess-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-top:4px}
@media (max-width:520px){.stepper .lbl{display:none}.stepper button{justify-content:center}}

/* flashcards */
.flash{padding:26px 20px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;min-height:250px;justify-content:center}
.word{font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,5vw,2.4rem);display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap;line-height:1.1}
.pt{font-size:1.15rem;font-weight:700}
.prompt-pt{font-family:var(--display);font-size:1.5rem;font-weight:700}
.ex{font-size:1.05rem;max-width:52ch;color:var(--muted)}
.ex b{color:var(--ink)}
.ex .gap{display:inline-block;min-width:80px;border-bottom:2px solid var(--acc)}
.back{border-top:1px dashed var(--line);padding-top:14px;width:100%;display:flex;flex-direction:column;gap:8px;align-items:center}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 4px;cursor:pointer;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
.grades button small{font-family:var(--mono);font-size:.74rem;color:var(--muted);font-weight:500}
.grades .g0{color:var(--bad)} .grades .g1{color:var(--warn)} .grades .g2{color:var(--ok)} .grades .g3{color:var(--moon)}
.grades button:hover{background:var(--surface2)}
.kbd{font-family:var(--mono);font-size:.72rem;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--muted)}
.progressbar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden}
.progressbar>span{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}

/* dictation */
.diff{font-size:1.1rem;line-height:1.9}
.diff span{padding:1px 3px;border-radius:4px}
.diff .ok{background:var(--ok-soft);color:var(--ok)}
.diff .miss{background:var(--bad-soft);color:var(--bad);text-decoration:underline wavy}
.score{font-family:var(--display);font-size:2rem;font-weight:800}

/* quiz */
.opts{display:grid;gap:8px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 14px;text-align:left;cursor:pointer;font-weight:700}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.qsent{font-size:1.2rem;font-weight:700}
.qsent .gap{color:var(--acc);font-family:var(--mono)}
.lesson-intro{font-size:1rem;max-width:65ch}
.lesson-intro b{color:var(--acc)}
.exlist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.exlist li{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:10px;padding:8px 12px}

/* speaking & writing */
.prompt{font-size:1.35rem}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:.95rem}
.bigtime{font-size:1.8rem;font-weight:700}
.transcript{background:var(--bg);border-radius:10px;padding:10px 14px;font-style:italic;min-height:48px}
.checks{display:flex;flex-direction:column;gap:6px}
.checks label{font-weight:400;display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.checks input{margin-top:5px;accent-color:var(--acc)}
.fb{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.lvl{display:inline-flex;align-items:center;gap:6px;background:var(--acc);color:var(--on-acc);border-radius:999px;padding:3px 12px;font-weight:700;font-family:var(--mono);font-size:.9rem}
.corr{background:var(--bg);border-radius:10px;padding:12px 14px;white-space:pre-wrap}
.errs{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.errs li{border-left:3px solid var(--bad);padding:2px 0 2px 12px}
.errs s{color:var(--bad)} .errs ins{color:var(--ok);text-decoration:none;font-weight:700}
.ups li{border-left-color:var(--moon)}
.loading{display:flex;align-items:center;gap:10px;color:var(--muted)}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--surface2);border-top-color:var(--acc);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow-y:auto;padding:4px}
.msg{max-width:85%;padding:10px 14px;border-radius:14px;line-height:1.45}
.msg.ai{background:var(--surface2);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--acc);color:var(--on-acc);align-self:flex-end;border-bottom-right-radius:4px}
.msg .fix{display:block;margin-top:8px;font-size:.86rem;background:var(--sun-soft);color:var(--ink);border-radius:8px;padding:6px 10px}
.composer{display:flex;gap:8px}
.composer input{flex:1}

/* practice tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.tile{text-align:left;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line)}
.tile:hover{border-color:var(--acc)}
.tile .ti{color:var(--acc)}
.tile p{font-size:.9rem;color:var(--muted)}

/* word list */
.wlist{display:flex;flex-direction:column}
.wrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 4px;border-bottom:1px solid var(--line);align-items:center}
.wrow .w{font-weight:700}
.wrow .p{font-size:.88rem;color:var(--muted)}
.st{font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.st.new{background:var(--surface2);color:var(--muted)}
.st.lrn{background:var(--sun-soft);color:var(--sun)}
.st.young{background:var(--moon-soft);color:var(--moon)}
.st.mat{background:var(--ok-soft);color:var(--ok)}

/* progress */
.heat-wrap{overflow-x:auto}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);gap:3px;width:max-content}
.heat i{width:14px;height:14px;border-radius:3px;background:var(--surface2);display:block}
.heat i.h1{background:color-mix(in srgb,var(--acc) 45%,var(--surface2))}
.heat i.h2{background:var(--acc)}
.heat i.today{outline:2px solid var(--ink);outline-offset:-1px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);align-items:center}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:-1px}
.stackbar{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--surface2)}
.stackbar span{display:block;height:100%}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.kv .bar{grid-column:1/-1;height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:-4px}
.kv .bar span{display:block;height:100%;background:var(--acc)}
.bignum{font-family:var(--display);font-size:2.4rem;font-weight:800;line-height:1}
svg.spark{width:100%;height:70px;display:block}

.kv4{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.kv4>div{display:flex;flex-direction:column}
.kv4 .v{font-size:1.5rem;font-weight:700}
.kv4 .v small{font-size:.9rem;color:var(--muted)}
.kv4 .l{font-size:.82rem;color:var(--muted)}
.up{color:var(--ok);font-weight:700}.down{color:var(--bad);font-weight:700}
body.big{font-size:19px}
body.big .small{font-size:.92rem}
body.big .word{font-size:clamp(2rem,6vw,2.8rem)}
/* conquistas */
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:10px}
.achi{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;background:var(--bg);opacity:.6}
.achi.on{opacity:1;background:var(--acc-soft)}
.medal{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface2);color:var(--muted);font-weight:700}
.achi.on .medal{background:var(--acc);color:var(--on-acc)}

/* toast */

const GRAMMAR = [
{id:"pp",t:"Present Perfect × Past Simple",
 intro:"Use o <b>Past Simple</b> para ações num momento terminado e específico (<i>yesterday, in 2019, last week, two days ago</i>). Use o <b>Present Perfect</b> quando o momento não é dito ou ainda não terminou (<i>ever, never, already, yet, this week, so far</i>) ou quando o resultado importa agora. Erro clássico: “I have seen him yesterday” ✗.",
 ex:["I saw that movie last week.","I've already seen that movie.","She has worked here since 2020."],
 q:[["I ___ to London three times so far.",["went","have been","was going"],1,"“So far” = até agora → Present Perfect."],
    ["We ___ the contract two days ago.",["have signed","signed","have been signing"],1,"“Ago” marca tempo terminado → Past Simple."],
    ["___ you ever ___ sushi?",["Did / eat","Have / eaten","Were / eating"],1,"“Ever” pergunta sobre experiência de vida → Present Perfect."],
    ["He ___ his keys, so he can't get in.",["lost","has lost","was losing"],1,"O resultado está no presente (não consegue entrar) → Present Perfect."],
    ["When ___ you ___ your degree?",["have / finished","did / finish","had / finished"],1,"“When” pede um momento específico → Past Simple."]]},
{id:"fs",t:"Há quanto tempo? for, since e Present Perfect Continuous",
 intro:"O português usa presente (“Moro aqui <i>há</i> 5 anos”), mas o inglês usa <b>Present Perfect (Continuous)</b>: <i>I've been living here for 5 years</i>. <b>for</b> + período (for two hours), <b>since</b> + ponto de início (since Monday). Verbos de estado (<i>know, like, have</i> = possuir) ficam no Present Perfect simples.",
 ex:["I've been studying English for four years.","We've known each other since 2015.","How long have you been waiting?"],
 q:[["I ___ English for four years.",["study","have been studying","am studying"],1,"Começou no passado e continua → Present Perfect Continuous. “I study for four years” é tradução literal."],
    ["She's been waiting ___ 9 o'clock.",["for","since","from"],1,"9 o'clock é o ponto de início → since."],
    ["We've known each other ___ ages.",["since","for","during"],1,"“Ages” é duração → for."],
    ["How long ___ here?",["are you living","do you live","have you been living"],2,"“How long” + situação que continua → Present Perfect Continuous."],
    ["I ___ this car since 2018.",["have been having","have had","am having"],1,"“Have” no sentido de possuir é verbo de estado → Present Perfect simples."]]},
{id:"ut",t:"Used to · be used to · get used to",
 intro:"<b>used to + verbo</b>: hábito passado que acabou (<i>I used to smoke</i>). <b>be used to + -ing</b>: estar acostumado (<i>I'm used to working late</i>). <b>get used to + -ing</b>: acostumar-se (processo). Cuidado: “I'm used to wake up early” ✗ → “I'm used to waking up early” ✓.",
 ex:["I used to play football every weekend.","I'm used to working from home.","You'll get used to the cold."],
 q:[["I ___ play the guitar when I was a teenager.",["used to","am used to","got used to"],0,"Hábito passado que acabou → used to + verbo base."],
    ["You'll soon get used to ___ on the left.",["drive","driving","drove"],1,"Depois de get/be used to vem -ing."],
    ["She isn't used to ___ so much noise.",["hear","hearing","heard"],1,"“Be used to” + -ing."],
    ["___ you use to live in Rio?",["Did","Were","Are"],0,"Pergunta com “use to” usa did (e “use” sem -d)."],
    ["It took me months to ___ the cold weather.",["use to","get used to","be use to"],1,"Processo de se acostumar → get used to + substantivo."]]},
{id:"cd",t:"Condicionais: 2ª, 3ª e mista",
 intro:"<b>2ª</b> (hipótese presente): <i>If I had time, I would travel.</i> <b>3ª</b> (passado que não aconteceu): <i>If I had studied, I would have passed.</i> <b>Mista</b> (passado → resultado agora): <i>If I had taken that job, I would be in Canada now.</i> Nunca use <b>would</b> na parte do “if”.",
 ex:["If I were you, I'd accept the offer.","If we had left earlier, we wouldn't have missed the train.","If I had saved money, I'd be less stressed now."],
 q:[["If I ___ you, I'd accept the offer.",["am","were","would be"],1,"2ª condicional: “If I were you” é a forma padrão de dar conselho."],
    ["If we had left earlier, we ___ the train.",["wouldn't miss","wouldn't have missed","didn't miss"],1,"3ª condicional: would have + particípio."],
    ["If she ___ harder, she would have passed.",["had studied","studied","would study"],0,"3ª condicional: If + past perfect."],
    ["If I had accepted that job in 2020, I ___ in Canada now.",["would live","would have lived","lived"],0,"Mista: condição passada, resultado presente (“now”) → would + verbo."],
    ["What would you do if you ___ the lottery?",["win","won","would win"],1,"2ª condicional: If + past simple."]]},
{id:"ar",t:"Artigos: the × sem artigo",
 intro:"Generalizações em inglês <b>não</b> levam “the”: <i>Life is short. People love music. I like coffee.</i> Use <b>the</b> para algo específico ou já mencionado: <i>The coffee here is great.</i> Também sem artigo: refeições (<i>have lunch</i>), a maioria dos países (<i>Brazil</i>, mas <i>the USA</i>), idiomas e <i>go to work / bed / school</i>.",
 ex:["Health is more important than money.","The people in my team are friendly.","We usually have lunch at one."],
 q:[["___ is more important than money.",["The health","Health","A health"],1,"Generalização → sem artigo."],
    ["I love ___ music you're playing.",["(nada)","the","a"],1,"Música específica (a que você está tocando) → the."],
    ["She moved to ___ last year.",["the Canada","Canada","a Canada"],1,"A maioria dos países não leva artigo."],
    ["We usually have ___ at around 1 p.m.",["the lunch","a lunch","lunch"],2,"Refeições em geral não levam artigo."],
    ["___ people in my team are really friendly.",["(nada)","The","A"],1,"Pessoas específicas (do meu time) → The."]]},
{id:"pr",t:"Preposições que brasileiros erram",
 intro:"Tempo: <b>at</b> (horas, <i>at night</i>), <b>on</b> (dias e datas: <i>on Monday</i>), <b>in</b> (meses, anos, períodos: <i>in July, in the morning</i>). Dependentes: <i>depend <b>on</b></i> (não “of”), <i>married <b>to</b></i> (não “with”), <i>arrive <b>in/at</b></i> (nunca “to”), <i>good <b>at</b></i>, <i>listen <b>to</b></i>.",
 ex:["It depends on the weather.","She's married to a doctor.","We arrived in Lisbon on Monday at 8."],
 q:[["It depends ___ the weather.",["of","on","from"],1,"Depend on — nunca “depend of”."],
    ["She's married ___ a doctor.",["with","to","at"],1,"Married to."],
    ["We arrived ___ São Paulo at midnight.",["to","in","at"],1,"Arrive in (cidade/país); arrive at (local específico). Nunca “arrive to”."],
    ["The course starts ___ Monday ___ 8 a.m.",["on / at","in / at","at / on"],0,"On + dia; at + hora."],
    ["I'm really good ___ remembering faces.",["in","at","on"],1,"Good at."]]},
{id:"gi",t:"Gerúndio (-ing) × Infinitivo (to)",
 intro:"Pedem <b>-ing</b>: <i>enjoy, avoid, mind, suggest, finish, consider, keep</i>. Pedem <b>to</b>: <i>want, decide, plan, hope, afford, manage, refuse</i>. Depois de preposição, sempre -ing: <i>thinking about moving</i>. Mudam de sentido: <i>stop smoking</i> (parar de) × <i>stop to smoke</i> (parar para); <i>remember to call</i> (lembrar de fazer) × <i>remember calling</i> (lembrar que fez).",
 ex:["I suggest starting earlier.","We can't afford to buy a new car.","Remember to lock the door."],
 q:[["I suggest ___ earlier tomorrow.",["to start","starting","start"],1,"Suggest + -ing."],
    ["We can't afford ___ a new car right now.",["buying","to buy","buy"],1,"Afford + to."],
    ["He's thinking about ___ his job.",["quit","to quit","quitting"],2,"Depois de preposição (about) → -ing."],
    ["Remember ___ the door when you leave.",["locking","to lock","lock"],1,"Lembrar de fazer algo no futuro → remember to."],
    ["She stopped ___ to her boss after the argument.",["talking","to talk","talk"],0,"Parou de falar → stop + -ing."]]},
{id:"rs",t:"Reported speech (discurso indireto)",
 intro:"Ao relatar uma fala, geralmente o tempo “volta”: <i>am/is → was, will → would, can → could, have done → had done</i>. Use <b>said</b> (sem pessoa) ou <b>told + pessoa</b> — nunca “said me”. Perguntas relatadas usam ordem de afirmação: <i>He asked where I <b>lived</b>.</i>",
 ex:["She said she was tired.","He told me he would call later.","They asked where I worked."],
 q:[["“I'm tired,” she said. → She said she ___ tired.",["is","was","has been"],1,"Am → was."],
    ["He ___ me that he would call later.",["said","told","spoke"],1,"Told + pessoa."],
    ["“Where do you work?” → She asked me where ___.",["do I work","I worked","did I work"],1,"Pergunta relatada: ordem de afirmação e tempo recuado."],
    ["“We will finish it tomorrow.” → They said they ___ it the next day.",["will finish","would finish","finished"],1,"Will → would; tomorrow → the next day."],
    ["“I have lost my wallet.” → He said he ___ his wallet.",["had lost","has lost","lost"],0,"Present perfect → past perfect."]]},
{id:"pv",t:"Voz passiva",
 intro:"Forma: <b>be + particípio</b>. Use quando a ação importa mais do que quem fez: <i>The report <b>was sent</b> yesterday.</i> O “be” carrega o tempo verbal: <i>is made, was made, has been made, will be made, is being made</i>. Formal: <i>It is said that…</i>",
 ex:["The emails haven't been sent yet.","My car is being repaired.","English is spoken in many countries."],
 q:[["The new bridge ___ by the city next year.",["will build","will be built","is building"],1,"Futuro passivo: will be + particípio."],
    ["My car ___ right now, so I'm taking the bus.",["is repairing","is being repaired","repairs"],1,"Presente contínuo passivo: is being + particípio."],
    ["English ___ in many countries.",["speaks","is spoken","is speaking"],1,"Presente simples passivo."],
    ["The emails ___ yet.",["haven't been sent","haven't sent","weren't sent"],0,"“Yet” → present perfect passivo."],
    ["It ___ that the company will be sold.",["says","is said","is saying"],1,"Estrutura impessoal: It is said that…"]]},
{id:"rc",t:"Orações relativas: who, which, that, whose, where",
 intro:"<b>who</b> (pessoas), <b>which</b> (coisas), <b>that</b> (ambos, só sem vírgulas), <b>whose</b> (posse), <b>where</b> (lugar). Com vírgulas (informação extra) nunca use “that”: <i>My brother, <b>who</b> lives in Lisbon, …</i> Se o pronome é objeto, pode sumir: <i>The book (that) I read.</i>",
 ex:["That's the colleague who helped me.","She's the friend whose sister works at Google.","This is the café where we first met."],

    ["My hometown, ___ is in the south, is famous for its wine.",["that","which","where"],1,"Com vírgulas (non-defining) → which, nunca that."],
    ["This is the café ___ we first met.",["which","where","who"],1,"Lugar → where."]]},
{id:"md",t:"Deduções no passado: must / might / can't have",
 intro:"<b>must have + particípio</b>: quase certeza que sim. <b>might / may / could have</b>: talvez. <b>can't / couldn't have</b>: certeza que não. Arrependimento ou crítica: <b>should have</b> (deveria ter).",

    ["You ___ told me earlier! Now it's too late.",["must have","should have","can't have"],1,"Crítica/arrependimento → should have."],
    ["She ___ been very happy with the results — she got a promotion.",["can't have","must have","shouldn't have"],1,"Dedução lógica → must have."]]},
{id:"ws",t:"Wish e If only",
 intro:"<b>wish + past</b>: desejo sobre o presente (<i>I wish I <b>had</b> more time</i>). <b>wish + past perfect</b>: arrependimento sobre o passado (<i>I wish I <b>had studied</b> more</i>). <b>wish + would</b>: irritação com o comportamento de alguém (<i>I wish you <b>would</b> stop</i>). <b>If only</b> é a versão enfática.",
 ex:["I wish I could speak Spanish.","I wish I hadn't sent that email.","I wish my neighbors wouldn't make so much noise."],
 q:[["I wish I ___ speak Spanish.",["can","could","will"],1,"Desejo presente → could."],
    ["I wish I ___ that email yesterday. It was a mistake.",["didn't send","hadn't sent","wouldn't send"],1,"Arrependimento passado → past perfect."],
    ["I wish my neighbors ___ so much noise.",["wouldn't make","didn't made","don't make"],0,"Irritação com o comportamento de outros → wish + would."],
    ["If only I ___ more money right now!",["have","had","would have"],1,"Presente → past simple."],
    ["She wishes she ___ to the party last week.",["went","had gone","would go"],1,"Passado → past perfect."]]},
{id:"ft",t:"Futuro: will × going to × presente contínuo",
 intro:"<b>will</b>: decisão na hora, promessa, previsão por opinião (<i>I'll get it! I think it will rain.</i>). <b>going to</b>: plano já decidido ou previsão com evidência (<i>I'm going to study tonight. Look at those clouds — it's going to rain.</i>). <b>Presente contínuo</b>: compromisso marcado, com hora e lugar (<i>I'm meeting Ana at 7.</i>).",
 ex:["The phone's ringing — I'll get it.","I'm going to start a new course next month.","We're having dinner with my parents on Friday."],
 q:[["“We don't have milk.” “Oh, I ___ some on the way home.”",["'m going to buy","'ll buy","buy"],1,"Decisão tomada na hora → will."],
    ["Look at that car! It ___ crash!",["will","is going to","crashes"],1,"Previsão com evidência visível → going to."],
    ["I ___ the dentist at 3 p.m. tomorrow. It's booked.",["will see","am seeing","see"],1,"Compromisso marcado → presente contínuo."],
    ["I've decided: I ___ quit sugar this year.",["will","am going to","am"],1,"Plano já decidido antes → going to."],
    ["Don't worry, I ___ tell anyone. I promise.",["won't","am not going to","don't"],0,"Promessa → will / won't."]]},
{id:"nr",t:"Contando histórias: past continuous e past perfect",
 intro:"<b>Past continuous</b> (was/were + -ing): o cenário, a ação em andamento (<i>I was driving</i>). <b>Past simple</b>: os eventos principais, em sequência (<i>when the phone rang</i>). <b>Past perfect</b> (had + particípio): algo que aconteceu <i>antes</i> de outro ponto no passado (<i>When I arrived, the meeting had already started.</i>).",
 ex:["I was cooking when the lights went out.","When we got to the station, the train had already left.","While she was studying, her brother was playing video games."],
 q:[["I ___ TV when you called.",["watched","was watching","had watched"],1,"Ação em andamento interrompida → past continuous."],
    ["When I got home, someone ___ into my apartment.",["broke","was breaking","had broken"],2,"Aconteceu antes de eu chegar → past perfect."],
    ["While we ___ dinner, the doorbell rang.",["had","were having","have had"],1,"While + ação em andamento → past continuous."],
    ["She ___ the email, then she closed her laptop.",["sent","had been sending","was sending"],0,"Sequência de eventos → past simple."],
    ["I didn't recognize him because he ___ a lot.",["changed","was changing","had changed"],2,"Mudança anterior ao momento da história → past perfect."]]},
{id:"cp",t:"Comparações avançadas",
 intro:"Intensifique com <b>much / far / a lot</b> + comparativo (<i>much cheaper</i>) e suavize com <b>a bit / slightly</b>. <b>The more…, the more…</b> expressa progressão (<i>The more you practice, the easier it gets</i>). <b>as … as</b> para igualdade (<i>not as expensive as</i>). Nunca “more better” ou “more easy”.",
 ex:["This app is far better than the old one.","The more you read, the more you learn.","Rio isn't as big as São Paulo."],
 q:[["This laptop is ___ than the other one.",["much more cheap","much cheaper","more cheaper"],1,"Adjetivo curto: cheaper; intensifique com much."],
    ["The ___ you practice, the ___ it gets.",["more / easier","most / easiest","more / more easy"],0,"The + comparativo, the + comparativo."],
    ["My new job isn't as stressful ___ my old one.",["than","as","like"],1,"As … as."],
    ["English is ___ easier for me now than a year ago.",["very","a lot","more"],1,"Very não modifica comparativo; use a lot / much / far."],
    ["It's the ___ decision I've ever made.",["better","best","most good"],1,"Superlativo de good → the best."]]},
{id:"iq",t:"Perguntas indiretas e question tags",
 intro:"Perguntas indiretas são mais educadas e usam <b>ordem de afirmação</b>, sem do/does/did: <i>Could you tell me where <b>the station is</b>?</i> (não “where is the station”). Sim/não usa <b>if/whether</b>: <i>Do you know if he's coming?</i> <b>Question tags</b> invertem o auxiliar: afirmativa → tag negativa (<i>You're Brazilian, aren't you?</i>) e vice-versa.",
 ex:["Do you know what time it starts?","Could you tell me how much this costs?","She lives nearby, doesn't she?"],
 q:[["Could you tell me where ___?",["is the bathroom","the bathroom is","does the bathroom be"],1,"Pergunta indireta → ordem de afirmação."],
    ["Do you know ___ the meeting was cancelled?",["if","that","what"],0,"Pergunta de sim/não indireta → if / whether."],
    ["I wonder what time ___.",["does the store open","the store opens","opens the store"],1,"Sem do/does em pergunta indireta."],
    ["You've been to Chile, ___?",["haven't you","didn't you","don't you"],0,"Auxiliar have → tag haven't you."],
    ["He didn't call, ___?",["didn't he","did he","does he"],1,"Frase negativa → tag afirmativa."]]},
{id:"hv",t:"Have / get something done",
 intro:"Quando <b>outra pessoa</b> faz o serviço para você, use <b>have/get + objeto + particípio</b>: <i>I had my hair cut</i> (o cabeleireiro cortou). Em português dizemos “cortei o cabelo”, mas “I cut my hair” significa que você mesmo cortou! Também serve para coisas ruins que aconteceram: <i>I had my phone stolen.</i>",
 ex:["I'm getting my car fixed tomorrow.","We had the house painted last year.","She had her wallet stolen on the bus."],
 q:[["I ___ yesterday. Do you like it? (no cabeleireiro)",["cut my hair","had my hair cut","had cut my hair"],1,"Serviço feito por outra pessoa → have + objeto + particípio."],
    ["We need to get the air conditioner ___.",["fix","fixing","fixed"],2,"Get + objeto + particípio."],
    ["He had his laptop ___ at the airport.",["stolen","stole","steal"],0,"Coisa ruim que aconteceu → have + objeto + particípio."],
    ["Where do you usually ___ your nails done?",["have","make","do"],0,"Have (ou get) something done."],
    ["I'm ___ my eyes tested next week.",["making","getting","doing"],1,"Get + objeto + particípio."]]},
{id:"mk",t:"Make × Do",
 intro:"<b>make</b>: criar, produzir, resultado (<i>make a decision, a mistake, money, progress, an effort, a plan, a call, friends</i>). <b>do</b>: tarefas, trabalho, atividades em geral (<i>do homework, the dishes, research, business, a favor, your best, exercise</i>). É collocation: vale decorar em blocos.",
 ex:["I made a lot of mistakes, but I did my best.","Could you do me a favor?","She's making great progress."],
 q:[["Everyone ___ mistakes when learning a language.",["does","makes","takes"],1,"Make a mistake."],
    ["Could you ___ me a favor?",["make","do","give"],1,"Do someone a favor."],
    ["I need to ___ some research before the meeting.",["do","make","have"],0,"Do research."],
    ["We have to ___ a decision today.",["do","make","take"],1,"Make a decision (take a decision é mais britânico e menos comum)."],
    ["He's trying to ___ more money freelancing.",["do","win","make"],2,"Make money (win = ganhar prêmio/competição)."]]},
{id:"qt",t:"Contáveis × incontáveis e quantificadores",
 intro:"Incontáveis em inglês que são contáveis em português: <b>advice, information, news, furniture, feedback, equipment, luggage, homework, research</b> — nunca levam “s” nem “a/an”: <i>a piece of advice</i>. Use <b>much / little / a little</b> com incontáveis e <b>many / few / a few</b> com contáveis. <i>Few</i> = quase nenhum (negativo); <i>a few</i> = alguns (positivo).",
 ex:["Can I give you some advice?","The news is good.","I have a few friends in London."],
 q:[["She gave me some great ___.",["advices","advice","an advice"],1,"Advice é incontável."],
    ["How ___ information do you need?",["many","much","few"],1,"Information é incontável → much."],
    ["The news ___ really surprising.",["were","was","are"],1,"News é singular/incontável."],
    ["I have ___ friends here, so I'm never lonely.",["a few","few","a little"],0,"Sentido positivo com contável → a few."],
    ["We bought some new ___ for the office.",["furnitures","furniture","furniture pieces of"],1,"Furniture é incontável."]]},
{id:"ob",t:"Obrigação: must, have to, don't have to, mustn't",
 intro:"<b>must</b>: obrigação vinda de quem fala ou regras escritas. <b>have to</b>: obrigação externa (mais comum na fala). Atenção à diferença nos negativos: <b>don't have to</b> = não precisa (opcional) × <b>mustn't</b> = é proibido. <b>should</b> = conselho. No passado, só existe <b>had to</b>.",
 ex:["I have to wear a uniform at work.","You don't have to come, but it'd be nice.","You mustn't smoke in here."],
 q:[["It's Sunday — you ___ wake up early.",["mustn't","don't have to","can't"],1,"Não precisa (é opcional) → don't have to."],
    ["You ___ touch that wire. It's dangerous!",["mustn't","don't have to","needn't"],0,"Proibição → mustn't."],
    ["Yesterday I ___ work until 10 p.m.",["must","had to","have to"],1,"Passado de obrigação → had to."],
    ["You look tired. You ___ get some rest.",["should","must","have to"],0,"Conselho → should."],
    ["In Brazil, you ___ vote if you're between 18 and 70.",["don't have to","have to","should"],1,"Obrigação externa (lei) → have to."]]},
{id:"ss",t:"So, such, too e enough",
 intro:"<b>so</b> + adjetivo/advérbio (<i>so tired</i>); <b>such</b> + (a) + adjetivo + substantivo (<i>such a nice day</i>). <b>too</b> = excesso, com sentido negativo (<i>too expensive to buy</i>). <b>enough</b> vem <b>depois</b> do adjetivo (<i>old enough</i>) e <b>antes</b> do substantivo (<i>enough money</i>).",
 ex:["It was such a long day.","The coffee is too hot to drink.","Are you old enough to drive?"],
 q:[["It was ___ a good movie that I watched it twice.",["so","such","too"],1,"Such + a + adjetivo + substantivo."],
    ["I was ___ tired that I fell asleep on the sofa.",["such","so","enough"],1,"So + adjetivo."],
    ["This suitcase is ___ heavy to carry.",["too","so","enough"],0,"Excesso com consequência negativa → too … to."],
    ["He isn't ___ to reach the top shelf.",["enough tall","tall enough","too tall"],1,"Enough vem depois do adjetivo."],
    ["We don't have ___ for a new car.",["money enough","enough money","too money"],1,"Enough vem antes do substantivo."]]}
];

/* ============================================================

   ============================================================ */
const LS_KEY = "fluencia1515:v1";
function defaultState(){ return {
  v:1, created:todayKey(), updatedAt:0, xp:0,
  streak:{count:0,best:0,last:null}, freezes:0,
  days:{}, cards:{}, custom:[], grammar:{}, journal:[], draft:"",
  dict:[], listenLevel:1, recentListen:[], pairs:[], dialogs:{}, mistakes:[], ach:{},
  stats:{reviews:0,correct:0},
  settings:{accent:"en-US",voice:"",rate:0.95,newPerDay:5,dlgSpeak:false,theme:"auto",big:false,tm:"07:30",tn:"21:30"}
};}
let S = defaultState();
let userDoc = null, remoteTimer = null, remoteBusy = false, remoteAgain = false, syncState = "local";
let AI = null;

function loadLocal(){
  try{ const raw = localStorage.getItem(LS_KEY); if(raw) S = merge(JSON.parse(raw)); }catch(e){}
}
function merge(o){ const d = defaultState(); const r = Object.assign(d, o||{}); r.settings = Object.assign(defaultState().settings, (o||{}).settings||{}); r.stats = Object.assign(defaultState().stats, (o||{}).stats||{}); return r; }
function save(){
  checkAch();
  S.updatedAt = Date.now();
  if(S.journal.length>40) S.journal.length = 40;
  if(S.dict.length>40) S.dict = S.dict.slice(-40);
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
  if(userDoc){ clearTimeout(remoteTimer); remoteTimer = setTimeout(pushRemote, 1500); }
  updateHeader();
}
async function pushRemote(){
  if(!userDoc) return;
  if(remoteBusy){ remoteAgain = true; return; }
  remoteBusy = true;
  try{ await userDoc.set(JSON.parse(JSON.stringify(S))); syncState = "cloud"; }
  catch(e){ syncState = "local"; }
  remoteBusy = false;
  if(remoteAgain){ remoteAgain = false; pushRemote(); }
}
async function initPlatform(){
  if(!window.claude || typeof window.claude.use !== "function") return;
  claude.use("sample").then(s=>{ AI = s; if(currentTab!=="session") render(); }).catch(()=>{});
  try{
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if(!db || !user) return;
    const uid = await user.id();
    if(!uid) return;
    userDoc = db.doc("data/users/" + uid + "/progress");
    const snap = await userDoc.get();
    if(snap.exists){
      const remote = snap.data();
      if((remote.updatedAt||0) > (S.updatedAt||0)){
        S = merge(JSON.parse(JSON.stringify(remote)));
        try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
        applyPrefs();
        if(currentTab!=="session") render();
      }else if((S.updatedAt||0) > (remote.updatedAt||0)){ await pushRemote(); }
    }else if(S.updatedAt){ await pushRemote(); }
    syncState = "cloud";
    updateHeader();
  }catch(e){ userDoc = null; }
}

const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>Array.from(el.querySelectorAll(s));
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function todayKey(d=new Date()){ const z=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate()); }
function keyToDate(k){ const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); }
function addDays(k,n){ const d=keyToDate(k); d.setDate(d.getDate()+n); return todayKey(d); }
function diffDays(a,b){ return Math.round((keyToDate(b)-keyToDate(a))/86400000); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function dayIndex(){ return Math.max(0, diffDays(S.created, todayKey())); }
function fmtTime(s){ s=Math.max(0,Math.ceil(s)); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }
function fmtDate(k){ return keyToDate(k).toLocaleDateString("pt-BR",{day:"numeric",month:"short"}); }
function dayRec(k=todayKey()){ if(!S.days[k]) S.days[k]={m:[0,0,0],n:[0,0,0],xp:0,newIds:[]}; return S.days[k]; }
function allCards(){ return VOCAB.concat(S.custom); }
function cardById(id){ return VOCAB.find(c=>c.id===id) || S.custom.find(c=>c.id===id); }
function bolded(ex){ return esc(ex).replace(/\*(.+?)\*/g,"<b>$1</b>"); }
function blanked(ex){ return esc(ex).replace(/\*(.+?)\*/g,'<span class="gap">&nbsp;</span>'); }
function plain(ex){ return String(ex).replace(/\*/g,""); }
let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2200); }

function checkAch(){
  if(!S.ach) S.ach = {};
  const fresh = ACH.filter(a=>!S.ach[a.id] && (()=>{ try{ return a.f(); }catch(e){ return false; } })());
  fresh.forEach(a=>{ S.ach[a.id] = todayKey(); });
  fresh.forEach((a,k)=>setTimeout(()=>toast("Conquista: "+a.t), 2400*(k+1)));
  return fresh.length;
}

/* ---------- streak ---------- */
function effectiveStreak(){
  const {count,last} = S.streak; if(!last) return 0;
  const gap = diffDays(last, todayKey());
  if(gap<=1) return count;
  return (gap-1)<=S.freezes ? count : 0;
}
function bumpStreak(){
  const t = todayKey(), st = S.streak;
  if(st.last===t) return;
  const gap = st.last ? diffDays(st.last,t) : null;
  if(gap===1) st.count++;
  else if(gap>1 && gap-1<=S.freezes){ S.freezes -= gap-1; st.count++; toast("Proteção de sequência usada"); }
  else st.count = 1;
  st.last = t; st.best = Math.max(st.best, st.count);
  if(st.count%7===0 && S.freezes<2){ S.freezes++; setTimeout(()=>toast("7 dias seguidos! Você ganhou 1 proteção de sequência"),2400); }
}

/* ---------- SRS (SM-2 simplificado, 4 botões estilo Anki) ---------- */
function schedule(st,q){
  let ivl=st.ivl||0, ef=st.ef||2.5, reps=st.reps||0, lapses=st.lapses||0;
  if(q===0){ reps=0; lapses++; ef=Math.max(1.3,ef-0.2); ivl=1; }
  else{
    if(reps===0) ivl = q===3?4:1;
    else if(reps===1) ivl = q===1?2:q===2?3:6;
    else ivl = Math.round(ivl*(q===1?1.2:q===2?ef:ef*1.3));
    if(q===1) ef=Math.max(1.3,ef-0.15);
    if(q===3) ef+=0.15;
    reps++; ivl=Math.max(1,Math.min(ivl,365));
  }
  return {ivl,ef,reps,lapses};
}
function ivlLabel(d){ return d<30? d+"d" : d<365? Math.round(d/30)+"m" : "1a"; }
function dueIds(){ const t=todayKey(); return Object.keys(S.cards).filter(id=>cardById(id) && S.cards[id].due<=t); }
function introduce(id){ if(S.cards[id]) return; S.cards[id]={due:addDays(todayKey(),1),ivl:0,ef:2.5,reps:0,lapses:0,added:todayKey()}; dayRec().newIds.push(id); }
function nextNewIds(n){ const out=[]; for(const c of S.custom.concat(VOCAB)){ if(out.length>=n) break; if(!S.cards[c.id]) out.push(c.id); } return out; }
/* ---------- deck de erros ---------- */
function addMistake(m){
  if(!Array.isArray(S.mistakes)) S.mistakes = [];
  const key = m.k==="g" ? "g:"+m.l+":"+m.q : "d:"+m.d+":"+m.l;
  const ex = S.mistakes.find(x=>x.key===key);
  if(ex) ex.streak = 0; else S.mistakes.push(Object.assign({key,streak:0,date:todayKey()},m));
  if(S.mistakes.length>80) S.mistakes = S.mistakes.slice(-80);
}
function mistakeItem(m){
  if(m.k==="g"){ const L = GRAMMAR.find(l=>l.id===m.l); const q = L && L.q[m.q]; if(!q) return null;
    return {title:L.t, ctx:"", prompt:esc(q[0]).replace("___",'<span class="gap">_____</span>'), opts:q[1].map((o,j)=>[o,j===q[2],q[3]])}; }
  const D = DIALOGS.find(d=>d.id===m.d); const line = D && D.lines[m.l]; if(!line || line[0]!=="me") return null;
  const prev = D.lines.slice(0,m.l).reverse().find(l=>l[0]==="a");
  return {title:D.t, ctx:prev?prev[1]:"", prompt:"Sua vez: "+esc(line[1]), opts:line[2]};
}
function blockMistakes(el){
  const pool = shuffle((S.mistakes||[]).filter(m=>mistakeItem(m))).slice(0,10);
  if(!pool.length){ el.innerHTML = `<div class="card empty"><h3>Nenhum erro guardado</h3><p>Quando você erra uma questão de gramática ou uma resposta num diálogo, ela vem para cá. Acerte 2 vezes seguidas e ela sai do deck.</p></div>`; return; }
  let i = 0, right = 0;
  function q(){
    if(i>=pool.length){ save(); el.innerHTML = `<div class="card empty"><h3>${right}/${pool.length} corretas</h3><p>${(S.mistakes||[]).length} ${S.mistakes.length===1?"item continua":"itens continuam"} no deck. Itens acertados 2 vezes seguidas saem sozinhos.</p><button class="btn primary" id="ag">Mais uma rodada</button></div>`; $("#ag",el).onclick=()=>blockMistakes(el); return; }
    const m = pool[i], it = mistakeItem(m), opts = shuffle(it.opts);
    el.innerHTML = `<div class="card pad stack">
      <div class="row between"><span class="eyebrow">${esc(it.title)}</span><span class="mono small muted">${i+1}/${pool.length}</span></div>
      ${it.ctx?`<div class="msg ai">${esc(it.ctx)} ${spk(it.ctx)}</div>`:""}
      <p class="qsent">${it.prompt}</p>
      <div class="opts">${opts.map((o,j)=>`<button class="opt" data-j="${j}">${esc(o[0])}</button>`).join("")}</div>
      <div id="mf"></div></div>`;
    $$(".opt",el).forEach(b=>b.onclick=()=>{
      const o = opts[+b.dataset.j], ok = !!o[1];
      $$(".opt",el).forEach(x=>{ x.disabled = true; if(opts[+x.dataset.j][1]) x.classList.add("right"); });
      if(ok){ right++; m.streak++; addXP(2); if(m.streak>=2) S.mistakes = S.mistakes.filter(x=>x!==m); }
      else { b.classList.add("wrong"); m.streak = 0; }
      const why = opts.find(x=>x[1])[2];
      $("#mf",el).innerHTML = `<p class="note small">${ok?(m.streak>=2?"<b>Dominado!</b> Saiu do deck. ":"<b>Certo.</b> Mais um acerto e sai do deck. "):"<b>Ainda não.</b> "}${esc(ok?why:o[2]+" → "+why)}</p><button class="btn primary" id="mn" style="margin-top:10px">Continuar →</button>`;
      $("#mn",el).onclick = ()=>{ i++; q(); };
    });
  }
  q();
}

let voices = [];
function loadVoices(){ try{ voices = speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang)||v.lang==="en"); }catch(e){ voices=[]; } }
if("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(){
  if(S.settings.voice){ const v=voices.find(v=>v.name===S.settings.voice); if(v) return v; }
  const acc = S.settings.accent.toLowerCase();
  const same = voices.filter(v=>v.lang.toLowerCase().replace("_","-")===acc);
  const pool = same.length?same:voices;
  return pool.find(v=>/natural|neural|online|google/i.test(v.name)) || pool[0] || null;
}
function speak(text,rate){

  speechSynthesis.cancel();

  u.lang = S.settings.accent; const v = pickVoice(); if(v) u.voice = v;
  u.rate = rate ?? S.settings.rate;
  speechSynthesis.speak(u);

}
function spk(text,label){ return `<button class="icon-btn" data-say="${esc(plain(text))}" aria-label="${esc(label||"Ouvir")}" title="Ouvir">${ICON.speaker}</button>`; }

/* ---------- tempo de estudo (uso ativo: interação no último minuto e aba visível) ---------- */
let lastAct = Date.now(), unsavedSec = 0;
["click","keydown","input","touchstart"].forEach(ev=>document.addEventListener(ev,()=>{ lastAct = Date.now(); },{passive:true}));
setInterval(()=>{
  if(document.visibilityState!=="visible" || Date.now()-lastAct>60000) return;
  const r = dayRec(); r.sec = (r.sec||0)+5; unsavedSec += 5;
  if(unsavedSec>=60){ unsavedSec = 0; save(); }
},5000);
function weekStats(offset){
  const t = todayKey(); let min=0, sess=0, xp=0, words=0, days=0;
  for(let k=0;k<7;k++){ const r = S.days[addDays(t,-(k+offset))]; if(!r) continue;
    const n = daySessions(r);
    min += (r.sec||0)/60; sess += n; xp += r.xp||0; words += (r.newIds||[]).length; if(n) days++; }
  return {min:Math.round(min),sess,xp,words,days};
}

async function saveFile(filename, text, mime){
  if(window.claude && typeof window.claude.use==="function"){
    const dl = await claude.use("downloads").catch(()=>null);
    if(dl){ try{ await dl.save({filename, data:new Blob([text],{type:mime})}); return true; }catch(e){ if(e && e.code==="cancelled") return false; } }
  }
  try{ const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text],{type:mime})); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); return true; }
  catch(e){ toast("Não foi possível salvar o arquivo aqui"); return false; }
}

function startTimer(sec){

  },1000);
}
function completeBlock(){
  const k = session.kind, rec = dayRec(), def = SESSIONS[k]; blocksOf(rec,k);
  const wasDone = rec[k].every(Boolean);
  rec[k][session.i] = 1;
  if(rec[k].every(Boolean)){
    if(!wasDone){ bumpStreak(); S.xp+=20; rec.xp+=20; }
    save(); session.done = true; go("session"); return;
  }
  save();
  const next = rec[k].findIndex(x=>!x);
  session.i = next<0 ? Math.min(session.i+1, def.blocks.length-1) : next;
  go("session");
}
function renderSessionDone(){

    <p>${k==="x"?"Sequência mantida! Nos dias normais, as sessões de 15 minutos rendem muito mais — mas 5 minutos é infinitamente melhor que zero.":otherDone?"Manhã e noite completas. Amanhã tem mais — a revisão da manhã vai trazer as palavras de hoje de volta.":k==="m"?"À noite: palavras novas, uma micro-aula de gramática e o seu diário.":"Amanhã de manhã a revisão espaçada vai trazer de volta as palavras de hoje. Dormir entre aprender e revisar ajuda a memória."}</p>

const BLOCKS = {review:blockReview, listen:blockListen, speak:blockSpeak, "new":blockNew, grammar:blockGrammar, write:blockWrite};

/* ---------- 1. Spaced repetition ---------- */
function blockReview(el,opt={}){
  let queue = shuffle(opt.ids || dueIds()), extra = !!opt.ids, done = 0, total, cur, showing, prod;
  if(!queue.length && !opt.ids){
    const known = Object.keys(S.cards).filter(cardById);
    if(known.length){
      el.innerHTML = `<div class="card empty"><h3>Tudo revisado por hoje</h3><p>Nenhum cartão vence hoje. Quer um treino extra com até 10 palavras que você já viu? Ele não altera os intervalos.</p><button class="btn primary" id="ex">Treino extra</button></div>`;
      $("#ex",el).onclick = ()=>{ queue = shuffle(known).slice(0,10); extra = true; total = queue.length; next(); };
    }else{
      el.innerHTML = `<div class="card empty"><h3>Seu baralho ainda está vazio</h3><p>As palavras entram aqui depois do bloco “Palavras novas” da sessão da noite. Quer aprender as primeiras agora?</p><button class="btn primary" id="nw">Aprender 5 palavras agora</button></div>`;
      $("#nw",el).onclick = ()=>blockNew(el,opt);
    }
    return;
  }
  total = queue.length;
  function next(){
    if(!queue.length){
      keyH = null;
      el.innerHTML = `<div class="card empty"><h3>Revisão concluída</h3><p>${done} ${done===1?"cartão revisado":"cartões revisados"}. ${opt.inSession?"Siga para o próximo bloco quando quiser.":"Volte amanhã: os intervalos já foram ajustados."}</p></div>`;
      return;
    }
    cur = queue.shift(); showing = false;
    const st = S.cards[cur]; prod = (st.reps||0)>=2 && Math.random()<0.5;
    draw();
  }
  function draw(){
    const c = cardById(cur), st = S.cards[cur];
    const pct = Math.round(done/(done+queue.length+1)*100);
    const face = prod
      ? `<span class="eyebrow">Como se diz em inglês?</span><div class="prompt-pt">${esc(c.pt)}</div><p class="ex">${blanked(c.ex)}</p>${showing?"":`<input type="text" id="guess" placeholder="Pense ou digite (opcional)" autocomplete="off" style="max-width:340px">`}`
      : `<div class="word">${esc(c.w)} ${spk(c.w)}</div><p class="ex">${bolded(c.ex)}</p><span class="muted small">O que significa? Pense antes de virar.</span>`;
    const back = showing ? `<div class="back">${prod?`<div class="word">${esc(c.w)} ${spk(c.w)}</div>`:`<div class="pt">${esc(c.pt)}</div>`}<p class="ex">${bolded(c.ex)} ${spk(c.ex,"Ouvir exemplo")}</p>${st.own?`<p class="small"><span class="eyebrow">Sua frase</span><br>${esc(st.own)}</p>`:""}${(st.lapses||0)>=3?`<span class="chip" style="background:var(--bad-soft);color:var(--bad)">palavra difícil · crie uma imagem mental ou frase absurda para ela</span>`:""}</div>` : "";
    const grades = showing
      ? `<div class="grades">${["De novo","Difícil","Bom","Fácil"].map((l,q)=>`<button class="g${q}" data-q="${q}">${l}<small>${extra?"—":ivlLabel(schedule(st,q).ivl)}</small><span class="kbd">${q+1}</span></button>`).join("")}</div>`
      : `<button class="btn primary" id="rev" style="width:100%">Mostrar resposta <span class="kbd">espaço</span></button>`;
    el.innerHTML = `<div class="stack">
      <div class="row between small muted"><span>${queue.length+1} restantes${extra?" · treino extra":""}</span><span class="tag">${esc(c.tag||"")}</span></div>
      <div class="progressbar"><span style="width:${pct}%"></span></div>
      <div class="card flash">${face}${back}</div>${grades}</div>`;
    if(!showing){
      $("#rev",el).onclick = reveal;
      const g = $("#guess",el); if(g) g.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); reveal(); } });
      if(!prod) speak(c.w);
    }else{
      $$("[data-q]",el).forEach(b=>b.onclick=()=>grade(+b.dataset.q));
      if(prod) speak(c.w);
    }
  }
  function reveal(){ const g=$("#guess",el); if(g && g.value.trim()){ const ok = g.value.trim().toLowerCase().replace(/[^a-z' -]/g,"")===cardById(cur).w.toLowerCase(); toast(ok?"Acertou na escrita!":"Compare com a resposta"); } showing = true; draw(); }
  function grade(q){
    if(!extra){ const st=S.cards[cur]; const n=schedule(st,q); Object.assign(st,n,{due:addDays(todayKey(),n.ivl)}); S.stats.reviews++; if(q>0) S.stats.correct++; }
    if(q===0) queue.push(cur); else done++;
    S.xp += q===0?1:2; dayRec().xp += q===0?1:2; save();
    next();
  }
  keyH = e=>{ if(e.code==="Space" && !showing){ e.preventDefault(); reveal(); } else if(showing && /^[1-4]$/.test(e.key)) grade(+e.key-1); };
  next();
}

/* ---------- 2. Dictation + shadowing ---------- */
function norm(s){ return String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9' ]+/g," ").split(/\s+/).filter(Boolean); }
// Expande contrações dos dois lados, para "I'm" = "I am" no ditado.
function expand(tok){
  const special = {"can't":"cannot","won't":"will not","shan't":"shall not","let's":"let us","ain't":"is not"};
  if(special[tok]) return special[tok].split(" ");
  let m;
  if((m = tok.match(/^(.+)n't$/))) return [m[1],"not"];
  if((m = tok.match(/^(.+)'(ll|ve|re|d|m)$/))) return [m[1],{ll:"will",ve:"have",re:"are",d:"would",m:"am"}[m[2]]];
  if((m = tok.match(/^(it|that|he|she|what|there|here|who|where|how)'s$/))) return [m[1],"is"];
  return [tok];
}
function toks(s){ return norm(s).flatMap(expand); }
function lcsOk(t,g){
  const n=t.length,m=g.length, dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) dp[i][j] = t[i]===g[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const ok=new Array(n).fill(false); let i=0,j=0;
  while(i<n&&j<m){ if(t[i]===g[j]){ok[i]=true;i++;j++;} else if(dp[i+1][j]>=dp[i][j+1]) i++; else j++; }
  return ok;
}
function blockListen(el,opt={}){
  let item, shadows = 0, hinted = false;
  function pick(){
    const lvl = S.listenLevel||1;
    let pool = LISTEN.filter(x=>x[0]===lvl && !S.recentListen.includes(x[1]));
    if(!pool.length) pool = LISTEN.filter(x=>x[0]===lvl);
    item = pool[Math.floor(Math.random()*pool.length)];
    S.recentListen = S.recentListen.concat(item[1]).slice(-10);
  }
  function draw(){
    shadows = 0; hinted = false;
    el.innerHTML = `<div class="card pad stack">
      <div class="row between"><h3>Ditado</h3><span class="chip">Nível ${S.listenLevel}/3</span></div>
      <p class="muted small">Ouça quantas vezes precisar e escreva exatamente o que ouviu. Atenção às palavras “engolidas” na fala rápida (<i>I'd, gonna, of</i>).</p>
      <div class="row"><button class="btn primary" id="p1">${ICON.speaker} Ouvir</button><button class="btn" id="p2">Ouvir devagar</button></div>
      <label for="dict">O que você ouviu</label>
      <textarea id="dict" rows="2" placeholder="Type what you hear…" autocomplete="off" spellcheck="false"></textarea>
      <div class="row"><button class="btn" id="chk">Conferir</button><button class="btn ghost sm" id="hint">Dica: primeiras letras</button><span class="muted small">Ctrl + Enter confere</span></div>
      <p class="mono small muted" id="hintTxt" hidden></p>
      <div id="res"></div>
    </div>`;
    $("#p1",el).onclick = ()=>speak(item[1]);
    $("#p2",el).onclick = ()=>speak(item[1],0.7);
    $("#chk",el).onclick = check;
    $("#hint",el).onclick = ()=>{ hinted = true; const h=$("#hintTxt",el); h.hidden=false; h.textContent = item[1].split(" ").map(w=>w.replace(/^([^A-Za-z]*[A-Za-z'’]?)([A-Za-z'’]*)/,(m,a,b)=>a+b.replace(/[A-Za-z]/g,"_"))).join(" ") + "  (a dica limita a nota a 90%)"; };
    $("#dict",el).addEventListener("keydown",e=>{ if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); check(); } });
    setTimeout(()=>speak(item[1]),250);
  }
  function check(){
    const val = $("#dict",el).value; if(!val.trim()){ toast("Escreva o que ouviu primeiro"); return; }
    const words = item[1].split(" "), owner = [], t = [];
    words.forEach((w,wi)=>toks(w).forEach(x=>{ t.push(x); owner.push(wi); }));
    const okTok = lcsOk(t, toks(val)), ok = words.map((w,wi)=>okTok.every((v,k)=>owner[k]!==wi || v));
    let score = ok.filter(Boolean).length/ok.length;
    if(hinted) score = Math.min(score, 0.9);
    S.dict.push({d:todayKey(),s:Math.round(score*100),l:S.listenLevel});
    const recent = S.dict.filter(x=>x.l===S.listenLevel).slice(-4);
    let lvlMsg = "";
    if(recent.length>=4){ const avg = recent.reduce((a,x)=>a+x.s,0)/recent.length;
      if(avg>=90 && S.listenLevel<3){ S.listenLevel++; lvlMsg="Subiu para o nível "+S.listenLevel+" do ditado!"; }
      else if(avg<50 && S.listenLevel>1){ S.listenLevel--; lvlMsg="Nível ajustado para "+S.listenLevel+" — vamos consolidar."; } }
    addXP(Math.max(1,Math.round(score*5)));
    $("#dict",el).disabled = true; $("#chk",el).disabled = true;
    $("#res",el).innerHTML = `<div class="stack">
      <div class="row"><span class="score">${Math.round(score*100)}%</span><span class="muted">${score===1?"Perfeito!":score>=.8?"Muito bom — veja o que escapou.":"As palavras em vermelho foram as que você não pegou."}</span></div>
      <div class="diff">${words.map((w,i)=>ok[i]?`<span class="ok">${esc(w)}</span>`:`<span class="miss" role="button" tabindex="0" style="cursor:pointer" data-say="${esc(w.replace(/[.,!?;:]/g,""))}" title="Toque para ouvir">${esc(w)}</span>`).join(" ")}</div>
      ${ok.some(x=>!x)?`<p class="small muted">Toque numa palavra vermelha para ouvi-la sozinha.</p>`:""}
      ${lvlMsg?`<p class="note">${lvlMsg}</p>`:""}
      <hr class="sep">
      <h3>Shadowing</h3>
      <p class="muted small">Toque e fale <b>junto</b> com o áudio, imitando ritmo, entonação e as ligações entre palavras. Faça 3 vezes: devagar, normal, normal.</p>
      <div class="row"><button class="btn primary" id="sh">${ICON.speaker} Falar junto <span class="mono" id="shc">0/3</span></button><button class="btn" id="nx">Próxima frase →</button></div>
      ${recorderHTML("recL","Gravar e comparar")}
    </div>`;
    $("#sh",el).onclick = ()=>{ speak(item[1], shadows===0?0.75:S.settings.rate); shadows=Math.min(3,shadows+1); $("#shc",el).textContent=shadows+"/3"; if(shadows===3) addXP(3,"shadowing"); };
    $("#nx",el).onclick = ()=>{ stopRecorder(); pick(); draw(); };
    wireRecorder(el,"recL",20);
    save();
  }
  pick(); draw();
}

/* ---------- gravador (MediaRecorder) ---------- */
let activeRec = null;
function stopRecorder(){ try{ if(activeRec && activeRec.state!=="inactive") activeRec.stop(); }catch(e){} activeRec = null; }
function recorderHTML(id,label){ return `<div class="stack" style="gap:6px"><div class="row"><button class="btn" id="${id}">${ICON.mic} ${label}</button><span class="small muted" id="${id}-st"></span></div><div id="${id}-out"></div></div>`; }
function wireRecorder(el,id,maxSec){
  const btn = $("#"+id,el), st = $("#"+id+"-st",el), out = $("#"+id+"-out",el);
  if(!btn) return;
  if(!navigator.mediaDevices || !window.MediaRecorder){ btn.disabled = true; st.textContent = "Gravação não disponível neste navegador."; return; }
  let chunks = [], stream = null, timer = null;
  btn.onclick = async ()=>{
    if(activeRec && activeRec.state==="recording"){ stopRecorder(); return; }
    try{ stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
    catch(e){ st.textContent = "Microfone bloqueado aqui. No app do celular (link do GitHub) a gravação funciona."; btn.disabled = true; return; }
    chunks = []; const r = new MediaRecorder(stream); activeRec = r;
    r.ondataavailable = e=>{ if(e.data.size) chunks.push(e.data); };
    r.onstop = ()=>{ clearTimeout(timer); stream.getTracks().forEach(t=>t.stop()); btn.classList.remove("primary"); btn.innerHTML = ICON.mic+" Gravar de novo"; st.textContent = "Ouça e compare com o original.";
      const url = URL.createObjectURL(new Blob(chunks,{type:r.mimeType||"audio/webm"})); out.innerHTML = `<audio controls src="${url}" style="width:100%"></audio>`; };
    r.start(); btn.classList.add("primary"); btn.innerHTML = "■ Parar gravação"; st.textContent = "Gravando…";
    timer = setTimeout(stopRecorder, (maxSec||120)*1000);
  };
}

/* ---------- 3. Guided speaking ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
function stopRec(){ try{ rec && rec.stop(); }catch(e){} rec = null; }

      <button class="btn primary" id="nxt">Aprendi — próxima →</button></div>`;
    speak(c.w);
    const go = ()=>{ const own = $("#own",el).value.trim(); introduce(c.id); if(own) S.cards[c.id].own = own.slice(0,200); addXP(own?4:3); i++; learn(); };
    $("#nxt",el).onclick = go;
    $("#own",el).addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); go(); } });
  }
  function quiz(){
    let qi = 0, right = 0; const order = shuffle(batch);
    function q(){
      if(qi>=order.length){
        el.innerHTML = `<div class="card empty"><h3>${right}/${order.length} no mini-quiz</h3><p>As palavras entraram no seu baralho e voltam amanhã de manhã. ${opt.inSession?"Siga para a gramática.":""}</p></div>`;
        return;
      }
      const c = cardById(order[qi]);
      const distract = shuffle(allCards().filter(x=>x.id!==c.id && x.tag===c.tag)).slice(0,3);
      const opts = shuffle([c,...(distract.length<3?shuffle(allCards().filter(x=>x.id!==c.id)).slice(0,3):distract)]);
      el.innerHTML = `<div class="card pad stack"><div class="row between"><span class="eyebrow">Mini-quiz · ${qi+1}/${order.length}</span></div>
        <div class="prompt-pt">${esc(c.pt)}</div><div class="opts">${opts.map(o=>`<button class="opt" data-id="${o.id}">${esc(o.w)}</button>`).join("")}</div><div id="qf"></div></div>`;
      $$(".opt",el).forEach(b=>b.onclick=()=>{
        const ok = b.dataset.id===c.id; if(ok){ right++; addXP(2); }
        $$(".opt",el).forEach(x=>{ x.disabled=true; if(x.dataset.id===c.id) x.classList.add("right"); });
        if(!ok) b.classList.add("wrong");
        speak(c.w);
        $("#qf",el).innerHTML = `<p class="ex" style="margin-top:6px">${bolded(c.ex)}</p><button class="btn primary" id="qn" style="margin-top:10px">Continuar →</button>`;
        $("#qn",el).onclick = ()=>{ qi++; q(); };
      });
    }
    q();
  }
  learn();
}

/* ---------- 5. Grammar ---------- */
function pickLesson(){
  const undone = GRAMMAR.find(l=>!S.grammar[l.id]); if(undone) return undone;
  return GRAMMAR.slice().sort((a,b)=>(S.grammar[a.id].best-S.grammar[b.id].best) || (S.grammar[a.id].date<S.grammar[b.id].date?-1:1))[0];
}
function blockGrammar(el,opt={},lessonId){
  const L = lessonId ? GRAMMAR.find(l=>l.id===lessonId) : pickLesson();
  const prev = S.grammar[L.id];
  el.innerHTML = `<div class="card pad stack">
    <div class="row between"><span class="eyebrow">Micro-aula${prev?` · melhor nota ${prev.best}/5`:" · nova"}</span></div>
    <h2>${esc(L.t)}</h2>
    <p class="lesson-intro">${L.intro}</p>
    <ul class="exlist">${L.ex.map(x=>`<li>${spk(x)}<span>${esc(x)}</span></li>`).join("")}</ul>
    <button class="btn primary" id="gq">Praticar — 5 questões</button>
  </div>`;
  $("#gq",el).onclick = start;
  function start(){
    let i = 0, right = 0; const qs = shuffle(L.q);
    function q(){
      if(i>=qs.length){
        const best = Math.max(prev?prev.best:0, right);
        S.grammar[L.id] = {best, last:right, date:todayKey()}; save();
        el.innerHTML = `<div class="card empty"><h3>${right}/5 em “${esc(L.t)}”</h3><p>${right===5?"Perfeito. Tente usar essa estrutura no seu diário de hoje.":right>=3?"Bom! Essa aula volta para você revisar quando todas estiverem feitas.":"Tudo bem errar — é assim que a regra fixa. Releia a explicação e tente de novo."}</p><div class="row"><button class="btn" id="again">Refazer</button></div></div>`;
        $("#again",el).onclick = ()=>blockGrammar(el,opt,L.id);
        return;
      }
      const [s,o,a,e] = qs[i];
      el.innerHTML = `<div class="card pad stack">
        <div class="row between"><span class="eyebrow">${esc(L.t)}</span><span class="mono small muted">${i+1}/5</span></div>
        <div class="progressbar"><span style="width:${i*20}%"></span></div>
        <p class="qsent">${esc(s).replace("___",'<span class="gap">_____</span>')}</p>
        <div class="opts">${o.map((x,j)=>`<button class="opt" data-j="${j}">${esc(x)}</button>`).join("")}</div>
        <div id="gf"></div></div>`;
      $$(".opt",el).forEach(b=>b.onclick=()=>{
        const j = +b.dataset.j, ok = j===a; if(ok){ right++; addXP(3); } else { addMistake({k:"g",l:L.id,q:L.q.indexOf(qs[i])}); save(); }
        $$(".opt",el).forEach(x=>{ x.disabled=true; if(+x.dataset.j===a) x.classList.add("right"); });
        if(!ok) b.classList.add("wrong");
        const full = s.replace("___", o[a].replace(" / "," … "));
        $("#gf",el).innerHTML = `<p class="note">${ok?"<b>Certo.</b> ":"<b>Resposta: "+esc(o[a])+".</b> "}${esc(e)}</p><div class="row" style="margin-top:10px">${o[a].includes("/")?"":spk(full,"Ouvir a frase")}<button class="btn primary" id="gn">Continuar →</button></div>`;
        $("#gn",el).onclick = ()=>{ i++; q(); };
      });
    }
    q();
  }
}

/* ---------- 6. Writing journal ---------- */
function blockWrite(el,opt={}){
  const rec = dayRec();
  const prompt = WRITE[dayIndex() % WRITE.length];
  let ids = rec.newIds.length ? rec.newIds.slice() : Object.entries(S.cards).sort((a,b)=>(b[1].added||"")>(a[1].added||"")?1:-1).map(x=>x[0]);
  const targets = ids.map(cardById).filter(Boolean).slice(0,5).map(c=>c.w);
  let lastFb = null;
  el.innerHTML = `<div class="card pad stack">
    <span class="eyebrow">Diário · ${fmtDate(todayKey())}</span>
    <h3 class="prompt">${esc(prompt)}</h3>
    ${targets.length?`<div class="stack" style="gap:6px"><span class="eyebrow">Use pelo menos 2 palavras recentes</span><div class="row" id="tg">${targets.map(t=>`<span class="chip" data-t="${esc(t)}">${esc(t)}</span>`).join("")}</div></div>`:""}
    <textarea id="jr" rows="8" placeholder="Start writing… Pense em inglês simples em vez de traduzir frases longas do português.">${esc(S.draft||"")}</textarea>
    <div class="row between"><span class="small muted" id="wc">0 palavras · meta 80–150</span><span class="small muted">Rascunho salvo automaticamente</span></div>
    <div class="row">${AI?`<button class="btn primary" id="ai">Corrigir com IA</button>`:""}<button class="btn ${AI?"":"primary"}" id="sv">Salvar no diário</button></div>
    ${AI?"":`<div class="checks"><span class="eyebrow">Autorrevisão</span>
      <label><input type="checkbox"> Conferi os tempos verbais (passado × present perfect)</label>
      <label><input type="checkbox"> Usei conectores (however, although, therefore…)</label>
      <label><input type="checkbox"> Revisei preposições (depend on, arrive in, good at…)</label>
      <label><input type="checkbox"> Li o texto em voz alta</label></div>`}
    <div id="aiout"></div>
  </div>`;
  const ta = $("#jr",el);
  let dt;
  function upd(){
    const txt = ta.value, n = txt.trim()?txt.trim().split(/\s+/).length:0, low = txt.toLowerCase();
    $("#wc",el).textContent = n+" palavras · meta 80–150";
    $$("[data-t]",el).forEach(ch=>{ const w=ch.dataset.t.toLowerCase(), key=w.split(" ").filter(x=>x.length>2).sort((a,b)=>b.length-a.length)[0]||w; ch.classList.toggle("used", low.includes(w) || low.includes(key.slice(0,Math.max(4,key.length-2)))); });
  }
  ta.addEventListener("input",()=>{ upd(); clearTimeout(dt); dt=setTimeout(()=>{ S.draft = ta.value; save(); },800); });
  upd();
  if(AI) $("#ai",el).onclick = async ()=>{
    const text = ta.value.trim(); if(text.split(/\s+/).length<20){ toast("Escreva pelo menos 20 palavras antes de pedir correção"); return; }
    const out = $("#aiout",el); out.innerHTML = loadingHTML("Corrigindo seu texto…");
    try{ lastFb = await AI.json(correctionPrompt("write",prompt,text,targets)); out.innerHTML = feedbackHTML(lastFb) + `<p class="small muted">Dica: reescreva as frases corrigidas à mão (ou digite de novo). Copiar e colar não fixa.</p>`; }
    catch(e){ out.innerHTML = `<p class="note warn">${aiErr(e)}</p>`; }
  };
  $("#sv",el).onclick = ()=>{
    const text = ta.value.trim(); if(text.split(/\s+/).length<15){ toast("Escreva um pouco mais antes de salvar (15+ palavras)"); return; }
    S.journal.unshift({d:todayKey(),p:prompt,text:text.slice(0,4000),fb:lastFb?{level:lastFb.level,score:lastFb.score,corrected:String(lastFb.corrected||"").slice(0,4000)}:null});
    S.draft = ""; const first = !rec.wrote; rec.wrote = 1;
    if(first) addXP(20,"diário"); else save();
    toast("Salvo no diário");
    $("#sv",el).disabled = true;
  };
}

function blockChat(el){
  if(!AI){ el.innerHTML = `<div class="card empty"><h3>Conversa livre só dentro do Claude</h3><p>A conversa livre usa o Claude para responder. Aqui você pode treinar com os diálogos com roteiro, que funcionam sem IA e offline.</p><button class="btn primary" id="todlg">Abrir diálogos</button></div>`; $("#todlg",el).onclick=()=>go("practice","dialogs"); return; }
  let role = null, msgs = [], busy = false, ctrl = null;
  function pickRole(){
    el.innerHTML = `<div class="stack"><p class="muted">Escolha uma situação. A IA faz o outro personagem, mantém as respostas curtas e corrige seus erros em uma linha separada.</p>

  }
  function bubble(m){ return `<div class="msg ${m.r}">${esc(m.t)}${m.fix?`<span class="fix"><b>Correção:</b> ${esc(m.fix)}</span>`:""}</div>`; }
  function chat(){
    el.innerHTML = `<div class="card pad stack">
      <div class="row between"><h3>${esc(role.t)}</h3><button class="btn sm ghost" id="end">Trocar situação</button></div>
      <div class="chat" id="ch">${msgs.map(bubble).join("")}</div>

    $("#ci",el).focus();

  async function send(){
    const inp = $("#ci",el), text = inp.value.trim(); if(!text || busy) return;

    const turns = [{role:"user",content:`Let's do an English conversation role-play. Scenario: ${role.d}
I am the learner: a Brazilian at intermediate (B1) level aiming for B2. Rules for every reply:
- Stay in character. Reply in 1 to 3 short, natural sentences, slightly above my level, and end with a question or prompt that keeps me talking.
- If my last message had a grammar or word-choice mistake, add ONE final line that starts with "Correction:" showing my sentence corrected and a very short reason in Portuguese. If there was no real mistake, don't add that line.
