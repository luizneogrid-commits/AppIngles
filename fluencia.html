 ["a","Great. Do you have any questions for us?"],
 ["me","Pergunte como é um dia típico na função",[["Yes. What does a typical day look like for someone in this role?",1,"Pergunta inteligente e bem estruturada."],["No, I don't have.",0,"Sempre faça uma pergunta. E “have” precisa de objeto: “I don't have any”."],["Yes. How is a typical day for this role?",0,"Mais natural: “What does a typical day look like…?”"]]],
 ["a","Good question. Most days start with a quick team meeting. We'll be in touch by Friday."]]},
{id:"status",t:"Reunião de status",lvl:"B1+",d:"Explicar um atraso e propor uma solução.",lines:[
 ["a","Morning, everyone. Could you give us a quick update on the website project?"],
 ["me","Diga que está quase pronto, mas uma semana atrasado",[["Sure. We're almost done, but we're running about a week behind schedule.",1,"“Behind schedule” = atrasado em relação ao cronograma."],["Sure. We are almost ready, but we are delayed of one week.",0,"Não existe “delayed of”; diga “a week behind schedule” ou “delayed by a week”."],["Sure. It's almost finished but late one week.",0,"Estrutura incompleta; use “running a week behind”."]]],
 ["a","I see. What's causing the delay?"],
 ["me","Explique que estão esperando o conteúdo do cliente",[["We're still waiting for the client to send us the final content.",1,"“Wait for someone to do something”."],["We are still waiting the client send the content.",0,"Faltam “for” e “to”: “waiting for the client to send”."],["We still wait the content from the client.",0,"Ação em andamento → “We're still waiting for”."]]],
 ["a","Is there anything we can do to speed things up?"],
 ["me","Sugira marcar uma ligação com o cliente",[["It might help if we set up a call with them this week.",1,"“It might help if…” é uma sugestão educada."],["We must to call the client.",0,"Depois de modal, sem “to”: “we must call”."],["I suggest to call the client.",0,"“Suggest” + -ing ou “suggest that we call”."]]],
 ["a","Good idea. Can you take care of that?"],
 ["me","Aceite e diga que manda o convite hoje à tarde",[["Absolutely. I'll send them an invite this afternoon.",1,"Decisão na hora → will."],["Absolutely. I send the invitation today in the afternoon.",0,"Use “I'll send… this afternoon”."],["Sure, I'm going to sending it.",0,"“Going to” + verbo base: “I'm going to send it”."]]],
 ["a","Perfect. Let's touch base again on Thursday."],
 ["me","Concorde e diga que vai mantê-los informados",[["Sounds good. I'll keep you posted.",1,"“Keep you posted” = manter informado."],["Sounds good. I will keep you informated.",0,"“Informated” não existe; diga “keep you posted/updated”."],["Is good for me.",0,"Falta sujeito: “That's good for me” / “Sounds good”."]]],
 ["a","Great. Thanks, everyone."]]},
{id:"doctor",t:"No médico",lvl:"B1",d:"Descrever sintomas, alergias e entender a receita.",lines:[
 ["a","Hi, have a seat. What seems to be the problem?"],
 ["me","Diga que está com dor de garganta e febre há dois dias",[["I've had a sore throat and a fever for two days.",1,"Present perfect + for."],["I have a sore throat and fever since two days.",0,"Com duração use “for”, e o tempo verbal é present perfect."],["I'm with a sore throat and fever.",0,"Tradução de “estou com”. Em inglês: “I have / I've got”."]]],
 ["a","I see. Are you taking any medication at the moment?"],
 ["me","Diga que só tomou analgésico para a dor de cabeça",[["Just some painkillers for the headache.",1,"“Painkillers” = analgésicos."],["Only some remedies for the head pain.",0,"Use “medicine” ou “painkillers”, e “headache”."],["I took some pills of pain.",0,"Use “painkillers”."]]],
 ["a","Any allergies?"],
 ["me","Diga que é alérgico a penicilina",[["Yes, I'm allergic to penicillin.",1,"“Allergic to”."],["Yes, I have allergy of penicillin.",0,"“Allergic to” ou “an allergy to”."],["Yes, penicillin makes me allergy.",0,"Use “I'm allergic to penicillin”."]]],
 ["a","Thanks for letting me know. It looks like a throat infection. I'll prescribe something without penicillin."],
 ["me","Pergunte com que frequência deve tomar",[["How often should I take it?",1,"“How often” pergunta a frequência."],["How many times for day I take?",0,"Diga “a day” e use auxiliar: “How many times a day should I take it?”"],["What frequency I must take?",0,"Soa artificial; use “How often should I take it?”"]]],
 ["a","Twice a day, after meals, for seven days. Get plenty of rest and drink lots of water."],
 ["me","Agradeça",[["Great, thank you so much, doctor.",1,"Natural."],["Thanks, doctor, you are very kind with me.",0,"“Kind to me”, não “with”."],["Thank you for all, doctor.",0,"Diga “Thank you for everything”."]]],
 ["a","You're welcome. Feel better soon!"]]},
{id:"hotel",t:"Problema no hotel",lvl:"B1",d:"Reclamar do quarto e pedir para trocar.",lines:[
 ["a","Front desk, how can I help you?"],
 ["me","Diga seu quarto (305) e que o ar-condicionado não funciona",[["Hi, this is room three oh five. The air conditioning isn't working.",1,"“Isn't working” para defeito. Número de quarto se lê dígito a dígito."],["Hi, room three hundred five. The air conditioning don't work.",0,"Terceira pessoa: “doesn't work”."],["Hello, the air conditioning is not functioning well since I arrived.",0,"“Since I arrived” pede present perfect: “hasn't been working”."]]],
 ["a","I'm so sorry about that. I'll send someone up right away."],
 ["me","Pergunte quanto tempo vai levar, mais ou menos",[["Thanks. Roughly how long will it take?",1,"“Roughly” = mais ou menos."],["Thanks. How much time it will take?",0,"Pergunta precisa de inversão: “How long will it take?”"],["Thanks. It will delay much?",0,"Use “How long will it take?”"]]],
 ["a","About twenty minutes. If it can't be fixed, we can move you to another room."],
 ["me","Diga que prefere trocar de quarto, pois tem reunião cedo",[["Actually, I'd rather change rooms. I have an early meeting tomorrow.",1,"“I'd rather” + verbo base; “change rooms” no plural."],["Actually, I prefer to change of room.",0,"Diga “change rooms”, sem “of”."],["Actually, I rather change the room.",0,"Falta o 'd: “I'd rather”."]]],
 ["a","Of course. Room four twelve is available. Your new key will be ready at the desk."],
 ["me","Pergunte se alguém pode ajudar com a bagagem",[["Great. Could someone help me with my luggage?",1,"“Luggage” é incontável; pedido educado com “could”."],["Great. Could someone help me with my luggages?",0,"“Luggage” é incontável: sem “s”."],["Great. Someone can help me with the bags?",0,"Pergunta precisa de inversão: “Can someone help…?”"]]],
 ["a","Certainly, I'll send someone right away. Again, sorry for the inconvenience."]]},
{id:"monday",t:"Papo de segunda-feira",lvl:"B1",d:"Small talk com um colega sobre o fim de semana.",lines:[
 ["a","Hey! How was your weekend?"],
 ["me","Diga que foi ótimo e que foi à praia com amigos",[["It was great, thanks! I went to the beach with some friends.",1,"Past simple para um fim de semana que já terminou."],["It was great! I have gone to the beach with friends.",0,"Tempo terminado → past simple: “I went”."],["Was great! I went in the beach.",0,"Falta sujeito (“It was”), e é “go to the beach”."]]],
 ["a","Nice! Lucky you. It rained all weekend here."],
 ["me","Pergunte o que ele fez, então",[["Oh no! So what did you get up to?",1,"“Get up to” = fazer (informal)."],["Oh no! So what you did?",0,"Pergunta no passado precisa de “did”: “What did you do?”"],["Oh no! So what have you done in the weekend?",0,"Tempo terminado → past simple; e “on/at the weekend”."]]],
 ["a","Not much, honestly. I watched a whole new series in two days."],
 ["me","Pergunte qual e se vale a pena",[["Which one? Is it worth watching?",1,"“Worth” + -ing."],["Which? It worths to watch?",0,"“Worth” não é verbo: “Is it worth watching?”"],["What series? Is worth to see?",0,"Falta sujeito, e a estrutura é “worth watching”."]]],
 ["a","Definitely. It's a crime thriller set in Norway. You'd love it."],
 ["me","Diga que vai anotar o nome",[["Cool, I'll write that down.",1,"“Write down” = anotar."],["Cool, I will note the name.",0,"Mais natural: “I'll write it down” ou “make a note of it”."],["Cool, I'm going to anotate.",0,"“Anotate” não existe; diga “write it down”."]]],
 ["a","Anyway, back to work! Have a good week."]]},
{id:"directions",t:"Pedindo informação na rua",lvl:"A2–B1",d:"Encontrar a estação de metrô mais próxima.",lines:[
 ["a","Yes? Can I help you?"],
 ["me","Peça licença e pergunte onde fica a estação de metrô mais próxima",[["Excuse me, could you tell me where the nearest subway station is?",1,"Pergunta indireta: o verbo vai para o fim."],["Excuse me, could you tell me where is the nearest subway station?",0,"Em pergunta indireta, o verbo vai no fim: “where the station is”."],["Sorry, where stays the subway station?",0,"“Stay” não é “ficar” no sentido de localização; use “Where is…?”"]]],
 ["a","Sure. Go straight down this street for two blocks, then turn left at the bank."],
 ["me","Confirme: duas quadras e à esquerda no banco",[["So, two blocks straight and then left at the bank?",1,"Repetir para confirmar evita erros."],["So, two quarters and left in the bank?",0,"Quadra = “block”; e “at the bank”."],["Two blocks and left on the bank, correct?",0,"Referência de lugar → “at the bank”."]]],
 ["a","Exactly. The station will be on your right, next to a pharmacy."],
 ["me","Pergunte se dá para ir a pé",[["Is it within walking distance?",1,"“Within walking distance” = dá para ir a pé."],["Can I go by foot?",0,"A expressão é “on foot”; mais natural: “Can I walk there?”"],["It's possible go walking?",0,"Estrutura: “Is it possible to walk there?”"]]],
 ["a","Oh yes, it's only about five minutes."],
 ["me","Agradeça bastante",[["Thanks so much, I really appreciate it.",1,"“I appreciate it” é um agradecimento caloroso."],["Thanks a lot, I appreciate.",0,"“Appreciate” precisa de objeto: “I appreciate it”."],["Very thank you!",0,"Não existe; diga “Thank you very much”."]]],
 ["a","No problem. Have a good one!"]]},
{id:"return",t:"Devolvendo um produto",lvl:"B1",d:"Explicar o defeito e pedir reembolso.",lines:[
 ["a","Hi, how can I help you today?"],
 ["me","Diga que quer devolver o fone que comprou semana passada",[["Hi, I'd like to return these headphones. I bought them last week.",1,"“I'd like to return…” + past simple."],["Hi, I want to give back this headphone. I have bought it last week.",0,"“Headphones” é plural; “last week” → “I bought”."],["Hi, I come to devolve these headphones.",0,"“Devolve” é falso cognato; use “return”."]]],
 ["a","Sure. What seems to be the problem with them?"],
 ["me","Explique que o lado esquerdo parou de funcionar depois de dois dias",[["The left side stopped working after two days.",1,"“Stop” + -ing = parar de."],["The left side stopped to work after two days.",0,"“Stopped to work” = parou PARA trabalhar. Use “stopped working”."],["The left part is not working more.",0,"Use “not… anymore”: “doesn't work anymore”."]]],
 ["a","I'm sorry to hear that. Do you have the receipt?"],
 ["me","Diga que está no celular",[["Yes, I've got it here on my phone.",1,"“On my phone”."],["Yes, I have in my cellphone.",0,"Falta o objeto (“it”), e é “on my phone”."],["Yes, is in the phone.",0,"Falta sujeito: “It's on my phone”."]]],
 ["a","Great. Would you like a refund or an exchange?"],
 ["me","Peça o reembolso",[["I'd prefer a refund, please.",1,"“Refund” = reembolso."],["I want my money of back.",0,"Diga “I want my money back”, ou melhor, “a refund”."],["I prefer the reimbursement.",0,"“Reimbursement” é para despesas; em loja é “refund”."]]],
 ["a","No problem. The money will go back to your card within three to five business days."],
 ["me","Agradeça a ajuda",[["Perfect, thanks for your help.",1,"Natural."],["Perfect, thanks for the help me.",0,"Diga “thanks for helping me” ou “thanks for your help”."],["Perfect, I'm obliged.",0,"Muito formal e antiquado."]]],
 ["a","You're welcome. Have a nice day!"]]},
{id:"phone",t:"Remarcando por telefone",lvl:"B1+",d:"Ligar para o dentista e mudar o horário.",lines:[
 ["a","Good afternoon, Bright Dental, Lisa speaking."],
 ["me","Diga seu nome (Marco) e que quer remarcar a consulta de quinta",[["Hi Lisa, this is Marco. I'd like to reschedule my appointment on Thursday.",1,"Ao telefone: “This is…”; remarcar = “reschedule”."],["Hi Lisa, I am Marco. I want to remark my consult of Thursday.",0,"Ao telefone use “This is…”; consulta = “appointment”; remarcar = “reschedule”."],["Hi, here speaks Marco. I need to change my consultation.",0,"“Here speaks” não existe: “This is Marco”."]]],
 ["a","Sure, Marco. What day would work better for you?"],
 ["me","Pergunte se tem horário na segunda de manhã",[["Do you have anything available on Monday morning?",1,"“Available on Monday morning”."],["Do you have something free in Monday in the morning?",0,"Dias levam “on”: “on Monday morning”."],["Have you any hour on Monday?",0,"Soa estranho; diga “Do you have anything available…?”"]]],
 ["a","Let me check. I have nine thirty or eleven fifteen."],
 ["me","Escolha nove e meia",[["Nine thirty works for me.",1,"“Works for me” = está bom para mim."],["Nine thirty is good to me.",0,"Diga “good for me”."],["I stay with nine thirty.",0,"“Fico com” não é “stay”: diga “I'll take nine thirty”."]]],
 ["a","Great, you're all set for Monday at nine thirty. Is there anything else?"],
 ["me","Pergunte se deve chegar um pouco antes",[["Should I get there a bit early?",1,"“Get there early”."],["I need arrive before?",0,"Faltam auxiliar e “to”: “Do I need to arrive early?”"],["Must I to arrive early?",0,"Modal sem “to”, e “should” soa mais natural aqui."]]],
 ["a","Ten minutes early would be perfect. See you on Monday!"]]},
{id:"pharmacy",t:"Na farmácia",lvl:"A2",d:"Pedir algo para dor de cabeça e entender como tomar.",lines:[
 ["a","Hi there. How can I help you?"],
 ["me","Diga que está com dor de cabeça",[["Hi. I have a headache.",1,"“Have a headache” = estar com dor de cabeça."],["Hi. I am with headache.",0,"Tradução de “estou com”. Use “I have a headache”."],["Hi. My head is hurting me.",0,"Compreensível, mas o natural é “I have a headache”."]]],
 ["a","I'm sorry to hear that. How long have you had it?"],
 ["me","Diga que desde hoje de manhã",[["Since this morning.",1,"“Since” + ponto no tempo."],["For this morning.",0,"Ponto no tempo usa “since”, não “for”."],["From this morning ago.",0,"“Ago” não combina aqui; diga “since this morning”."]]],
 ["a","OK. You can take these painkillers. Are you allergic to anything?"],
 ["me","Diga que não, não tem alergias",[["No, I'm not allergic to anything.",1,"“Allergic to”."],["No, I don't have allergic.",0,"“Allergic” é adjetivo: “I'm not allergic” ou “I don't have any allergies”."],["No, I'm not allergy.",0,"Use “I'm not allergic to anything”."]]],
 ["a","Great. Take one tablet every eight hours, with water."],
 ["me","Pergunte se pode tomar de estômago vazio",[["Can I take it on an empty stomach?",1,"“On an empty stomach” = de estômago vazio."],["Can I take it with the stomach empty?",0,"A expressão fixa é “on an empty stomach”."],["I can take without eating?",0,"Pergunta precisa de inversão: “Can I take it without eating?”"]]],
 ["a","It's better to eat something first. That'll be nine dollars."],
 ["me","Pague e agradeça",[["Here you go. Thanks for your help.",1,"“Here you go” ao entregar o dinheiro ou cartão."],["Take. Thank you for the help me.",0,"Use “Here you go” e “thanks for your help”."],["Here is. Thanks.",0,"Falta o sujeito: “Here it is” ou “Here you go”."]]],
 ["a","You're welcome. I hope you feel better soon!"]]},
{id:"complaint",t:"Reclamando no restaurante",lvl:"B1",d:"O prato veio errado e frio — resolva com educação.",lines:[
 ["a","Is everything OK with your meal?"],
 ["me","Diga, com educação, que não pediu esse prato",[["Actually, I'm afraid this isn't what I ordered.",1,"“I'm afraid…” suaviza a reclamação — muito britânico e educado."],["No. This is not my order, you made a mistake.",0,"Direto demais; soa agressivo em inglês."],["Actually, I didn't asked this.",0,"Depois de “didn't”, verbo base: “I didn't ask for this” / “order this”."]]],
 ["a","Oh, I'm so sorry! What did you order?"],
 ["me","Diga que pediu o salmão grelhado",[["I ordered the grilled salmon.",1,"Past simple de “order”."],["I have ordered the grilled salmon.",0,"Ação terminada num momento definido → past simple."],["I asked the salmon grilled.",0,"Adjetivo antes do substantivo (“grilled salmon”) e “asked for”."]]],
 ["a","I'll get that for you right away. Is there anything else?"],
 ["me","Diga que as batatas também estão frias",[["Also, the fries are a bit cold.",1,"“A bit” suaviza a crítica."],["Also, the fries is cold.",0,"“Fries” é plural → “are”."],["Also, the potatoes are very frozen.",0,"“Frozen” = congelado. Frio aqui é “cold”."]]],
 ["a","I'm really sorry about that. We'll bring you fresh ones, and the dessert is on the house."],
 ["me","Agradeça pela gentileza",[["That's very kind of you, thank you.",1,"“That's very kind of you” é o agradecimento padrão."],["You are very kind with me, thanks.",0,"“Kind to me”, não “with”."],["Thanks, is very nice of you.",0,"Falta o sujeito: “It's very nice of you”."]]],
 ["a","It's the least we can do. Your salmon will be out in ten minutes."]]},
{id:"apartment",t:"Visitando um apartamento",lvl:"B1",d:"Perguntar sobre aluguel, contas e contrato.",lines:[
 ["a","Welcome! So, this is the apartment. What do you think so far?"],
 ["me","Diga que é mais espaçoso do que esperava",[["It's more spacious than I expected.",1,"Comparativo + “than I expected”."],["It's more spacious than I was expecting it.",0,"Sobrou o “it”: “than I was expecting”."],["It's more big than I thought.",0,"Adjetivo curto: “bigger”, nunca “more big”."]]],
 ["a","Great! Any questions?"],
 ["me","Pergunte se as contas estão incluídas no aluguel",[["Are utilities included in the rent?",1,"“Utilities” = contas de água, luz, gás."],["The bills are inclusive in the rent?",0,"Use inversão e “included”: “Are the bills included in the rent?”"],["Is included the bills in the rent?",0,"Ordem: “Are the bills included…?”"]]],
 ["a","Water is included, but electricity and internet are not."],
 ["me","Pergunte quanto tempo dura o contrato",[["How long is the lease?",1,"“Lease” = contrato de aluguel."],["How much time is the contract?",0,"Duração: “How long…?”; e contrato de aluguel é “lease”."],["The contract is for how long time?",0,"Diga “How long is the lease?”"]]],
 ["a","It's a twelve-month lease, and we ask for one month's deposit."],
 ["me","Diga que gostou e quer pensar até amanhã",[["I really like it. Can I let you know by tomorrow?",1,"“Let you know” = te dar uma resposta."],["I like very much. I will think and tell you tomorrow.",0,"“Like” pede objeto e advérbio no fim: “I like it very much”."],["I liked a lot. I answer you tomorrow.",0,"Use “I really like it” e “I'll let you know tomorrow”."]]],
 ["a","Of course. Just send me a message, but don't wait too long. There's a lot of interest."]]},
{id:"raise",t:"Pedindo um aumento",lvl:"B1+",d:"Conversa com a gestora sobre salário, com argumentos.",lines:[
 ["a","Hi, come in. You wanted to talk about something?"],
 ["me","Diga que queria conversar sobre seu salário",[["Yes, thanks for your time. I'd like to discuss my salary.",1,"“Discuss” não leva “about”."],["Yes. I want to discuss about my salary.",0,"“Discuss” é transitivo direto: “discuss my salary”."],["Yes. I need more money.",0,"Direto demais para uma negociação."]]],
 ["a","OK, I'm listening."],
 ["me","Mencione que assumiu mais responsabilidades no último ano",[["Over the past year, I've taken on a lot more responsibility.",1,"Present perfect para um período até agora; “take on” = assumir."],["In the last year, I took more responsibilities.",0,"Período até agora → present perfect; e “take on” soa mais natural."],["Since one year I have more responsibilities.",0,"“Since one year” não existe; use “for a year” ou “over the past year”."]]],
 ["a","That's true. You've led two major projects."],
 ["me","Diga que, com base nisso, acredita que um reajuste de 10% seria justo",[["Based on that, I believe a ten percent raise would be fair.",1,"“Raise” = aumento; “would be fair” soa firme e educado."],["Based on this, I deserve ten percent more of salary.",0,"Soa exigente e a estrutura não é natural; use “a ten percent raise”."],["So I think is fair ten percent more.",0,"Falta sujeito e a ordem está errada."]]],
 ["a","I appreciate you bringing this up. I can't promise ten percent, but let me talk to HR."],
 ["me","Agradeça e pergunte quando terá uma resposta",[["Thank you. When do you think you'll have an answer?",1,"Pergunta indireta e educada sobre prazo."],["Thanks. When you will have an answer?",0,"Pergunta direta precisa de inversão: “When will you have…?”"],["Thanks. Until when you answer me?",0,"Use “When do you think you'll have an answer?”"]]],
 ["a","I should know by the end of next week. Thanks for being so well prepared."]]}
];

// Leituras graduadas: texto, glossário (toque para traduzir) e perguntas [pergunta, opções, índice correto]

{id:"mycity",t:"My City",lvl:"A1",text:"I live in Florianópolis, in the south of Brazil. It is an island, so there are many beautiful beaches. The city is not very big, but it is busy in the summer. There are good restaurants near the sea, and the seafood is fresh and cheap. In the winter, it is cold and windy, and there are not many tourists. I like my city because it is quiet and green. The only problem is the traffic on the bridge in the morning.",
 gloss:{"south":"sul","island":"ilha","beaches":"praias","busy":"movimentada","near":"perto de","seafood":"frutos do mar","fresh":"fresco","windy":"com vento","tourists":"turistas","quiet":"tranquila","bridge":"ponte"},
 q:[["Where is Florianópolis?",["In the north of Brazil","In the south of Brazil","In Portugal"],1],["How is the city in the winter?",["Hot and busy","Cold and windy","Full of tourists"],1],["What is the problem in the morning?",["The traffic on the bridge","The rain","The restaurants are closed"],0]]},
{id:"badday",t:"A Terrible Monday",lvl:"A2",text:"Last Monday was a terrible day. First, my alarm didn't ring, so I woke up late. I didn't have time for breakfast. Then I ran to the bus stop, but the bus was already gone. I took a taxi, and it was very expensive. When I arrived at work, I realized that I forgot my laptop at home! My boss wasn't happy. At lunch, I spilled coffee on my shirt. In the evening, I finally got home, took a shower and went to bed early. Tuesday was much better.",
 gloss:{"alarm":"despertador","didn't ring":"não tocou","woke up":"acordei","ran":"corri","already gone":"já tinha ido embora","arrived":"cheguei","realized":"percebi","forgot":"esqueci","spilled":"derrubei","finally":"finalmente"},
 q:[["Why did the writer wake up late?",["The alarm didn't ring","He was sick","It was a holiday"],0],["How did he go to work?",["By bus","By taxi","On foot"],1],["What did he forget at home?",["His keys","His laptop","His wallet"],1]]},
{id:"holiday",t:"Plans for the Holiday",lvl:"A2",text:"Next month, my family and I are going to travel to Salvador for a week. We are going to stay in a small hotel near the beach. My kids are very excited because they are going to see the sea for the first time. On the first day, we are going to walk around the old town and eat acarajé. We are not going to rent a car, because it is easy to take taxis. I'm going to take a lot of pictures and, of course, relax.",
 gloss:{"Next month":"mês que vem","travel":"viajar","stay":"ficar (hospedar-se)","kids":"filhos, crianças","excited":"animados","for the first time":"pela primeira vez","walk around":"passear a pé","old town":"centro histórico","rent a car":"alugar um carro","pictures":"fotos","relax":"relaxar"},
 q:[["How long is the trip?",["A weekend","A week","A month"],1],["Why are the kids excited?",["They are going to see the sea for the first time","They are going to drive","They have a new toy"],0],["Why aren't they going to rent a car?",["It is expensive","It is easy to take taxis","They can't drive"],1]]},
{id:"myday",t:"My Day",lvl:"A1",text:"My name is Lucas. I am thirty years old and I live in Belo Horizonte with my wife and our dog, Max. I work in an office downtown. Every day, I wake up at six thirty. I have breakfast with my wife: bread, fruit and a lot of coffee. Then I take the bus to work. I start work at eight. I usually have lunch with my colleagues at a small restaurant near the office. I get home at six. In the evening, I walk the dog, cook dinner and watch TV. On the weekend, I don't work. I sleep late and visit my parents.",

{id:"sunday",t:"A Family Sunday",lvl:"A2",text:"Last Sunday was my grandmother's birthday, so the whole family met at her house. My aunt made a big lunch, and my cousins brought a chocolate cake. There were more than twenty people in a small apartment! We ate, talked and laughed for hours. After lunch, my grandfather played the guitar and we all sang together. My grandmother was very happy. She said it was the best birthday of her life. In the evening, I was tired, but I didn't want to go home. I love my big, noisy family.",

{id:"memory",t:"Why We Forget",lvl:"B1",text:"In the 1880s, a German psychologist named Hermann Ebbinghaus tested his own memory by learning lists of nonsense words. He discovered that we forget most new information within a day, unless we review it. This pattern became known as the forgetting curve. The good news is that every time we review something at the right moment, just before we forget it, the memory lasts longer. This is the idea behind spaced repetition, the method used by apps like Anki. Instead of studying for hours once a week, it is far more effective to review for a few minutes every day. In other words, consistency beats intensity.",
 gloss:{"nonsense":"sem sentido","discovered":"descobriu","unless":"a menos que","review":"revisar","pattern":"padrão","forgetting curve":"curva do esquecimento","lasts":"dura","spaced repetition":"repetição espaçada","far more":"muito mais","consistency beats intensity":"constância vence intensidade"},
 q:[["What did Ebbinghaus use to test his memory?",["Lists of nonsense words","Famous poems","Foreign languages"],0],["When is the best moment to review?",["Right after learning","Just before you forget","Once a month"],1],["What is the main message of the text?",["Study for hours on weekends","Short daily reviews work better","Memory cannot be improved"],1]]},
{id:"phone",t:"A Weekend Without a Phone",lvl:"B1",text:"Last month, I decided to spend a whole weekend without my phone. On Friday night, I switched it off and put it in a drawer. On Saturday morning, I kept reaching for my pocket out of habit. It was harder than I had expected. By the afternoon, though, something changed. I read fifty pages of a novel, went for a long walk and actually noticed the trees on my street. On Sunday, I had lunch with my parents and nobody looked at a screen. When I turned my phone back on, I had ninety-seven messages. Surprisingly, none of them were urgent.",
 gloss:{"whole":"inteiro","switched it off":"desliguei","drawer":"gaveta","kept reaching for":"continuava levando a mão ao","out of habit":"por hábito","expected":"esperava","though":"porém","novel":"romance (livro)","noticed":"reparei","urgent":"urgentes"},
 q:[["How did the writer feel on Saturday morning?",["Relaxed from the start","It was harder than expected","He forgot about the phone"],1],["What did he do in the afternoon?",["Watched TV","Read and went for a walk","Worked from home"],1],["What surprised him in the end?",["He had no messages","None of the messages were urgent","His phone was broken"],1]]},
{id:"lisbon",t:"A Brazilian in Lisbon",lvl:"B1",text:"When Camila moved from São Paulo to Lisbon to work remotely, she thought the language would be the easy part. After all, Portuguese is her first language. What she didn't expect was that most of her daily work would happen in English. Her team is spread across six countries, and every meeting, email and chat is in English. \"At the beginning, I understood almost everything, but I struggled to speak up,\" she says. \"I would prepare what to say, and by the time I was ready, the conversation had moved on.\" To overcome this, she started joining meetings with one goal: to say at least one thing, even if it wasn't perfect.",
 gloss:{"remotely":"remotamente","After all":"afinal","expect":"esperar (prever)","spread across":"espalhado por","struggled":"tive dificuldade","speak up":"me manifestar, falar","by the time":"quando finalmente","moved on":"seguiu em frente","overcome":"superar","at least":"pelo menos"},

{id:"cafe",t:"No Laptops Allowed",lvl:"B1+",text:"A popular café in Brooklyn has made a controversial decision: laptops are no longer allowed on weekends. The owner, Maria Lopez, explains that many customers were buying one coffee and staying for five hours. \"It's not only about money,\" she says. \"The place used to be full of conversation, and it had become silent, like a library.\" Not everyone is happy about the new rule. Some freelancers claim they have nowhere else to work. On the other hand, regular customers say the atmosphere has improved and it's easier to find a table. Lopez insists that the rule is here to stay, at least for now.",
 gloss:{"controversial":"polêmica","no longer":"não mais","allowed":"permitidos","owner":"dona","used to be":"costumava ser","claim":"afirmam","nowhere else":"nenhum outro lugar","regular customers":"clientes frequentes","atmosphere":"ambiente","insists":"insiste","here to stay":"veio para ficar"},

{id:"fourday",t:"The Four-Day Week",lvl:"B1+",text:"Last year, a software company in Manchester decided to try something unusual: a four-day work week with no pay cut. At first, managers were skeptical. They worried that deadlines would be missed and clients would complain. However, after six months, the results were surprising. Productivity went up by eight percent, and sick days dropped significantly. Employees said they felt more focused because they knew they had less time. Some admitted that the first weeks were tough, as they had to cut down on unnecessary meetings. The company has now made the change permanent, although it acknowledges that the model may not work for every business.",
 gloss:{"unusual":"incomum","pay cut":"corte de salário","skeptical":"céticos","deadlines":"prazos","sick days":"faltas por doença","significantly":"significativamente","focused":"concentrados","admitted":"admitiram","tough":"difíceis","cut down on":"reduzir","acknowledges":"reconhece"},
 q:[["What happened to productivity?",["It went down","It went up by eight percent","It stayed the same"],1],["Why did employees feel more focused?",["They knew they had less time","They earned more","Managers watched them closely"],0],["What does the company think about the model?",["It works for every company","It may not suit every business","It was a failure"],1]]},
{id:"failure",t:"Fail Fast, Learn Faster",lvl:"B2",text:"In many companies, failure is still seen as something to hide. Yet some of the most innovative organizations actively encourage their teams to share mistakes. At one design agency, employees present a \"failure of the month\" in a relaxed meeting, explaining what went wrong and what they would do differently. The goal is not to celebrate carelessness, but to make it safe to take reasonable risks. Research on so-called psychological safety suggests that teams who feel comfortable admitting errors tend to learn faster and perform better. Ironically, the fear of looking incompetent is often what prevents people from becoming competent.",
 gloss:{"failure":"fracasso","hide":"esconder","Yet":"no entanto","encourage":"incentivam","carelessness":"descuido","reasonable":"razoáveis","so-called":"assim chamada","admitting":"admitir","tend to":"tendem a","perform":"ter desempenho","prevents":"impede"},
 q:[["What happens in the “failure of the month” meeting?",["People are punished","People explain a mistake and what they would change","People vote for the worst employee"],1],["What is the goal of the meeting?",["To celebrate carelessness","To make reasonable risks feel safe","To reduce costs"],1],["What is ironic, according to the text?",["Fear of looking incompetent stops people from improving","Experts make more mistakes","Meetings are a waste of time"],0]]},
{id:"interview",t:"Ana's First Interview",lvl:"A2",text:"Ana had her first job interview in English last week. She was very nervous, so she practiced her answers every night with a friend. On the day of the interview, she arrived fifteen minutes early. The manager was friendly and asked simple questions about her experience and her plans. Ana didn't understand one question, so she asked, \"Could you repeat that, please?\" The manager smiled and said it again, more slowly. After thirty minutes, the interview finished. Two days later, Ana received an email. She got the job!",
 gloss:{"nervous":"nervosa","practiced":"praticou","arrived":"chegou","early":"cedo","manager":"gerente","friendly":"simpático","experience":"experiência","repeat":"repetir","slowly":"devagar","received":"recebeu"},
 q:[["How did Ana prepare for the interview?",["She read a book about interviews","She practiced every night with a friend","She didn't prepare"],1],["What did she do when she didn't understand a question?",["She asked the manager to repeat it","She answered anything","She left the room"],0],["What happened in the end?",["She had another interview","She never heard from them","She got the job"],2]]},
{id:"smalltalk",t:"Small Talk Is Not Small",lvl:"B1",text:"Many Brazilians who move abroad are surprised by how much small talk matters at work. Conversations about the weather, the weekend or a football game may seem pointless, but they build trust. In countries like the United States and the United Kingdom, colleagues often chat for a few minutes before a meeting starts. If you stay silent, people may think you are unfriendly, even if you are just shy. The good news is that small talk follows predictable patterns. Learning a handful of questions and reactions, like \"How was your weekend?\" and \"Oh, that sounds fun!\", can make a huge difference.",
 gloss:{"abroad":"no exterior","small talk":"conversa informal","pointless":"sem sentido","trust":"confiança","chat":"conversam","unfriendly":"antipático","shy":"tímido","predictable":"previsíveis","a handful of":"um punhado de","huge":"enorme"},
 q:[["According to the text, what does small talk build?",["Stress","Trust","Money"],1],["What may colleagues think if you stay silent?",["That you are smart","That you are tired","That you are unfriendly"],2],["Why is small talk easier than it looks?",["It follows predictable patterns","It is always about football","It uses difficult words"],0]]},
{id:"secondhand",t:"The Rise of Second-Hand Clothes",lvl:"B1+",text:"Buying second-hand clothes used to be something people did only when they had no choice. Today, it has become a trend, especially among young people. Apps that let users sell their old clothes have grown rapidly, and many shoppers say they enjoy finding unique pieces at lower prices. There is also an environmental reason: the fashion industry is one of the largest polluters in the world, and reusing clothes reduces waste. Critics point out, however, that some people now buy more than ever, simply because it is cheap. In other words, second-hand shopping only helps the planet if we actually buy less.",
 gloss:{"second-hand":"de segunda mão","used to be":"costumava ser","trend":"tendência","rapidly":"rapidamente","shoppers":"consumidores","unique":"únicas","polluters":"poluidores","reusing":"reutilizar","waste":"desperdício","Critics":"críticos","point out":"apontam"},
 q:[["Who is the trend especially popular with?",["Companies","Young people","Older people"],1],["What is the environmental argument?",["Reusing clothes reduces waste","Clothes are cheaper","The apps are free"],0],["What is the critics' concern?",["The apps are dangerous","The clothes are dirty","People buy more because it is cheap"],2]]},
{id:"sleep",t:"Sleep, the Forgotten Study Tool",lvl:"B2",text:"Students often sacrifice sleep to study more, assuming that extra hours will lead to better results. Neuroscience suggests the opposite. During deep sleep, the brain replays and consolidates what we learned during the day, transferring it from short-term to long-term memory. In one well-known experiment, participants who slept after learning a list of words remembered significantly more the next day than those who stayed awake. Language learners can take advantage of this by reviewing new vocabulary shortly before going to bed. Cutting sleep, on the other hand, undermines the very process that makes studying worthwhile.",
 gloss:{"sacrifice":"sacrificam","assuming":"supondo","deep sleep":"sono profundo","replays":"repassa","consolidates":"consolida","short-term":"curto prazo","significantly":"significativamente","stayed awake":"ficaram acordados","shortly before":"pouco antes de","undermines":"prejudica","worthwhile":"valer a pena"},
 q:[["What happens during deep sleep?",["The brain erases short-term memory","The brain consolidates what we learned","Nothing relevant to learning"],1],["What does the text suggest language learners do?",["Review new vocabulary shortly before bed","Study all night before a test","Sleep during the day"],0],["What is the effect of cutting sleep?",["It makes studying faster","It has no effect","It undermines the learning process"],2]]}

function loadLocal(){

function merge(o){
  const d = defaultState(); o = (o && typeof o==="object") ? o : {};
  const r = Object.assign(d, o);
  r.settings = Object.assign(defaultState().settings, o.settings && typeof o.settings==="object" ? o.settings : {});
  r.stats = Object.assign(defaultState().stats, o.stats && typeof o.stats==="object" ? o.stats : {});
  // tipos esperados: listas e mapas corrompidos voltam ao padrão em vez de quebrar a tela
  ["journal","dict","custom","mistakes","tests","recentListen","pairs"].forEach(k=>{ if(!Array.isArray(r[k])) r[k] = []; });
  ["cards","days","grammar","dialogs","ach","reading","gcards"].forEach(k=>{ if(!r[k] || typeof r[k]!=="object" || Array.isArray(r[k])) r[k] = {}; });
  const D = defaultState();
  ["xp","freezes","spent","listenLevel"].forEach(k=>{ if(r[k]==null) return; r[k] = Number.isFinite(+r[k]) ? +r[k] : (D[k]||0); });
  if(!r.streak || typeof r.streak!=="object") r.streak = {count:0,best:0,last:null};
  Object.keys(r.days).forEach(k=>{ const x = r.days[k]; if(!x || typeof x!=="object" || !/^\d{4}-\d{2}-\d{2}$/.test(k)){ delete r.days[k]; return; }
    ["m","n"].forEach(s=>{ if(!Array.isArray(x[s])) x[s] = [0,0,0]; }); if(!Array.isArray(x.newIds)) x.newIds = []; if(!Number.isFinite(x.xp)) x.xp = 0; });
  Object.keys(r.cards).forEach(k=>{ const c = r.cards[k]; if(!c || typeof c!=="object" || typeof c.due!=="string") delete r.cards[k]; });
  r.custom = r.custom.filter(c=>c && typeof c.w==="string" && typeof c.id==="string").map(c=>Object.assign({pt:"",ex:c.w,tag:"minha palavra"},c));
  if(!(r.listenLevel>=0 && r.listenLevel<=3)) r.listenLevel = 1;
  r.v = 2;
  return r;
}
function save(){
  checkQuests();
  checkAch();
  S.updatedAt = Date.now();
  if(S.journal.length>40) S.journal.length = 40;
  if(S.dict.length>40) S.dict = S.dict.slice(-40);
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
  if(userDoc){ clearTimeout(remoteTimer); remoteTimer = setTimeout(pushRemote, 1500); }
  updateHeader();
}
async function pushRemote(){
  if(!userDoc) return;
  if(remoteBusy){ remoteAgain = true; return; }
  remoteBusy = true;
  try{ await userDoc.set(JSON.parse(JSON.stringify(S))); syncState = "cloud"; }
  catch(e){ syncState = "local"; }
  remoteBusy = false;
  if(remoteAgain){ remoteAgain = false; pushRemote(); }
}
async function initPlatform(){
  if(!window.claude || typeof window.claude.use !== "function") return;
  claude.use("sample").then(s=>{ AI = s; if(currentTab!=="session") render(); }).catch(()=>{});
  try{
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if(!db || !user) return;
    const uid = await user.id();
    if(!uid) return;
    userDoc = db.doc("data/users/" + uid + "/progress");
    const snap = await userDoc.get();
    if(snap.exists){
      const remote = snap.data();
      if((remote.updatedAt||0) > (S.updatedAt||0)){
        S = merge(JSON.parse(JSON.stringify(remote)));
        try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
        applyPrefs();
        if(currentTab!=="session") render();
      }else if((S.updatedAt||0) > (remote.updatedAt||0)){ await pushRemote(); }
    }else if(S.updatedAt){ await pushRemote(); }
    syncState = "cloud";
    updateHeader();
    // sincronização ao vivo: aplica mudanças feitas em outro aparelho (as nossas próprias são ignoradas)
    userDoc.onSnapshot(snap=>{
      if(!snap.exists || snap.metadata.hasPendingWrites) return;
      const remote = snap.data();
      if(!remote || (remote.updatedAt||0) <= (S.updatedAt||0)) return;
      S = merge(JSON.parse(JSON.stringify(remote)));
      try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
      applyPrefs();
      if(currentTab==="session" || sub){ updateHeader(); toast("Progresso atualizado de outro aparelho"); }
      else { render(); toast("Progresso atualizado de outro aparelho"); }
    }, ()=>{ /* assinatura encerrada: segue funcionando com o salvamento normal */ });
  }catch(e){ userDoc = null; }
}

function todayQuests(){
  const t = todayKey(); let h = 0; for(const ch of t) h = (h*31 + ch.charCodeAt(0)) >>> 0;
  const pool = QUESTS.filter(q=>q.id!=="fix" || (S.mistakes||[]).length>=5);
  const out = []; let k = h;
  while(out.length<3 && out.length<pool.length){ const q = pool[k % pool.length]; if(!out.includes(q)) out.push(q); k = (k*1103515245 + 12345) >>> 0; }
  return out;
}

  if(qs.every(q=>r.qd[q.id]) && !r.qd.all){ r.qd.all = 1; bonus += 20; setTimeout(()=>toast("Baú do dia: +20 XP!"),3600); }

/* ---------- modo férias: dias pausados não quebram a sequência ---------- */
function vacations(){ return Array.isArray(S.vacations) ? S.vacations.filter(v=>v && v.from && v.to) : []; }
function onVacation(k=todayKey()){ return vacations().some(v=>v.from<=k && k<=v.to); }
function vacDaysBetween(a,b){ let n = 0; for(let d = addDays(a,1); d<b; d = addDays(d,1)) if(onVacation(d)) n++; return n; }
function missedDays(last,t){ return Math.max(0, diffDays(last,t) - 1 - vacDaysBetween(last,t)); }
function effectiveStreak(){
  const {count,last} = S.streak; if(!last) return 0;
  const miss = missedDays(last, todayKey());
  return miss<=S.freezes ? count : 0;
}
function startVacation(days){
  const from = todayKey(), to = addDays(from, days-1);
  S.vacations = vacations().filter(v=>v.to<from).concat({from,to,spread:false}).slice(-10);
  save(); toast("Modo férias até "+fmtDate(to)+". Sua sequência está protegida.");
}
function endVacation(){
  const t = todayKey();
  S.vacations = vacations().map(v=> v.from<=t && t<=v.to ? Object.assign({},v,{to:addDays(t,-1)}) : v).filter(v=>v.from<=v.to);
  spreadAfterVacation(true); save(); toast("Bem-vindo de volta! As revisões atrasadas foram distribuídas nos próximos dias.");
}
// na volta, espalha as revisões acumuladas em 5 dias em vez de despejar tudo de uma vez
function spreadAfterVacation(force){
  const t = todayKey(), v = vacations().find(x=>!x.spread && x.to<t);
  if(!v && !force) return false;
  const late = [];
  Object.entries(S.cards).forEach(([id,c])=>{ if(c.due<t) late.push(c); });
  Object.values(S.gcards||{}).forEach(c=>{ if(c.due<t) late.push(c); });
  late.sort((a,b)=>a.due<b.due?-1:1).forEach((c,i)=>{ c.due = addDays(t, i%5); });
  if(v) v.spread = true;
  return true;
}
function bumpStreak(){
  const t = todayKey(), st = S.streak;
  if(st.last===t) return;
  const miss = st.last ? missedDays(st.last,t) : null;
  if(miss===0) st.count++;
  else if(miss>0 && miss<=S.freezes){ S.freezes -= miss; st.count++; toast("Proteção de sequência usada"); }
  else st.count = 1;
  st.last = t; st.best = Math.max(st.best, st.count);
  if(st.count%7===0 && S.freezes<2){ S.freezes++; setTimeout(()=>toast("7 dias seguidos! Você ganhou 1 proteção de sequência"),2400); }
}

/* ---------- SRS: FSRS-4.5 (Free Spaced Repetition Scheduler, o algoritmo que o Anki adotou em 2023) ----------
   Modelo de memória com dois estados por cartão: estabilidade S (dias até a lembrança cair para 90%) e dificuldade D (1-10).
   Pesos padrão publicados do FSRS-4.5 (otimizados em milhões de revisões reais). Notas: 1 De novo, 2 Difícil, 3 Bom, 4 Fácil. */
const FSRS_W = [0.4872,1.4003,3.7145,13.8206,5.1618,1.2298,0.8975,0.031,1.6474,0.1367,1.0461,2.1072,0.0793,0.3246,1.587,0.2272,2.8755];
const FSRS_DECAY = -0.5, FSRS_FACTOR = 19/81;
const clampD = d=>Math.min(10, Math.max(1, d));
function fsrsR(t,S){ return Math.pow(1 + FSRS_FACTOR*t/S, FSRS_DECAY); }
function fsrsInterval(S){ const r = S0ret(); return Math.max(1, Math.min(1095, Math.round(S/FSRS_FACTOR*(Math.pow(r,1/FSRS_DECAY)-1)))); }
function S0ret(){ const r = +((S.settings && S.settings.retention) || 0.9); return Math.min(0.97, Math.max(0.8, r)); }
function fsrsD0(G){ return clampD(FSRS_W[4] - (G-3)*FSRS_W[5]); }
// converte cartões antigos (SM-2) para o modelo FSRS sem perder o histórico
function fsrsState(st){
  if(st.s!=null && st.d!=null) return {S:st.s, D:st.d, last:st.last||addDays(st.due,-(st.ivl||1))};
  if(!(st.reps>0) && !st.known) return null; // nunca revisado: primeira nota inicializa
  const ef = st.ef||2.5;
  return {S:Math.max(1, st.ivl||1), D:clampD(5 + (2.5-ef)*3.3), last:addDays(st.due, -Math.max(1, st.ivl||1))};
}
function schedule(st,q){
  const G = q+1, today = todayKey();
  let reps = st.reps||0, lapses = st.lapses||0, S1, D1;
  const cur = fsrsState(st);
  if(!cur){ S1 = FSRS_W[G-1]; D1 = fsrsD0(G); }
  else{
    const t = Math.max(0, diffDays(cur.last, today)), R = fsrsR(t, cur.S), D = cur.D;
    D1 = clampD(FSRS_W[7]*fsrsD0(3) + (1-FSRS_W[7])*(D - FSRS_W[6]*(G-3)));
    if(G===1){
      S1 = Math.min(cur.S, FSRS_W[11]*Math.pow(D,-FSRS_W[12])*(Math.pow(cur.S+1,FSRS_W[13])-1)*Math.exp(FSRS_W[14]*(1-R)));
    }else{
      const hard = G===2 ? FSRS_W[15] : 1, easy = G===4 ? FSRS_W[16] : 1;
      S1 = cur.S*(Math.exp(FSRS_W[8])*(11-D)*Math.pow(cur.S,-FSRS_W[9])*(Math.exp(FSRS_W[10]*(1-R))-1)*hard*easy + 1);
    }
  }
  S1 = Math.max(0.1, S1);
  if(G===1){ lapses++; reps = 0; } else reps++;
  const ivl = G===1 ? 1 : fsrsInterval(S1);
  return {ivl, s:+S1.toFixed(3), d:+D1.toFixed(3), reps, lapses, last:today};
}

function lev(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; } return prev[n]; }
function checkTyped(guess,target){
  const g = norm(guess).join(" "), t = norm(target).join(" ");
  if(!g) return null;
  const d = lev(g,t), tol = Math.max(1, Math.floor(t.length/6));
  if(d===0) return {v:"exact",label:"Exato!",grade:2};
  if(d<=tol) return {v:"close",label:"Quase — confira a grafia",grade:1};
  return {v:"wrong",label:"Diferente da resposta",grade:0};
}

let CORPUS = null;
function corpus(){
  if(CORPUS) return CORPUS;
  const out = new Set();
  LISTEN.forEach(x=>out.add(x[1]));
  READINGS.forEach(r=>r.text.split(/(?<=[.!?]["”]?)\s+/).forEach(x=>out.add(x.replace(/^["“]|["”]$/g,""))));
  DIALOGS.forEach(d=>d.lines.forEach(l=>{ if(l[0]==="a") out.add(l[1]); else l[2].forEach(o=>{ if(o[1]) out.add(o[0]); }); }));
  PHRASES.forEach(c=>c.p.forEach(p=>out.add(p[0])));
  VOCAB.forEach(c=>out.add(plain(c.ex)));
  CORPUS = [...out].filter(x=>x.length>12 && x.length<200);
  return CORPUS;
}
function otherContexts(c){
  const w = c.w.toLowerCase().replace(/[?…]/g,"").trim(); if(w.length<3) return [];
  const re = new RegExp("\\b"+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","i");
  const own = plain(c.ex).toLowerCase();
  return corpus().filter(x=>x.toLowerCase()!==own && re.test(x));
}
function contextLine(c,st){

function clickFirst(ids){ for(const id of ids){ const b = document.querySelector(id); if(b && !b.disabled && b.offsetParent!==null){ b.click(); return true; } } return false; }
function norm2(x){ return String(x||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
function searchAll(q){
  const n = norm2(q).trim(); if(n.length<2) return [];
  const hit = (...xs)=>xs.some(x=>norm2(x).includes(n));
  const out = [];
  allCards().forEach(c=>{ if(hit(c.w,c.pt)) out.push({k:"w",c,score:norm2(c.w).startsWith(n)?0:1}); });
  PHRASES.forEach(cat=>cat.p.forEach(([en,pt])=>{ if(hit(en,pt)) out.push({k:"p",en,pt,cat:cat.t,score:2}); }));
  GRAMMAR.forEach(l=>{ if(hit(l.t,l.intro.replace(/<[^>]+>/g," "))) out.push({k:"g",l,score:norm2(l.t).includes(n)?1:3}); });
  DIALOGS.forEach(d=>{ if(hit(d.t,d.d)) out.push({k:"d",d,score:2}); });
  READINGS.forEach(r=>{ if(hit(r.t,r.text)) out.push({k:"r",r,score:norm2(r.t).includes(n)?2:4}); });
  return out.sort((a,b)=>a.score-b.score).slice(0,30);
}

document.addEventListener("keydown",e=>{
  const tag = e.target.tagName, typing = ["INPUT","TEXTAREA","SELECT"].includes(tag);
  if(typing){ if(e.key==="Escape" && $("#srch")){ $("#srch").remove(); return; } if(e.ctrlKey && e.code==="Space"){ e.preventDefault(); clickFirst(REPLAY_IDS); } return; }
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(e.key==="?"){ e.preventDefault(); showHelp(); return; }
  if(e.key==="/"){ e.preventDefault(); showSearch(); return; }
  if(e.key==="Escape"){ if(clickFirst(BACK_IDS)) e.preventDefault(); return; }
  if($("#help")) return;
  if(keyH){ keyH(e); if(e.defaultPrevented) return; if(/^[1-4]$/.test(e.key) || e.key==="Enter" || e.code==="Space") return; }
  if(/^[1-9]$/.test(e.key)){ const opts = $$(".opt:not(:disabled)").filter(b=>b.offsetParent!==null); const b = opts[+e.key-1]; if(b){ e.preventDefault(); b.click(); } return; }
  if(e.key==="Enter" && !["BUTTON","A"].includes(tag)){ if(clickFirst(CONTINUE_IDS)) e.preventDefault(); return; }
  if(e.key==="r"||e.key==="R"){ if(clickFirst(REPLAY_IDS)) e.preventDefault(); }
});

/* ---------- arquivos: lembretes (.ics) e backup ---------- */
async function saveFile(filename, text, mime){
  if(window.claude && typeof window.claude.use==="function"){
    const dl = await claude.use("downloads").catch(()=>null);
    if(dl){ try{ await dl.save({filename, data:new Blob([text],{type:mime})}); return true; }catch(e){ if(e && e.code==="cancelled") return false; } }
  }
  try{ const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text],{type:mime})); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); return true; }
  catch(e){ toast("Não foi possível salvar o arquivo aqui"); return false; }
}
const CRLF = String.fromCharCode(13,10);
async function quickBackup(){
  const ok = await saveFile("fluencia-backup-"+todayKey()+".json", JSON.stringify(S), "application/json");
  if(ok){ S.lastBackup = todayKey(); save(); toast("Backup salvo — guarde o arquivo num lugar seguro"); }
  return ok;
}
function needsBackup(){
  const inClaude = !!(window.claude && typeof window.claude.use==="function");
  if(inClaude || syncState==="cloud") return false;
  if(Object.keys(S.cards).length<10) return false;
  return !S.lastBackup || diffDays(S.lastBackup, todayKey())>=14;
}
function icsReminders(){
  const d = addDays(todayKey(),1).replace(/-/g,""), stamp = new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
  const ev = (id,time,title,desc)=>[
    "BEGIN:VEVENT","UID:fluencia-"+id+"-"+d+"@1515","DTSTAMP:"+stamp,
    "DTSTART:"+d+"T"+time.replace(":","")+"00","DURATION:PT15M","RRULE:FREQ=DAILY",
    "SUMMARY:"+title,"DESCRIPTION:"+desc,
    "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+title,"TRIGGER:PT0M","END:VALARM","END:VEVENT"].join(CRLF);
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Fluencia 15+15//PT","CALSCALE:GREGORIAN",
    ev("m",S.settings.tm,"Inglês - Manhã (ouvir e falar)",(S.settings.planM?"Depois de "+S.settings.planM+", eu estudo. ":"")+"Revisão espaçada, ditado e fala guiada."),

    "END:VCALENDAR"].join(CRLF);
}

function chime(){
  if(!S.settings.chime) return;
  try{ navigator.vibrate && navigator.vibrate([120,80,120]); }catch(e){}
  try{ const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return; const ctx = new AC();
    [659.25, 880].forEach((f,k)=>{ const o = ctx.createOscillator(), g = ctx.createGain(); o.type = "sine"; o.frequency.value = f;
      const t0 = ctx.currentTime + k*0.22; g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.18,t0+0.03); g.gain.exponentialRampToValueAtTime(0.0001,t0+0.5);
      o.connect(g).connect(ctx.destination); o.start(t0); o.stop(t0+0.55); });
    setTimeout(()=>ctx.close(),1500); }catch(e){}
}
function startTimer(sec){
  clearInterval(timerI);
  let left = sec, paused = false; const el = $("#timer");
  el.onclick = ()=>{ paused=!paused; el.classList.toggle("paused",paused); };
  timerI = setInterval(()=>{
    if(paused || !document.body.contains(el)) return;
    left--; el.textContent = fmtTime(left);
    if(left<=0){ clearInterval(timerI); el.classList.add("over"); el.textContent="00:00"; chime(); const m=$("#tmsg"); if(m) m.textContent="Tempo! Termine o que está fazendo e conclua o bloco."; }
  },1000);
}
function completeBlock(){
  const k = session.kind, rec = dayRec(), def = SESSIONS[k]; blocksOf(rec,k);
  const wasDone = rec[k].every(Boolean);
  rec[k][session.i] = 1;
  if(rec[k].every(Boolean)){
    if(!wasDone){ bumpStreak(); S.xp+=20; rec.xp+=20; }
    save(); session.done = true; go("session"); return;
  }
  save();
  const next = rec[k].findIndex(x=>!x);
  session.i = next<0 ? Math.min(session.i+1, def.blocks.length-1) : next;
  go("session");
}

const BLOCKS = {review:blockReview, listen:blockListen, speak:blockSpeak, "new":blockNew, grammar:(el,opt)=> isMixDay() ? blockGrammarMix(el,opt) : blockGrammar(el,opt), write:blockWrite};

function blockReview(el,opt={}){
  const bonusBtn = ()=> opt.inSession && (S.mistakes||[]).length ? `<div class="note small" style="text-align:left">Bônus intercalado: revise 3 dos seus erros guardados — misturar tipos de exercício fixa mais.<br><button class="btn sm primary" id="mixB" style="margin-top:8px">Fazer bônus (3 itens)</button></div>` : "";
  const wireBonus = ()=>{ const b = $("#mixB",el); if(b) b.onclick = ()=>blockMistakes(el,{limit:3}); };
  let queue = shuffle(opt.ids || dueIds().concat(shuffle(dueGIds()).slice(0,G_DAILY))), extra = !!opt.ids, done = 0, total, cur, showing, prod, typed = null, guessTxt = "", last = null;
  if(!queue.length && !opt.ids){
    const known = Object.keys(S.cards).filter(cardById);
    if(known.length){
      el.innerHTML = `<div class="card empty"><h3>Tudo revisado por hoje</h3><p>Nenhum cartão vence hoje. Quer um treino extra com até 10 palavras que você já viu? Ele não altera os intervalos.</p><button class="btn primary" id="ex">Treino extra</button></div>`;

      el.innerHTML = `<div class="card empty"><h3>Seu baralho ainda está vazio</h3><p>As palavras entram aqui depois do bloco “Palavras novas” da sessão da noite. Quer aprender as primeiras agora?</p><button class="btn primary" id="nw">Aprender 5 palavras agora</button></div>`;
      $("#nw",el).onclick = ()=>blockNew(el,opt);
    }
    return;
  }
  total = queue.length;
  function next(){
    if(!queue.length){
      keyH = null;
      el.innerHTML = `<div class="card empty"><h3>Revisão concluída</h3><p>${done} ${done===1?"cartão revisado":"cartões revisados"}. ${opt.inSession?"Siga para o próximo bloco quando quiser.":"Volte amanhã: os intervalos já foram ajustados."}</p>${last?`<button class="btn sm ghost" id="undoEnd">↶ Desfazer a última nota</button>`:""}${bonusBtn()}</div>`;

    const grades = showing
      ? `<div class="grades">${["De novo","Difícil","Bom","Fácil"].map((l,q)=>`<button class="g${q} ${typed&&typed.grade===q?"sug":""}" data-q="${q}" ${typed&&typed.grade===q?'title="Sugestão com base no que você digitou"':""}>${l}<small>${extra?"—":ivlLabel(schedule(st,q).ivl)}</small><span class="kbd">${q+1}</span></button>`).join("")}</div>`
      : `<button class="btn primary" id="rev" style="width:100%">Mostrar resposta <span class="kbd">espaço</span></button>`;
    el.innerHTML = `<div class="stack">
      <div class="row between small muted"><span>${queue.length+1} restantes${extra?" · treino extra":""}</span><span class="row" style="gap:8px">${last?`<button class="btn sm ghost" id="undo" title="Desfazer a última nota (Z)">↶ Desfazer</button>`:""}<span class="tag">${esc(c.tag||"")}</span></span></div>

    const cai = $("#ctxAI",el); if(cai) cai.onclick = async ()=>{ cai.disabled = true; cai.textContent = "Gerando…";

    }else{
      $$("[data-q]",el).forEach(b=>b.onclick=()=>grade(+b.dataset.q));
      if(prod) speak(c.w);
    }
  }
  function drawG(){
    const it = gItem(cur); if(!it){ next(); return; }
    const [sq,o,a,e] = it.q, pct = Math.round(done/(done+queue.length+1)*100);
    el.innerHTML = `<div class="stack">

      const fin = (pre="")=>{ $("#gf",el).innerHTML = `<p class="note">${pre}${ok?"<b>Certo.</b> ":"<b>Resposta: "+esc(o[a])+".</b> "}<b>Regra: ${esc(it.L.t)}.</b> ${esc(e)}</p><button class="btn primary" id="gn" style="margin-top:10px">Continuar →</button>`; $("#gn",el).onclick = ()=>gradeG(ok); };

  }
  function gradeG(ok){
    last = null;
    const st = S.gcards[cur], n = schedule(st, ok?2:0); Object.assign(st, n, {due:addDays(todayKey(), n.ivl)});
    const r0 = dayRec(); r0.rev = (r0.rev||0)+1;
    if(!ok){ queue.push(cur); const p = cur.split(":"); addMistake({k:"g",l:p[1],q:+p[2]}); } else done++;

  }
  function reveal(){ const g=$("#guess",el); if(g && g.value.trim()){ guessTxt = g.value.trim(); typed = checkTyped(guessTxt, cardById(cur).w); } showing = true; draw(); }
  function undo(){
    if(!last) return;
    if(!extra) S.cards[last.id] = last.st;
    S.stats = last.stats; S.xp -= last.xp; dayRec().xp -= last.xp; if(!extra && dayRec().rev) dayRec().rev--;
    queue = last.queue;
    done = last.done; cur = last.id; showing = true; typed = last.typed; guessTxt = last.guessTxt; prod = last.prod;
    last = null; save(); draw(); toast("Nota desfeita");
  }
  function grade(q){
    last = {id:cur, st:JSON.parse(JSON.stringify(S.cards[cur])), queue:queue.slice(), done, xp:q===0?1:2, stats:Object.assign({},S.stats), typed, guessTxt, prod};
    if(!extra){ const r0 = dayRec(); r0.rev = (r0.rev||0)+1; const st=S.cards[cur]; const n=schedule(st,q); Object.assign(st,n,{due:addDays(todayKey(),n.ivl)}); S.stats.reviews++; if(q>0) S.stats.correct++; }
    if(q===0) queue.push(cur); else done++;
    S.xp += q===0?1:2; dayRec().xp += q===0?1:2; save();
    next();
  }
  keyH = e=>{ if(isG(cur)){ if(/^[1-4]$/.test(e.key)){ const b = $$(".opt:not(:disabled)",el)[+e.key-1]; if(b){ e.preventDefault(); b.click(); } } else if(e.key==="Enter"){ const g = $("#gn",el); if(g){ e.preventDefault(); g.click(); } } return; }
    if(e.code==="Space" && !showing){ e.preventDefault(); reveal(); } else if(showing && /^[1-4]$/.test(e.key)) grade(+e.key-1); else if((e.key==="z"||e.key==="Z") && last){ e.preventDefault(); undo(); } };
  next();
}

/* ---------- 2. Dictation + shadowing ---------- */
function norm(s){ return String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9' ]+/g," ").split(/\s+/).filter(Boolean); }
// Expande contrações dos dois lados, para "I'm" = "I am" no ditado.
function expand(tok){
  const special = {"can't":"cannot","won't":"will not","shan't":"shall not","let's":"let us","ain't":"is not"};
  if(special[tok]) return special[tok].split(" ");
  let m;
  if((m = tok.match(/^(.+)n't$/))) return [m[1],"not"];
  if((m = tok.match(/^(.+)'(ll|ve|re|d|m)$/))) return [m[1],{ll:"will",ve:"have",re:"are",d:"would",m:"am"}[m[2]]];
  if((m = tok.match(/^(it|that|he|she|what|there|here|who|where|how)'s$/))) return [m[1],"is"];
  return [tok];
}
function toks(s){ return norm(s).flatMap(expand); }
function lcsOk(t,g){
  const n=t.length,m=g.length, dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) dp[i][j] = t[i]===g[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const ok=new Array(n).fill(false); let i=0,j=0;
  while(i<n&&j<m){ if(t[i]===g[j]){ok[i]=true;i++;j++;} else if(dp[i+1][j]>=dp[i][j+1]) i++; else j++; }
  return ok;
}
function blockListen(el,opt={}){
  let item, shadows = 0, hinted = false;

/* ---------- checagem de pronúncia (reconhecimento de fala) ---------- */
function listenOnce(){
  return new Promise((resolve,reject)=>{
    const R = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!R) return reject({code:"none"});
    let r; try{ r = new R(); }catch(e){ return reject({code:"none"}); }
    r.lang = S.settings.accent; r.interimResults = false; r.maxAlternatives = 3; r.continuous = false;
    let done = false; const t = setTimeout(()=>{ try{ r.stop(); }catch(e){} }, 9000);
    r.onresult = ev=>{ done = true; clearTimeout(t); const alts = Array.from(ev.results[0]).map(a=>a.transcript); resolve(alts); };
    r.onerror = ev=>{ if(done) return; done = true; clearTimeout(t); reject({code:ev.error}); };
    r.onend = ()=>{ if(!done){ done = true; clearTimeout(t); reject({code:"no-speech"}); } };
    try{ r.start(); }catch(e){ reject({code:"x"}); }
  });
}
function pronCheckHTML(){ return (window.SpeechRecognition || window.webkitSpeechRecognition) ? `<div class="stack" style="gap:6px"><div class="row"><button class="btn" id="pron">${ICON.mic} Dizer a frase (checar pronúncia)</button></div><div id="pronOut" role="status" aria-live="polite"></div></div>` : ""; }
function wirePronCheck(el,sentence){
  const b = $("#pron",el); if(!b) return;
  b.onclick = async ()=>{
    const out = $("#pronOut",el); b.disabled = true; out.innerHTML = loadingHTML("Ouvindo… fale a frase inteira");
    try{
      const alts = await listenOnce();
      const words = sentence.split(" "), owner = [], t = [];
      words.forEach((w,wi)=>toks(w).forEach(x=>{ t.push(x); owner.push(wi); }));
      let best = null;
      alts.forEach(a=>{ const okT = lcsOk(t,toks(a)); const ok = words.map((w,wi)=>okT.every((v,k)=>owner[k]!==wi||v)); const sc = ok.filter(Boolean).length/ok.length; if(!best||sc>best.sc) best = {ok,sc,a}; });
      const pct = Math.round(best.sc*100);
      if(pct>=80) addXP(2,"pronúncia");
      out.innerHTML = `<div class="stack" style="gap:6px"><div class="row"><span class="score" style="font-size:1.5rem">${pct}%</span><span class="muted small">${pct>=90?"Muito claro!":pct>=70?"Bom — as palavras em vermelho não foram reconhecidas.":"Tente de novo mais devagar, articulando cada palavra."}</span></div>
        <div class="diff" lang="en">${words.map((w,i)=>`<span class="${best.ok[i]?"ok":"miss"}">${esc(w)}</span>`).join(" ")}</div>
        <p class="small muted">Entendido: “${esc(best.a)}”</p></div>`;
    }catch(e){
      out.innerHTML = `<p class="note warn small">${e.code==="not-allowed"||e.code==="service-not-allowed"?"O microfone está bloqueado aqui. No app do celular (link do GitHub) a checagem funciona.":e.code==="no-speech"?"Não ouvi nada. Toque de novo e fale logo depois.":"O reconhecimento de fala não está disponível agora."}</p>`;
    }
    b.disabled = false;
  };
}

/* ---------- gravador (MediaRecorder) ---------- */
let activeRec = null;
function stopRecorder(){ try{ if(activeRec && activeRec.state!=="inactive") activeRec.stop(); }catch(e){} activeRec = null; }
function recorderHTML(id,label){ return `<div class="stack" style="gap:6px"><div class="row"><button class="btn" id="${id}">${ICON.mic} ${label}</button><span class="small muted" id="${id}-st"></span></div><div id="${id}-out"></div></div>`; }
function wireRecorder(el,id,maxSec){
  const btn = $("#"+id,el), st = $("#"+id+"-st",el), out = $("#"+id+"-out",el);
  if(!btn) return;
  if(!navigator.mediaDevices || !window.MediaRecorder){ btn.disabled = true; st.textContent = "Gravação não disponível neste navegador."; return; }
  let chunks = [], stream = null, timer = null;
  btn.onclick = async ()=>{
    if(activeRec && activeRec.state==="recording"){ stopRecorder(); return; }
    try{ stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
    catch(e){ st.textContent = "Microfone bloqueado aqui. No app do celular (link do GitHub) a gravação funciona."; btn.disabled = true; return; }
    chunks = []; const r = new MediaRecorder(stream); activeRec = r;
    r.ondataavailable = e=>{ if(e.data.size) chunks.push(e.data); };
    r.onstop = ()=>{ clearTimeout(timer); stream.getTracks().forEach(t=>t.stop()); btn.classList.remove("primary"); btn.innerHTML = ICON.mic+" Gravar de novo"; st.textContent = "Ouça e compare com o original.";
      const url = URL.createObjectURL(new Blob(chunks,{type:r.mimeType||"audio/webm"})); out.innerHTML = `<audio controls src="${url}" style="width:100%"></audio>`; };
    r.start(); btn.classList.add("primary"); btn.innerHTML = "■ Parar gravação"; st.textContent = "Gravando…";
    timer = setTimeout(stopRecorder, (maxSec||120)*1000);
  };
}

/* ---------- repetição de tarefa na fala: o mesmo tema volta em 2 e 7 dias ---------- */
function speakRepFor(q){ return (S.speakRep && S.speakRep[q]) || null; }
function recordSpeak(q){
  if(!S.speakRep || typeof S.speakRep!=="object") S.speakRep = {};
  const r = S.speakRep[q] || {n:0, first:todayKey()};
  if(r.last===todayKey()) return;
  r.n++; r.last = todayKey(); r.next = r.n===1 ? addDays(todayKey(),2) : r.n===2 ? addDays(todayKey(),7) : null;
  S.speakRep[q] = r;
}
function dueSpeakIdx(pool){ const t = todayKey(); return pool.findIndex(p=>{ const r = speakRepFor(p.q); return r && r.next && r.next<=t; }); }
