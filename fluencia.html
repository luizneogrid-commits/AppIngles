        rec.onresult = ev=>{ let interim=""; for(let i=ev.resultIndex;i<ev.results.length;i++){ const r=ev.results[i]; if(r.isFinal) finalTxt += r[0].transcript+" "; else interim += r[0].transcript; } tr.textContent = finalTxt+interim; $("#said",el).value = finalTxt.trim(); };
        rec.onerror = ev=>{ tr.hidden = true; micNote(ev.error); };
        rec.onend = ()=>{ if(rec && left>0){ try{ rec.start(); }catch(e){} } };
        rec.start();
      }catch(e){ micNote("x"); }
    }else micNote("none");
  }
  function micNote(code){
    const n = $("#micnote",el); if(!n) return;
    n.innerHTML = `<p class="note warn small">${code==="none"?"Este navegador não transcreve fala.":"O microfone não está disponível aqui."} Fale em voz alta mesmo assim — o cronômetro está correndo. Se quiser feedback, digite um resumo do que disse.</p>`;
  }
  async function feedback(){
    const text = $("#said",el).value.trim();
    if(text.split(/\s+/).length<8){ toast("Escreva pelo menos uma ou duas frases do que você disse"); return; }
    const out = $("#aiout",el); out.innerHTML = loadingHTML("Analisando sua resposta…");
    try{ const r = await AI.json(correctionPrompt("speak",POOL[idx].q,text,POOL[idx].p)); out.innerHTML = feedbackHTML(r); addXP(5,"feedback"); addAIErrors(r); }
    catch(e){ out.innerHTML = `<p class="note warn">${aiErr(e)}</p>`; }
  }
  async function model(){
    const out = $("#aiout",el); out.innerHTML = loadingHTML("Escrevendo uma resposta modelo…");
    try{
      const r = await AI(`Write a natural spoken answer (${isBasic()?"about 50 words, very simple A2 English, short sentences":"about 110 words, one level above "+curLevel().en}, first person, conversational, with contractions) to this question: "${POOL[idx].q}". Use at least two of these phrases: ${POOL[idx].p.join(" | ")}. Output only the answer text.`,{modelTier:"quick"});
      out.innerHTML = `<div class="fb"><div class="row between"><span class="eyebrow">Resposta modelo — leia em voz alta e depois responda de novo com suas palavras</span>${spk(r.text)}</div><div class="corr">${esc(r.text)}</div></div>`;
    }catch(e){ out.innerHTML = `<p class="note warn">${aiErr(e)}</p>`; }
  }
  draw();
}

/* ---------- 4. New words (+ retrieval quiz) ---------- */
function blockNew(el,opt={}){
  const rec = dayRec(), backlog = dueIds().length, capped = backlog>=BACKLOG_LIMIT, quota = capped ? Math.min(2,S.settings.newPerDay) : S.settings.newPerDay;
  let batch = nextNewIds(Math.max(0, quota - rec.newIds.length)), i = 0;
  if(!batch.length){
    const all = nextNewIds(1).length===0;
    el.innerHTML = `<div class="card empty"><h3>${all?"Você já viu todas as palavras do app":"Palavras de hoje aprendidas"}</h3>
      <p>${all?"Adicione suas próprias palavras na aba Revisar — palavras que você encontra em séries, trabalho e podcasts são as que mais ficam.":`Você já aprendeu ${rec.newIds.length} palavras hoje. Amanhã de manhã elas voltam na revisão, que é o que as fixa.`}</p>
      ${all?"":`<button class="btn" id="more">Aprender mais 3</button>`}</div>`;
    const m = $("#more",el); if(m) m.onclick = ()=>{ batch = nextNewIds(3); i=0; learn(); };
    return;
  }
  const guessed = {};
  function pretest(c){
    const pool = allCards().filter(x=>x.id!==c.id && x.pt!==c.pt);
    const same = shuffle(pool.filter(x=>x.tag===c.tag)), any = shuffle(pool);
    const others = same.concat(any).filter((x,k,a)=>a.findIndex(y=>y.pt===x.pt)===k).slice(0,2);
    const opts = shuffle([c,...others]);
    el.innerHTML = `<div class="stack">
      <div class="row between small muted"><span>Palavra ${i+1} de ${batch.length} · primeiro, um palpite</span><span class="tag">${esc(c.tag||"")}</span></div>
      <div class="progressbar"><span style="width:${Math.round(i/batch.length*100)}%"></span></div>
      <div class="card flash">
        <div class="word" lang="en">${esc(c.w)} ${spk(c.w)}</div>
        <p class="ex" lang="en">${bolded(c.ex)}</p>
        <span class="small muted">Pelo contexto, o que você acha que significa? Chute à vontade — tentar antes de ver a resposta ajuda a lembrar, mesmo errando.</span>
        <div class="opts" style="width:100%">${opts.map(o=>`<button class="opt" data-g="${o.id}">${esc(o.pt)}</button>`).join("")}<button class="opt" data-g="none" style="font-weight:400">Não faço ideia</button></div>
      </div>
      <div class="row"><button class="btn" id="knw" title="Pula esta palavra e agenda uma checagem daqui a 30 dias">Já conheço</button></div></div>`;
    speak(c.ex);
    $$("[data-g]",el).forEach(b=>b.onclick=()=>{ guessed[c.id] = b.dataset.g===c.id ? "ok" : b.dataset.g==="none" ? "none" : "wrong"; S.pretest = S.pretest||{n:0,ok:0}; S.pretest.n++; if(guessed[c.id]==="ok") S.pretest.ok++; learn(); });
    $("#knw",el).onclick = ()=>{ markKnown(c.id); const nx = nextNewIds(batch.length+1).find(id=>!batch.includes(id)); if(nx) batch[i] = nx; else batch.splice(i,1); toast("Marcada como conhecida — volta para checagem em 30 dias"); learn(); };
  }
  function learn(){
    if(i>=batch.length) return quiz();
    const c = cardById(batch[i]);
    if(!guessed[c.id]) return pretest(c);
    const gmsg = guessed[c.id]==="ok" ? "Você deduziu pelo contexto — ótimo sinal." : guessed[c.id]==="wrong" ? "Não era essa, e tudo bem: o erro seguido da resposta certa fixa mais do que só ler." : "Sem problema — agora que você tentou, a resposta marca mais.";
    el.innerHTML = `<div class="stack">
      <p class="note small">${gmsg}</p>
      ${capped&&i===0?`<p class="note warn small">Você tem ${backlog} revisões acumuladas. Hoje são só ${batch.length} palavras novas, para a revisão não virar uma bola de neve. Faça a revisão da manhã e o ritmo normal volta.</p>`:""}
      <div class="row between small muted"><span>Palavra ${i+1} de ${batch.length}</span><span class="tag">${esc(c.tag||"")}</span></div>
      <div class="progressbar"><span style="width:${Math.round(i/batch.length*100)}%"></span></div>
      <div class="card flash">
        <div class="word" lang="en">${esc(c.w)} ${spk(c.w)}</div>
        <div class="pt">${esc(c.pt)}</div>
        <p class="ex" lang="en">${bolded(c.ex)} ${spk(c.ex,"Ouvir exemplo")}</p>
        <div class="back" style="align-items:stretch;text-align:left">
          <label for="own">Escreva uma frase sua com “${esc(c.w)}” — criar a própria frase fixa muito mais</label>
          <input type="text" id="own" placeholder="Ex.: ${esc(plain(c.ex))}" autocomplete="off">
        </div>
      </div>
      <div class="row"><button class="btn primary" id="nxt" style="flex:1">Aprendi — próxima →</button><button class="btn" id="knw" title="Pula esta palavra e agenda uma checagem daqui a 30 dias">Já conheço</button></div></div>`;
    speak(c.w);
    const go = ()=>{ const own = $("#own",el).value.trim(); introduce(c.id); if(own) S.cards[c.id].own = own.slice(0,200); addXP(own?4:3); i++; learn(); };
    $("#nxt",el).onclick = go;
    $("#knw",el).onclick = ()=>{ markKnown(c.id); const nx = nextNewIds(batch.length+1).find(id=>!batch.includes(id)); if(nx) batch[i] = nx; else batch.splice(i,1); toast("Marcada como conhecida — volta para checagem em 30 dias"); learn(); };
    $("#own",el).addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); go(); } });
  }
  function quiz(){
    recallQuiz(el, batch, {title:"Mini-teste", intro:"Agora sem opções: lembre e digite a palavra. Lembrar sozinho dá mais trabalho que reconhecer — e por isso fixa mais.",
      done:(right,n)=>{ el.innerHTML = `<div class="card empty"><h3>${right}/${n} lembradas</h3><p>As palavras entraram no seu baralho e voltam amanhã de manhã. ${opt.inSession?"Siga para a gramática.":""}</p></div>`; }});
  }
  learn();
}

/* ---------- recordação com pista: lembrar e digitar (mais eficaz que múltipla escolha) ---------- */
function cueHint(w){ return w.split(" ").map(x=>x.replace(/^([^A-Za-z]*[A-Za-z])([A-Za-z'’]*)/,(m,a,b)=>a+b.replace(/[A-Za-z]/g,"_"))).join(" "); }
function recallQuiz(el, ids, o={}){
  const order = shuffle(ids.filter(cardById)); let qi = 0, right = 0;
  if(!order.length){ o.done && o.done(0,0); return; }
  function q(){
    if(qi>=order.length){ o.done && o.done(right, order.length); return; }
    const c = cardById(order[qi]);
    el.innerHTML = `<div class="card pad stack">
      <div class="row between"><span class="eyebrow">${esc(o.title||"Lembre e digite")} · ${qi+1}/${order.length}</span></div>
      ${qi===0&&o.intro?`<p class="small muted">${o.intro}</p>`:""}
      <div class="prompt-pt">${esc(c.pt)}</div>
      <p class="ex" lang="en">${blanked(c.ex)}</p>
      <p class="mono muted" aria-label="Dica">${esc(cueHint(c.w))}</p>
      <div class="row" style="flex-wrap:nowrap"><input type="text" id="rq-in" placeholder="Digite em inglês" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Sua resposta"><button class="btn primary" id="rq-ok">Conferir</button></div>
      <button class="btn ghost sm" id="rq-skip" style="align-self:flex-start">Não lembro</button>
      <div id="rq-fb" role="status" aria-live="polite"></div></div>`;
    const inp = $("#rq-in",el); inp.focus();
    const check = give=>{
      const r = give ? {v:"wrong"} : checkTyped(inp.value, c.w);
      if(!give && !r){ toast("Digite sua tentativa ou toque em Não lembro"); return; }
      const ok = r.v==="exact" || r.v==="close"; if(ok){ right++; addXP(2); }
      inp.disabled = true; $("#rq-ok",el).disabled = true; $("#rq-skip",el).disabled = true;
      speak(c.w);
      $("#rq-fb",el).innerHTML = `<p class="typed ${r.v}">${r.v==="exact"?"Exato!":r.v==="close"?"Quase — confira a grafia:":give?"Resposta:":"Não era essa. Resposta:"} <b lang="en">${esc(c.w)}</b></p><p class="ex" lang="en">${bolded(c.ex)}</p><button class="btn primary" id="qn" style="margin-top:6px">Continuar →</button>`;
      $("#qn",el).onclick = ()=>{ qi++; q(); }; $("#qn",el).focus();
    };
    $("#rq-ok",el).onclick = ()=>check(false);
    $("#rq-skip",el).onclick = ()=>check(true);
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); check(false); } });
  }
  q();
}

/* ---------- 5. Grammar ---------- */
const G_STEPS = [2,7,21,60];
function lessonDue(id){ const g = S.grammar[id]; if(!g) return false; return (g.due || addDays(g.date,G_STEPS[0])) <= todayKey(); }
function pickLesson(){
  const basic = GRAMMAR.filter(isBasicItem), rest = GRAMMAR.filter(l=>!isBasicItem(l));
  const order = isBasic() ? basic.concat(rest) : rest;
  const due = order.filter(l=>lessonDue(l.id)).sort((a,b)=>(S.grammar[a.id].due||"")<(S.grammar[b.id].due||"")?-1:1)[0];
  if(due) return due;
  const undone = order.find(l=>!S.grammar[l.id]); if(undone) return undone;
  const pool = (isBasic() ? basic : rest).filter(l=>S.grammar[l.id]);
  return pool.slice().sort((a,b)=>(S.grammar[a.id].best-S.grammar[b.id].best) || (S.grammar[a.id].date<S.grammar[b.id].date?-1:1))[0];
}
function blockGrammar(el,opt={},lessonId){
  const L = lessonId ? GRAMMAR.find(l=>l.id===lessonId) : pickLesson();
  const prev = S.grammar[L.id];
  el.innerHTML = `<div class="card pad stack">
    <div class="row between"><span class="eyebrow">${prev&&lessonDue(L.id)?"Revisão programada":"Micro-aula"}${prev?` · melhor nota ${prev.best}/5`:" · nova"}</span></div>
    <h2>${esc(L.t)}</h2>
    <p class="lesson-intro">${L.intro}</p>
    <ul class="exlist">${L.ex.map(x=>`<li>${spk(x)}<span>${esc(x)}</span></li>`).join("")}</ul>
    <button class="btn primary" id="gq">Praticar — 5 questões</button>
  </div>`;
  $("#gq",el).onclick = start;
  function start(){
    let i = 0, right = 0; const qs = shuffle(L.q);
    function q(){
      if(i>=qs.length){
        const best = Math.max(prev?prev.best:0, right);
        const stage = right>=4 ? Math.min((prev&&prev.stage!=null?prev.stage+1:0), G_STEPS.length-1) : 0;
        S.grammar[L.id] = {best, last:right, date:todayKey(), stage, due:addDays(todayKey(), right>=4?G_STEPS[stage]:1)}; seedGrammarCards(L.id,false); save();
        el.innerHTML = `<div class="card empty"><h3>${right}/5 em “${esc(L.t)}”</h3><p>${right>=4?"Ótimo! Esta aula volta para revisão em "+S.grammar[L.id].due.split("-").reverse().slice(0,2).join("/")+" — cada acerto espaça mais.":"Esta aula volta amanhã para você fixar. Releia a explicação e tente usar a regra no diário."}</p><div class="row"><button class="btn" id="again">Refazer</button></div></div>`;
        $("#again",el).onclick = ()=>blockGrammar(el,opt,L.id);
        return;
      }
      const [s,o,a,e] = qs[i];
      el.innerHTML = `<div class="card pad stack">
        <div class="row between"><span class="eyebrow">${esc(L.t)}</span><span class="mono small muted">${i+1}/5</span></div>
        <div class="progressbar"><span style="width:${i*20}%"></span></div>
        <p class="qsent">${esc(s).replace("___",'<span class="gap">_____</span>')}</p>
        <div class="opts">${o.map((x,j)=>`<button class="opt" data-j="${j}">${esc(x)}</button>`).join("")}</div>
        <div id="gf" role="status" aria-live="polite"></div>
        <details class="rule" id="rule"><summary>Rever a explicação</summary><div class="stack" style="margin-top:8px"><p class="lesson-intro">${L.intro}</p><ul class="exlist">${L.ex.map(x=>`<li>${spk(x)}<span lang="en">${esc(x)}</span></li>`).join("")}</ul></div></details></div>`;
      $$(".opt:not(.conf)",el).forEach(b=>b.onclick=()=>askConf(el, b, conf=>{
        const j = +b.dataset.j, ok = j===a; recordConf(conf, ok);
        if(ok){ right++; addXP(3); } else { addMistake({k:"g",l:L.id,q:L.q.indexOf(qs[i]),hi:conf===2?1:0}); save(); }
        $$(".opt",el).forEach(x=>{ x.disabled=true; if(+x.dataset.j===a) x.classList.add("right"); });
        if(!ok) b.classList.add("wrong");
        const full = s.replace("___", o[a].replace(" / "," … "));
        const showFb = (pre="")=>{
          if(!ok){ const rl = $("#rule",el); if(rl) rl.open = true; }
          $("#gf",el).innerHTML = `<p class="note ${!ok&&conf===2?"warn":""}">${pre}${confNote(conf,ok)}${ok?"<b>Certo.</b> ":"<b>Resposta: "+esc(o[a])+".</b> "}${esc(e)}</p><div class="row" style="margin-top:10px">${o[a].includes("/")?"":spk(full,"Ouvir a frase")}<button class="btn primary" id="gn">Continuar →</button></div>`;
          $("#gn",el).onclick = ()=>{ i++; q(); };
        };
        if(ok) showFb(); else explainWhy($("#gf",el), e, L.id, showFb);
      }));
    }
    q();
  }
}

/* ---------- confiança antes do feedback (metacognição e efeito de hipercorreção) ---------- */
const CONF_LABELS = ["Chutei","Acho que sim","Tenho certeza"];
function askConf(el, picked, cb){
  $$(".opt",el).forEach(x=>x.disabled = true); picked.classList.add("picked");
  const box = document.createElement("div");
  box.className = "confbox"; box.setAttribute("role","group"); box.setAttribute("aria-label","Qual sua confiança?");
  box.innerHTML = `<span class="small muted">Antes de ver: qual sua confiança?</span><div class="row">${CONF_LABELS.map((l,k)=>`<button class="opt conf" data-c="${k}">${l}</button>`).join("")}</div>`;
  picked.closest(".opts").after(box);
  $$("[data-c]",box).forEach(b=>b.onclick=()=>{ box.remove(); cb(+b.dataset.c); });
}
function recordConf(conf, ok){
  if(!Array.isArray(S.calib) || S.calib.length!==3) S.calib = [{n:0,ok:0},{n:0,ok:0},{n:0,ok:0}];
  S.calib[conf].n++; if(ok) S.calib[conf].ok++;
}
function confNote(conf, ok){
  if(!ok && conf===2) return `<b>Erro com certeza.</b> Esses são os erros que a memória mais corrige quando você presta atenção agora (efeito de hipercorreção). Leia a explicação com calma e diga a frase certa em voz alta. `;
  if(ok && conf===0) return `<b>Acertou no chute.</b> Vale revisar a regra: acerto sem certeza ainda não é conhecimento firme. `;
  return "";
}

/* ---------- prática mista de gramática (intercalação: escolher QUAL regra usar) ---------- */
function mixLessons(){ return GRAMMAR.filter(l=>S.grammar[l.id]); }
function isMixDay(){ return mixLessons().length>=3 && dayIndex()%3===2 && !(S.mix && S.mix.date===todayKey()); }
function blockGrammarMix(el,opt={}){
  const lessons = shuffle(mixLessons());
  if(lessons.length<3){ el.innerHTML = `<div class="card empty"><h3>Faça pelo menos 3 aulas primeiro</h3><p>A prática mista embaralha questões de aulas diferentes. Ela só faz sentido depois que você conhece algumas regras.</p></div>`; return; }
  // intercala: nunca duas questões seguidas da mesma aula
  const qs = []; let k = 0;
  while(qs.length<8 && k<40){ const L = lessons[k % lessons.length]; const q = L.q[Math.floor(Math.random()*L.q.length)]; if(!qs.some(x=>x.q===q) && (!qs.length || qs[qs.length-1].L!==L)) qs.push({L,q}); k++; }
  let i = 0, right = 0;
  el.innerHTML = `<div class="card pad stack"><span class="eyebrow">Prática mista</span><h2>Qual regra se aplica?</h2>
    <p class="lesson-intro">Hoje, em vez de uma aula, questões de ${lessons.length} aulas diferentes, misturadas e sem título. Parece mais difícil — e é por isso que funciona: você treina <b>reconhecer</b> qual regra usar, como numa conversa de verdade.</p>
    <div class="row"><button class="btn primary" id="mx">Começar (8 questões)</button>${opt.inSession?`<button class="btn ghost" id="mxl">Prefiro uma aula hoje</button>`:""}</div></div>`;
  $("#mx",el).onclick = q;
  const ml = $("#mxl",el); if(ml) ml.onclick = ()=>blockGrammar(el,opt);
  function q(){
    if(i>=qs.length){ S.mix = {date:todayKey(), score:right, n:qs.length}; addXP(right*3,"prática mista");
      el.innerHTML = `<div class="card empty"><h3>${right}/${qs.length} na prática mista</h3><p>Errou mais do que nas aulas isoladas? É normal — e esperado. Estudos mostram que a prática misturada rende menos na hora, mas muito mais na prova e na vida real.</p></div>`; return; }
    const {L,q:[sq,o,a,e]} = qs[i];
    el.innerHTML = `<div class="card pad stack">
      <div class="row between"><span class="eyebrow">Prática mista · qual regra?</span><span class="mono small muted">${i+1}/${qs.length}</span></div>
      <div class="progressbar"><span style="width:${i/qs.length*100}%"></span></div>
      <p class="qsent">${esc(sq).replace("___",'<span class="gap">_____</span>')}</p>
      <div class="opts">${o.map((x,j)=>`<button class="opt" data-j="${j}">${esc(x)}</button>`).join("")}</div>
      <div id="gf" role="status" aria-live="polite"></div></div>`;
    $$(".opt:not(.conf)",el).forEach(b=>b.onclick=()=>askConf(el, b, conf=>{
      const ok = +b.dataset.j===a; recordConf(conf, ok);
      if(ok) right++; else { addMistake({k:"g",l:L.id,q:L.q.indexOf(qs[i].q),hi:conf===2?1:0}); save(); }
      $$(".opt",el).forEach(x=>{ x.disabled=true; if(+x.dataset.j===a) x.classList.add("right"); }); if(!ok) b.classList.add("wrong");
      const showFb = (pre="")=>{ $("#gf",el).innerHTML = `<p class="note ${!ok&&conf===2?"warn":""}">${pre}${confNote(conf,ok)}<b>Regra: ${esc(L.t)}.</b> ${esc(e)}</p><button class="btn primary" id="gn" style="margin-top:10px">Continuar →</button>`; $("#gn",el).onclick = ()=>{ i++; q(); }; };
      if(ok) showFb(); else explainWhy($("#gf",el), e, L.id, showFb);
    }));
  }
}

/* ---------- 6. Writing journal ---------- */

  let ids = rec.newIds.length ? rec.newIds.slice() : Object.entries(S.cards).sort((a,b)=>(b[1].added||"")>(a[1].added||"")?1:-1).map(x=>x[0]);
  const targets = ids.map(cardById).filter(Boolean).slice(0,5).map(c=>c.w);
  let lastFb = null;
  el.innerHTML = `<div class="card pad stack">
    <span class="eyebrow">Diário · ${fmtDate(todayKey())}</span>
    <h3 class="prompt" lang="en">${esc(prompt)}</h3>

    <textarea id="jr" rows="8" placeholder="Start writing… Pense em inglês simples em vez de traduzir frases longas do português.">${esc(S.draft||"")}</textarea>
    <div class="row between"><span class="small muted" id="wc">0 palavras · meta ${goal}</span><span class="small muted">Rascunho salvo automaticamente</span></div>
    <div class="row">${AI?`<button class="btn primary" id="ai">Corrigir com IA</button>`:""}<button class="btn ${AI?"":"primary"}" id="sv">Salvar no diário</button></div>
    ${AI?"":`<div class="checks"><span class="eyebrow">Autorrevisão</span>
      <label><input type="checkbox"> Conferi os tempos verbais (passado × present perfect)</label>

    <div id="aiout" role="status" aria-live="polite"></div>

  const ta = $("#jr",el);

    const text = ta.value.trim(); if(text.split(/\s+/).length<minSave){ toast("Escreva um pouco mais antes de salvar ("+minSave+"+ palavras)"); return; }

function markTarget(ex,w){ if(ex.includes("*")) return ex; const i = ex.toLowerCase().indexOf(w.toLowerCase()); return i>=0 ? ex.slice(0,i)+"*"+ex.slice(i,i+w.length)+"*"+ex.slice(i+w.length) : ex; }
function parseWordList(txt){
  const out = [];
  txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach(l=>{
    const parts = l.split(/\t|\s*;\s*|\s+[-–—=:]\s+/).map(x=>x.trim()).filter(Boolean);
    if(parts.length<2) return;
    out.push({w:parts[0].slice(0,80), pt:parts[1].slice(0,120), ex:(parts[2]||"").slice(0,240)});
  });
  return out;
}
async function aiExamples(words){
  const r = await AI.json(`For each English word or expression below, write ONE natural example sentence (${isBasic()?"very simple, A1-A2 level":"B1-B2 level"}) and wrap the target expression in asterisks, like "We need to *figure out* the problem." Return ONLY JSON: {"items":[{"w":"the word exactly as given","ex":"sentence with *target*"}]}
Words:
${words.map(w=>"- "+w).join("\n")}`,{modelTier:"quick"});
  const map = {}; (r && Array.isArray(r.items) ? r.items : []).forEach(it=>{ if(it && it.w && it.ex) map[String(it.w).toLowerCase()] = String(it.ex).slice(0,240); });
  return map;
}
function ankiExport(onlyStudied){
  const clean = x=>String(x||"").replace(/[\t\r\n]+/g," ").trim();
  const list = allCards().filter(c=>!onlyStudied || S.cards[c.id]);
  const lines = ["#separator:tab","#html:true","#tags column:4"].concat(list.map(c=>{
    const st = S.cards[c.id];
    const back = esc(clean(c.pt)) + "<br><br><i>" + esc(clean(c.ex)).replace(/\*(.+?)\*/g,"<b>$1</b>") + "</i>" + (st && st.own ? "<br><br>Minha frase: " + esc(clean(st.own)) : "");
    return [esc(clean(c.w)), back, esc(clean(c.ex).replace(/\*/g,"")), "fluencia15 " + clean(c.tag||"").replace(/\s+/g,"_")].join("\t");
  }));
  return {txt: lines.join("\n"), n: list.length};
}

  return `<div class="wdet stack" id="wdet" data-id="${c.id}">

      <p class="small muted">Revisões: ${st.reps||0} · esquecida ${st.lapses||0}× · intervalo ${st.ivl||0} dias${st.known?" · marcada como conhecida":""}</p>`:""}

function wireWordDetail(box, redraw){

  const kn = $("#wknown",box); if(kn) kn.onclick = ()=>{ markKnown(id); toast("Marcada como conhecida"); redraw(); };
  const dl = $("#wdel",box); if(dl) dl.onclick = ()=>{ $("#wcfm",box).innerHTML = `<div class="confirm"><span>Excluir esta palavra e o histórico dela?</span><button class="btn sm" id="wy" style="color:var(--bad)">Excluir</button><button class="btn sm ghost" id="wn">Cancelar</button></div>`;
    $("#wy",box).onclick = ()=>{ S.custom = S.custom.filter(c=>c.id!==id); delete S.cards[id]; save(); toast("Palavra excluída"); redraw(); }; $("#wn",box).onclick = ()=>$("#wcfm",box).innerHTML=""; };
}

function blockChat(el){

    $("#ci",el).focus();

  async function send(){
    const inp = $("#ci",el), text = inp.value.trim(); if(!text || busy) return;

I am the learner: a Brazilian whose English level is ${curLevel().en}. Rules for every reply:${isBasic()?"\n- Use very simple English: short sentences, common words, present tense when possible.":""}
- Stay in character. Reply in 1 to 3 short, natural sentences, slightly above my level, and end with a question or prompt that keeps me talking.
- If my last message had a grammar or word-choice mistake, add ONE final line that starts with "Correction:" showing my sentence corrected and a very short reason in Portuguese. If there was no real mistake, don't add that line.
Start now in character.`},{role:"assistant",content:role.o}];
    msgs.slice(1).forEach(m=>{ if(m.r==="me") turns.push({role:"user",content:m.t}); else turns.push({role:"assistant",content:m.raw||m.t}); });
    const ai = {r:"ai",t:"…"}; msgs.push(ai); chat();

    try{
      const r = await AI(turns,{modelTier:"quick",cache:false,signal:ctrl.signal,onText:({text})=>{ const last=ch.lastElementChild; if(last){ last.textContent = text.split(/\n?Correction:/)[0]; ch.scrollTop = ch.scrollHeight; } }});

function blockDialogs(el,startId){
  function list(){

      <p class="muted">Situações reais com roteiro. O outro personagem fala — <b>ouça antes de ler</b>. Na sua vez, escolha a resposta mais natural (as erradas são erros típicos de brasileiros) e repita em voz alta. Funciona sem internet e sem IA.</p>

          out.innerHTML = `<p class="note small">Você disse: “<span lang="en">${esc(best.a)}</span>” — ${pct>=70?"muito parecido com a resposta natural!":pct>=40?"parte das palavras bate. Compare com as opções.":"bem diferente do esperado. Veja as opções e repita a certa."} <span class="mono">(${pct}%)</span></p>`;

        }catch(e){ out.innerHTML = `<p class="note warn small">${e.code==="not-allowed"||e.code==="service-not-allowed"?"Microfone bloqueado aqui — no app do celular funciona.":"Não ouvi. Tente de novo ou toque em “Já falei”."}</p>`; ds.disabled = false; }

function buildTest(){
  const qs = [], pick = a=>a[Math.floor(Math.random()*a.length)];
  const gB = GRAMMAR.filter(isBasicItem), gI = GRAMMAR.filter(l=>!isBasicItem(l));
  shuffle(gB).slice(0,2).concat(shuffle(gI).slice(0,4)).forEach(L=>{ const q = pick(L.q); qs.push({k:"g",w:isBasicItem(L)?1:2,prompt:esc(q[0]).replace("___",'<span class="gap">_____</span>'),opts:q[1].map((o,j)=>({t:o,ok:j===q[2]}))}); });
  const vB = VOCAB.filter(isBasicItem), vI = VOCAB.filter(c=>!isBasicItem(c));
  shuffle(vB).slice(0,2).concat(shuffle(vI).slice(0,3)).forEach(c=>{ const pool = isBasicItem(c)?vB:vI; const others = shuffle(pool.filter(x=>x.id!==c.id)).slice(0,3);
    qs.push({k:"v",w:isBasicItem(c)?1:1.5,prompt:"O que significa <b>"+esc(c.w)+"</b>?",opts:shuffle([c,...others]).map(x=>({t:x.pt,ok:x.id===c.id}))}); });
  [0,1,2,3].forEach(l=>{ const pool = LISTEN.filter(x=>x[0]===l); const it = pick(pool); const others = shuffle(pool.filter(x=>x!==it)).slice(0,2);
    qs.push({k:"l",w:[1,1.5,2,2.5][l],say:it[1],prompt:"Qual frase você ouviu?",opts:shuffle([it,...others]).map(x=>({t:x[1],ok:x===it}))}); });
  return qs;
}

function blockBuild(el){

      const [w,o,a,note] = qs[i];

        <div class="opts" style="width:100%;grid-template-columns:repeat(${o.length},1fr)">${o.map((x,j)=>`<button class="opt" style="text-align:center" data-j="${j}">${esc(x)}</button>`).join("")}</div>

function blockQuick(el){
  const pool = shuffle(isBasic() ? QUICK_A : QUICK_B).slice(0,6), SEC = isBasic() ? 25 : 20;
  let i = -1, t = null;
  el.innerHTML = `<div class="card pad stack"><h2>Pergunta rápida</h2><p class="muted">6 perguntas em áudio, ${SEC} segundos para cada uma. Responda em voz alta com 2 ou 3 frases. Não pare para traduzir: se faltar uma palavra, contorne (“it's like a…”, “the thing you use to…”).</p><button class="btn primary" id="qs">Começar</button></div>`;
  $("#qs",el).onclick = next;
  function next(){
    clearInterval(t); i++;
    if(i>=pool.length){ addXP(10,"fluência"); el.innerHTML = `<div class="card empty"><h3>6 respostas sem travar</h3><p>Repita amanhã — a mesma pergunta respondida de novo sai mais rápida e mais rica. É assim que a fala vira automática.</p><button class="btn primary" id="qa">Mais 6 perguntas</button></div>`; $("#qa",el).onclick=()=>blockQuick(el); return; }
    let left = SEC; const q = pool[i];
    el.innerHTML = `<div class="card pad stack" style="align-items:center;text-align:center">
      <span class="eyebrow">Pergunta ${i+1}/${pool.length}</span>
      <p class="prompt" lang="en" style="font-family:var(--display);font-weight:700">${esc(q)}</p>
      <div class="ring" style="--p:100"><span class="mono bigtime" id="qt">${left}</span></div>
      <div class="row"><button class="btn" id="qr">${ICON.speaker} Repetir</button><button class="btn primary" id="qnx">Próxima →</button></div></div>`;
    speak(q);
    $("#qr",el).onclick = ()=>speak(q);
    $("#qnx",el).onclick = next;
    t = setInterval(()=>{ const el2 = $("#qt",el); if(!el2){ clearInterval(t); return; } left--; el2.textContent = Math.max(0,left); el2.parentElement.style.setProperty("--p", Math.max(0,left/SEC*100)); if(left<=0){ clearInterval(t); setTimeout(next,600); } },1000);
  }
}

  const dRecent = S.dict.slice(-20), dAvg = dRecent.length? dRecent.reduce((a,x)=>a+x.s,0)/dRecent.length/100 : 0;
  const listenP = Math.min(1, ((S.listenLevel-1)/2)*0.6 + dAvg*0.4);
  const wordsP = (counts.lrn+counts.young+counts.mat)/total*0.5 + counts.mat/total*0.5;

      <p class="small ${voiceStatus().ok?"muted":""}" ${voiceStatus().ok?"":'style="color:var(--bad)"'}>${esc(voiceStatus().msg)}${voiceStatus().ok?"":"<br>"+VOICE_HELP}</p>
      <p class="small muted">No computador, pressione <span class="kbd">?</span> para ver os atalhos de teclado.</p>
      <div class="row"><button class="btn sm" id="tv">${ICON.speaker} Testar voz</button><span class="small muted"><span class="dot ${syncState==="cloud"?"ok":""}"></span> ${syncState==="cloud"?"Progresso salvo na sua conta — abre igual em outros dispositivos.":"Progresso salvo neste navegador."}</span></div>
      <hr class="sep">
      <h3>Modo férias</h3>
      <p class="small muted">Vai viajar ou ter uma semana impossível? Pause: a sequência fica protegida e, na volta, as revisões acumuladas são distribuídas em 5 dias.</p>
      <div class="row">${onVacation()?`<span class="small"><b>Ativo</b> até ${fmtDate(vacations().find(v=>v.from<=todayKey()&&todayKey()<=v.to).to)}</span><button class="btn sm" id="vacStop">Voltar das férias</button>`:[3,7,14,21].map(n=>`<button class="btn sm" data-vac="${n}">Pausar ${n} dias</button>`).join("")}</div>
      <hr class="sep">
      <h3>Seu plano de estudo</h3>
      <p class="small muted">Ancore o estudo em algo que você já faz todo dia. Planos “depois de X, eu faço Y” (intenções de implementação) aumentam muito a chance de cumprir.</p>
      <div class="grid2">${planHTML("m")}${planHTML("n")}</div>
      <h3>Lembretes</h3>
      <p class="small muted">Escolha os horários e adicione dois lembretes diários ao seu calendário (Google, iPhone, Outlook). Abra o arquivo baixado e confirme. Ter um horário fixo é o que mais sustenta o hábito.</p>
      <div class="row"><label for="s-tm" style="display:flex;gap:8px;align-items:center">Manhã <input type="time" id="s-tm" value="${S.settings.tm}" style="width:auto"></label><label for="s-tn" style="display:flex;gap:8px;align-items:center">Noite <input type="time" id="s-tn" value="${S.settings.tn}" style="width:auto"></label></div>
      <div class="row"><button class="btn sm" id="ics">Adicionar lembretes ao calendário (.ics)</button></div>
      <hr class="sep">
      <h3>Backup</h3>
      <p class="small muted">Copie o código para guardar ou levar seu progresso para outro navegador. Para restaurar, cole e importe.</p>
      <textarea id="bk" rows="3" spellcheck="false" placeholder="Cole aqui um backup para importar"></textarea>
      <div class="row"><button class="btn sm" id="ex">Gerar e copiar backup</button><button class="btn sm" id="im">Importar backup</button><button class="btn sm" id="exf">Salvar backup em arquivo</button><label class="btn sm" for="imf" style="cursor:pointer">Abrir arquivo de backup<input type="file" id="imf" accept=".json,application/json" hidden></label><button class="btn sm ghost" id="rs" style="color:var(--bad)">Apagar todo o progresso</button></div>
      <div id="cfm"></div>
    </div>
  </div>`;
  $("#lt").onclick = ()=>go("practice","test");
  $("#buyF").onclick = ()=>{ if(buyFreeze()) renderProgress(); };
  const wks = weaknesses(); $$("[data-wk]").forEach(b=>b.onclick=()=>{ const g = wks[+b.dataset.wk].go; go(g[0],g[1]); });
  $("#share").onclick = shareProgress;
  $("#s-lvl").onchange = e=>{ const L = LEVELS.find(l=>l.id===e.target.value); S.settings.level = L.id; S.listenLevel = L.listen; save(); toast("Nível: "+L.t+". Palavras, aulas, ditado, fala e escrita foram ajustados."); renderProgress(); };
  $("#s-acc").onchange = e=>{ S.settings.accent=e.target.value; S.settings.voice=""; save(); renderProgress(); };
  $("#s-voice").onchange = e=>{ S.settings.voice=e.target.value; save(); };
  $("#s-rate").oninput = e=>{ S.settings.rate=+e.target.value; $("#rv").textContent=S.settings.rate.toFixed(2)+"×"; };
  $("#s-rate").onchange = ()=>save();
  $("#s-chime").onchange = e=>{ S.settings.chime = e.target.value==="1"; save(); if(S.settings.chime) chime(); };
  $("#s-wg").onchange = e=>{ S.settings.weekGoal = +e.target.value; save(); };
  $("#s-ret").onchange = e=>{ S.settings.retention = +e.target.value; save(); toast("Retenção desejada: "+Math.round(S.settings.retention*100)+"%. Vale para as próximas revisões."); };
  $("#s-min").onchange = e=>{ S.settings.sessMin = +e.target.value; save(); toast("Sessões de "+S.settings.sessMin+" minutos"); };
  $("#s-new").onchange = e=>{ S.settings.newPerDay=+e.target.value; save(); };
  $("#s-theme").onchange = e=>{ S.settings.theme=e.target.value; save(); applyPrefs(); };
  $("#s-big").onchange = e=>{ S.settings.big=e.target.value==="1"; save(); applyPrefs(); };
  $("#tv").onclick = ()=>speak("Consistency beats intensity. Fifteen minutes in the morning and fifteen at night.",undefined,true);
  $("#ex").onclick = ()=>{ const ta=$("#bk"); ta.value = JSON.stringify(S); ta.select(); S.lastBackup = todayKey(); save();
    if(navigator.clipboard) navigator.clipboard.writeText(ta.value).then(()=>toast("Backup copiado"),()=>toast("Selecionado — copie com Ctrl+C")); else toast("Selecionado — copie com Ctrl+C"); };
  wirePlans(view);
  $$("[data-vac]").forEach(b=>b.onclick=()=>{ startVacation(+b.dataset.vac); renderProgress(); });
  const vs2 = $("#vacStop"); if(vs2) vs2.onclick = ()=>{ endVacation(); renderProgress(); };
  $("#s-tm").onchange = e=>{ if(e.target.value){ S.settings.tm=e.target.value; save(); } };
  $("#s-tn").onchange = e=>{ if(e.target.value){ S.settings.tn=e.target.value; save(); } };
  $("#ics").onclick = async ()=>{ if(await saveFile("lembretes-ingles-15-15.ics", icsReminders(), "text/calendar")) toast("Abra o arquivo para adicionar ao calendário"); };
  $("#exf").onclick = quickBackup;
  $("#imf").onchange = e=>{ const f = e.target.files[0]; if(!f) return; const rd = new FileReader(); rd.onload = ()=>{ $("#bk").value = rd.result; $("#im").click(); }; rd.readAsText(f); };
  $("#im").onclick = ()=>{ let o; try{ o = JSON.parse($("#bk").value); if(!o || typeof o!=="object" || !o.cards) throw 0; }catch(e){ toast("Esse texto não é um backup válido"); return; }
    confirmBox("Substituir o progresso atual por este backup?","Importar",()=>{ S = merge(o); save(); toast("Backup importado"); renderProgress(); }); };
  $("#rs").onclick = ()=>confirmBox("Apagar XP, sequência, palavras e diário? Isso não pode ser desfeito.","Apagar tudo",()=>{ const keep=S.settings; S = defaultState(); S.settings=keep; save(); toast("Progresso apagado"); renderProgress(); });
}
/* ---------- imagem para compartilhar ---------- */
async function progressImage(){
  try{ await document.fonts.ready; }catch(e){}
  const W = 1080, c = document.createElement("canvas"); c.width = W; c.height = W;
  const g = c.getContext("2d");
  g.fillStyle = "#131C33"; g.fillRect(0,0,W,W);
  g.fillStyle = "#C9701C"; g.fillRect(0,0,W/2,14); g.fillStyle = "#4A4EC2"; g.fillRect(W/2,0,W/2,14);
  const disp = '"Bricolage Grotesque", "Segoe UI", sans-serif', body = '"Atkinson Hyperlegible", "Segoe UI", sans-serif';
  g.textBaseline = "alphabetic";
  g.font = "800 64px "+disp; g.fillStyle = "#C9701C"; g.fillText("15", 80, 150); const w15 = g.measureText("15").width;
  g.fillStyle = "#FFFFFF"; g.fillText("+", 80+w15, 150); const wp = g.measureText("+").width;
  g.fillStyle = "#9A9EF7"; g.fillText("15", 80+w15+wp, 150);
  g.font = "400 34px "+body; g.fillStyle = "#9BA4BC"; g.fillText("Meu inglês, 15 minutos de manhã e 15 à noite", 80, 205);
  const streak = effectiveStreak();
  g.font = "800 300px "+disp; g.fillStyle = "#F2A45A"; g.fillText(String(streak), 70, 520);
  const sw = g.measureText(String(streak)).width;
  g.font = "700 56px "+disp; g.fillStyle = "#FFFFFF"; g.fillText(streak===1?"dia seguido":"dias seguidos", 90+sw, 505);
  const words = Object.keys(S.cards).length, mature = Object.values(S.cards).filter(x=>x.ivl>=21).length;
  const stats = [[curLevel().t,"nível atual"],[String(words),"palavras em estudo"],[String(mature),"palavras maduras"],[S.xp.toLocaleString("pt-BR"),"XP"]];
  stats.forEach(([v,l],k)=>{ const x = 80 + (k%2)*470, y = 660 + Math.floor(k/2)*170;
    g.font = "700 "+(k===0?46:64)+"px "+disp; g.fillStyle = "#FFFFFF"; g.fillText(v, x, y);
    g.font = "400 30px "+body; g.fillStyle = "#9BA4BC"; g.fillText(l, x, y+46); });
  g.font = "400 28px "+body; g.fillStyle = "#6F7894"; g.fillText(new Date().toLocaleDateString("pt-BR",{day:"numeric",month:"long",year:"numeric"}), 80, 1010);
  return new Promise(res=>c.toBlob(res,"image/png"));
}
async function shareProgress(){
  const blob = await progressImage(); if(!blob){ toast("Não foi possível gerar a imagem"); return; }
  const file = new File([blob],"meu-progresso-ingles.png",{type:"image/png"});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], text:"Estou estudando inglês 15 min de manhã e 15 à noite! "+effectiveStreak()+" dias seguidos."}); return; }catch(e){ if(e && e.name==="AbortError") return; }
  }
  if(await saveFile("meu-progresso-ingles.png", blob, "image/png")) toast("Imagem salva");
}
/* ---------- análise de pontos fracos ---------- */
function weaknesses(){
  const out = [];
  // vocabulário por categoria
  const byTag = {};
  Object.entries(S.cards).forEach(([id,st])=>{ const c = cardById(id); if(!c || st.known) return; const t = c.tag||"outras"; (byTag[t] ||= {n:0,l:0}); byTag[t].n++; byTag[t].l += st.lapses||0; });
  const tags = Object.entries(byTag).filter(([,v])=>v.n>=3 && v.l>0).map(([t,v])=>({t,rate:v.l/v.n,...v})).sort((a,b)=>b.rate-a.rate);
  if(tags.length) out.push({icon:"book",t:"Vocabulário: "+tags[0].t,d:"É a categoria que você mais esquece ("+tags[0].l+" esquecimentos em "+tags[0].n+" palavras). Crie frases pessoais para essas palavras na lista.",go:hardIds().length?["review","hard"]:["review",null],btn:hardIds().length?"Treinar difíceis":"Ver palavras"});
  // gramática fraca
  const weakG = GRAMMAR.filter(l=>S.grammar[l.id] && S.grammar[l.id].last<=3).sort((a,b)=>S.grammar[a.id].last-S.grammar[b.id].last);
  if(weakG.length) out.push({icon:"pen",t:"Gramática: "+weakG[0].t,d:"Sua última nota foi "+S.grammar[weakG[0].id].last+"/5."+(weakG.length>1?" Outras aulas com nota baixa: "+weakG.slice(1,3).map(l=>l.t).join("; ")+".":""),go:["practice","g:"+weakG[0].id],btn:"Refazer aula"});
  // ditado
  const d = S.dict.slice(-10); const avg = d.length ? d.reduce((a,x)=>a+x.s,0)/d.length : null;
  if(avg!=null && avg<70) out.push({icon:"ear",t:"Compreensão oral",d:"Média de "+Math.round(avg)+"% nos últimos ditados. Use “Ouvir devagar” e o toque nas palavras vermelhas, e faça o jogo Ouça e entenda.",go:["practice","ear"],btn:"Ouça e entenda"});
  // deck de erros
  const m = (S.mistakes||[]).length;
  if(m>=5) out.push({icon:"chat",t:m+" erros guardados",d:"Revisar os próprios erros é o treino que mais rende. Acerte cada um 2 vezes seguidas para tirá-lo do deck.",go:["practice","mistakes"],btn:"Meus erros"});
  // fala/escrita pouco praticadas
  const last14 = Array.from({length:14},(_,k)=>S.days[addDays(todayKey(),-k)]).filter(Boolean);
  if(last14.length>=5 && !S.journal.some(j=>diffDays(j.d,todayKey())<=7)) out.push({icon:"pen",t:"Escrita parada",d:"Você não salvou nada no diário nesta semana. Escrever é onde a gramática vira hábito.",go:["practice","write"],btn:"Escrever agora"});
  return out.slice(0,4);
}
function calibrationCard(){
  const c = Array.isArray(S.calib) ? S.calib : null, total = c ? c.reduce((a,x)=>a+x.n,0) : 0;
  if(total<6) return `<div class="card pad stack"><h3>Sua calibração</h3><p class="small muted">Nos exercícios de gramática, o app pergunta sua confiança antes de mostrar a resposta. Depois de algumas questões, aparece aqui o quanto você acerta quando “tem certeza” — saber o que você sabe de verdade orienta onde revisar.</p></div>`;
  const rows = c.map((x,k)=>({l:CONF_LABELS[k], n:x.n, p:x.n?Math.round(x.ok/x.n*100):null}));
  const sure = rows[2], guess = rows[0];
  let msg = "Sua confiança acompanha bem seus acertos. Continue assim.";
  if(sure.n>=3 && sure.p<80) msg = "Quando tem certeza, você ainda erra bastante: são justamente esses erros que o deck Meus erros prioriza. Leia as explicações com calma antes de responder.";
  else if(guess.n>=3 && guess.p>=60) msg = "Você sabe mais do que imagina: seus chutes acertam muito. Confie mais na intuição ao falar.";
  const pre = S.pretest && S.pretest.n ? `<p class="small muted">Palpites nas palavras novas: ${Math.round(S.pretest.ok/S.pretest.n*100)}% certos pelo contexto (${S.pretest.n} palpites).</p>` : "";
  return `<div class="card pad stack"><h3>Sua calibração</h3>
    <div class="kv">${rows.map(r=>`<span>${r.l} <span class="small muted">(${r.n})</span></span><span class="mono small">${r.p==null?"—":r.p+"% de acerto"}</span><div class="bar"><span style="width:${r.p||0}%"></span></div>`).join("")}</div>
    <p class="small">${msg}</p>${pre}</div>`;
}
function xpChart(){
  const N = 30, t = todayKey(), days = Array.from({length:N},(_,k)=>addDays(t,k-(N-1)));
  const vals = days.map(d=>Math.max(0,(S.days[d]&&S.days[d].xp)||0));
  const active = vals.filter(v=>v>0), avg = active.length ? active.reduce((a,b)=>a+b,0)/active.length : 0;
  const mx = Math.max(50, Math.ceil(Math.max(...vals)/50)*50), W = 600, H = 150, L = 34, B = 22, T = 8, bw = (W-L-4)/N;
  const y = v=>T + (H-T-B)*(1 - v/mx);
  const ticks = [0, Math.round(mx/2), mx];
  const bars = vals.map((v,k)=>{ const x = L + k*bw + 1.5, h = (H-T-B)*v/mx; return `<rect x="${x.toFixed(1)}" y="${(H-B-h).toFixed(1)}" width="${(bw-3).toFixed(1)}" height="${Math.max(h, v?2:0).toFixed(1)}" rx="2" fill="${k===N-1?"var(--acc)":"color-mix(in srgb,var(--acc) 55%,var(--surface2))"}"><title>${fmtDate(days[k])}: ${v} XP</title></rect>`; }).join("");
  const labels = [0,10,20,29].map(k=>`<text x="${(L+k*bw+bw/2).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--muted)">${k===29?"hoje":fmtDate(days[k])}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" class="xpc" role="img" aria-label="XP por dia nos últimos 30 dias; média de ${Math.round(avg)} XP nos dias estudados">
    ${ticks.map(v=>`<line x1="${L}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text>`).join("")}
    ${bars}
    ${avg?`<line x1="${L}" x2="${W-4}" y1="${y(avg)}" y2="${y(avg)}" stroke="var(--ink)" stroke-dasharray="4 4" stroke-width="1.2" opacity=".6"/>`:""}
    ${labels}</svg>
    <div class="row between small muted"><span>${active.length} de 30 dias com estudo</span><span>linha tracejada = média de ${Math.round(avg)} XP nos dias estudados</span></div>`;
}
function confirmBox(msg,label,fn){
  const c = $("#cfm"); c.innerHTML = `<div class="confirm"><span>${esc(msg)}</span><button class="btn sm" id="cy" style="color:var(--bad)">${esc(label)}</button><button class="btn sm ghost" id="cn">Cancelar</button></div>`;
  $("#cy").onclick = ()=>{ c.innerHTML=""; fn(); }; $("#cn").onclick = ()=>c.innerHTML="";
}

function applyPrefs(){
  const root = document.documentElement;
  if(S.settings.theme==="light"||S.settings.theme==="dark") root.dataset.theme = S.settings.theme;
  else if(root.dataset.themeByApp) delete root.dataset.theme;
  if(S.settings.theme!=="auto") root.dataset.themeByApp = "1"; else delete root.dataset.themeByApp;
  document.body.classList.toggle("big", !!S.settings.big);
  const m = document.querySelector('meta[name="theme-color"]'); if(m) m.content = getComputedStyle(document.body).backgroundColor;
}

   BOOT
   ============================================================ */
loadLocal();
if(spreadAfterVacation(false)) save();
applyPrefs();
go("today");
setTimeout(maybeShowNews, 600);
initPlatform();
