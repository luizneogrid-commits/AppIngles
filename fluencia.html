  const total = ids.length;
  const gAvg = GRAMMAR.reduce((a,l)=>a+(S.grammar[l.id]?S.grammar[l.id].best/5:0),0)/GRAMMAR.length;
  const dRecent = S.dict.slice(-20), dAvg = dRecent.length? dRecent.reduce((a,x)=>a+x.s,0)/dRecent.length/100 : 0;
  const listenP = Math.min(1, ((S.listenLevel-1)/2)*0.6 + dAvg*0.4);
  const wordsP = (counts.lrn+counts.young+counts.mat)/total*0.5 + counts.mat/total*0.5;
  const writeP = Math.min(1, S.journal.length/30);
  const path = Math.round((wordsP*0.4 + gAvg*0.3 + listenP*0.15 + writeP*0.15)*100);
  // heatmap: 12 weeks ending this week
  const t = todayKey(), tDate = keyToDate(t), start = addDays(t, -(7*11 + tDate.getDay()));
  let cells = "";
  for(let i=0;i<84;i++){ const k = addDays(start,i); if(k>t){ cells += `<i style="visibility:hidden"></i>`; continue; }
    const r = S.days[k], n = r ? (r.m.every(Boolean)?1:0)+(r.n.every(Boolean)?1:0) : 0;
    cells += `<i class="${n?"h"+n:""} ${k===t?"today":""}" title="${fmtDate(k)}: ${n} ${n===1?"sessão":"sessões"}"></i>`; }
  const acc = S.stats.reviews ? Math.round(S.stats.correct/S.stats.reviews*100) : 0;
  const spark = ()=>{
    if(dRecent.length<2) return `<p class="muted small">Faça alguns ditados para ver sua curva de acerto.</p>`;
    const W=300,H=70,P=6, xs=i=>P+i*(W-2*P)/(dRecent.length-1), ys=v=>H-P-(v/100)*(H-2*P);
    const pts = dRecent.map((x,i)=>xs(i).toFixed(1)+","+ys(x.s).toFixed(1)).join(" ");
    const lx = xs(dRecent.length-1), ly = ys(dRecent[dRecent.length-1].s);
    return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Acerto nos últimos ${dRecent.length} ditados">
      <line x1="${P}" x2="${W-P}" y1="${ys(50)}" y2="${ys(50)}" stroke="var(--line)" stroke-dasharray="3 4"/>
      <polygon points="${P},${H-P} ${pts} ${lx},${H-P}" fill="var(--acc-soft)"/>
      <polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
      <circle cx="${lx}" cy="${ly}" r="4" fill="var(--acc)"/></svg>
      <div class="row between small muted"><span>últimos ${dRecent.length} ditados · linha tracejada = 50%</span><span class="mono">média ${Math.round(dAvg*100)}%</span></div>`;
  };
  const voiceOpts = voices.map(v=>`<option value="${esc(v.name)}" ${S.settings.voice===v.name?"selected":""}>${esc(v.name)} (${esc(v.lang)})</option>`).join("");
  view.innerHTML = `<section class="hello"><span class="eyebrow">Seu progresso</span><h1>Nível ${level}</h1>
    <div class="progressbar" style="max-width:420px"><span style="width:${into/LV*100}%"></span></div>
    <p class="muted small mono">${S.xp.toLocaleString("pt-BR")} XP · faltam ${LV-into} para o nível ${level+1}</p></section>
  <div class="stack">
    <div class="statrow">
      <div class="card stat"><span class="v">${effectiveStreak()}</span><span class="l">dias seguidos · recorde ${S.streak.best}</span></div>
      <div class="card stat"><span class="v">${S.freezes}</span><span class="l">proteções de sequência (ganhe 1 a cada 7 dias)</span></div>
      <div class="card stat"><span class="v">${acc}%</span><span class="l">acerto nas revisões</span></div>
      <div class="card stat"><span class="v">${S.journal.length}</span><span class="l">textos no diário</span></div>
    </div>
    <div class="card pad stack"><div class="row between"><h3>Constância — últimas 12 semanas</h3></div>
      <div class="heat-wrap"><div class="heat">${cells}</div></div>
      <div class="legend"><span><i style="background:var(--surface2)"></i>nenhuma sessão</span><span><i style="background:color-mix(in srgb,var(--acc) 45%,var(--surface2))"></i>1 sessão</span><span><i style="background:var(--acc)"></i>manhã e noite</span></div>
    </div>
    <div class="grid2">
      <div class="card pad stack"><h3>Trilha B1 → B2</h3>
        <div class="row" style="align-items:baseline"><span class="bignum">${path}%</span><span class="muted small">do conteúdo do app dominado</span></div>
        <div class="kv">
          <span>Vocabulário</span><span class="mono small">${Math.round(wordsP*100)}%</span><div class="bar"><span style="width:${wordsP*100}%"></span></div>
          <span>Gramática</span><span class="mono small">${Math.round(gAvg*100)}%</span><div class="bar"><span style="width:${gAvg*100}%"></span></div>
          <span>Compreensão oral</span><span class="mono small">${Math.round(listenP*100)}%</span><div class="bar"><span style="width:${listenP*100}%"></span></div>
          <span>Escrita</span><span class="mono small">${Math.round(writeP*100)}%</span><div class="bar"><span style="width:${writeP*100}%"></span></div>
        </div>
        <p class="small muted">Estimativa do app, não uma certificação. Para medir de verdade, faça um teste como o EF SET a cada 3 meses.</p>
      </div>
      <div class="card pad stack"><h3>Vocabulário</h3>
        <div class="stackbar" role="img" aria-label="Distribuição das palavras por estágio">
          <span style="width:${counts.lrn/total*100}%;background:var(--sun)"></span><span style="width:${counts.young/total*100}%;background:var(--moon)"></span><span style="width:${counts.mat/total*100}%;background:var(--ok)"></span></div>
        <div class="legend"><span><i style="background:var(--sun)"></i>Aprendendo ${counts.lrn}</span><span><i style="background:var(--moon)"></i>Jovens ${counts.young}</span><span><i style="background:var(--ok)"></i>Maduras ${counts.mat}</span><span><i style="background:var(--surface2)"></i>Não vistas ${counts.new}</span></div>
        <p class="small muted">“Madura” = intervalo de 21+ dias. É o sinal de que a palavra está na memória de longo prazo.</p>
        <hr class="sep"><h3>Ditado</h3>${spark()}
      </div>
    </div>
    <div class="card pad stack"><h3>Ajustes</h3>
      <div class="grid2">
        <div class="stack" style="gap:4px"><label for="s-acc">Sotaque</label><select id="s-acc"><option value="en-US" ${S.settings.accent==="en-US"?"selected":""}>Americano (en-US)</option><option value="en-GB" ${S.settings.accent==="en-GB"?"selected":""}>Britânico (en-GB)</option></select></div>
        <div class="stack" style="gap:4px"><label for="s-voice">Voz</label><select id="s-voice"><option value="">Automática (melhor disponível)</option>${voiceOpts}</select></div>
        <div class="stack" style="gap:4px"><label for="s-rate">Velocidade da fala: <span class="mono" id="rv">${S.settings.rate.toFixed(2)}×</span></label><input type="range" id="s-rate" min="0.6" max="1.2" step="0.05" value="${S.settings.rate}"></div>
        <div class="stack" style="gap:4px"><label for="s-new">Palavras novas por noite</label><select id="s-new">${[3,5,8,10].map(n=>`<option ${S.settings.newPerDay===n?"selected":""}>${n}</option>`).join("")}</select></div>
      </div>
      <div class="row"><button class="btn sm" id="tv">${ICON.speaker} Testar voz</button><span class="small muted"><span class="dot ${syncState==="cloud"?"ok":""}"></span> ${syncState==="cloud"?"Progresso salvo na sua conta — abre igual em outros dispositivos.":"Progresso salvo neste navegador."}</span></div>
      <hr class="sep">
      <h3>Backup</h3>
      <p class="small muted">Copie o código para guardar ou levar seu progresso para outro navegador. Para restaurar, cole e importe.</p>
      <textarea id="bk" rows="3" spellcheck="false" placeholder="Cole aqui um backup para importar"></textarea>
      <div class="row"><button class="btn sm" id="ex">Gerar e copiar backup</button><button class="btn sm" id="im">Importar backup</button><button class="btn sm ghost" id="rs" style="color:var(--bad)">Apagar todo o progresso</button></div>
      <div id="cfm"></div>
    </div>
  </div>`;
  $("#s-acc").onchange = e=>{ S.settings.accent=e.target.value; S.settings.voice=""; save(); renderProgress(); };
  $("#s-voice").onchange = e=>{ S.settings.voice=e.target.value; save(); };
  $("#s-rate").oninput = e=>{ S.settings.rate=+e.target.value; $("#rv").textContent=S.settings.rate.toFixed(2)+"×"; };
  $("#s-rate").onchange = ()=>save();
  $("#s-new").onchange = e=>{ S.settings.newPerDay=+e.target.value; save(); };
  $("#tv").onclick = ()=>speak("Consistency beats intensity. Fifteen minutes in the morning and fifteen at night.");
  $("#ex").onclick = ()=>{ const ta=$("#bk"); ta.value = JSON.stringify(S); ta.select();
    if(navigator.clipboard) navigator.clipboard.writeText(ta.value).then(()=>toast("Backup copiado"),()=>toast("Selecionado — copie com Ctrl+C")); else toast("Selecionado — copie com Ctrl+C"); };
  $("#im").onclick = ()=>{ let o; try{ o = JSON.parse($("#bk").value); if(!o || typeof o!=="object" || !o.cards) throw 0; }catch(e){ toast("Esse texto não é um backup válido"); return; }
    confirmBox("Substituir o progresso atual por este backup?","Importar",()=>{ S = merge(o); save(); toast("Backup importado"); renderProgress(); }); };
  $("#rs").onclick = ()=>confirmBox("Apagar XP, sequência, palavras e diário? Isso não pode ser desfeito.","Apagar tudo",()=>{ const keep=S.settings; S = defaultState(); S.settings=keep; save(); toast("Progresso apagado"); renderProgress(); });
}
function confirmBox(msg,label,fn){
  const c = $("#cfm"); c.innerHTML = `<div class="confirm"><span>${esc(msg)}</span><button class="btn sm" id="cy" style="color:var(--bad)">${esc(label)}</button><button class="btn sm ghost" id="cn">Cancelar</button></div>`;
  $("#cy").onclick = ()=>{ c.innerHTML=""; fn(); }; $("#cn").onclick = ()=>c.innerHTML="";
}

/* ============================================================
   BOOT
   ============================================================ */
loadLocal();
go("today");
initPlatform();
</script>
